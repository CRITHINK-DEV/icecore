name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# dbt's anonymous usage events cost about 0.45 s per dbt call, and the offline suite makes over a thousand.
env:
  DO_NOT_TRACK: "1"

# One run per pull request (or branch): a new push cancels the run of the previous one, which is out of date.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The offline suite in parts, each on its own runner (the latest dbt parses more slowly, so it gets more parts).
  offline-part:
    name: offline (${{ matrix.requirements }}, part ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {requirements: floor, shard: 1/2}
          - {requirements: floor, shard: 2/2}
          - {requirements: latest, shard: 1/3}
          - {requirements: latest, shard: 2/3}
          - {requirements: latest, shard: 3/3}
    env:
      ICECORE_TEST_SHARD: ${{ matrix.shard }}
    defaults:
      run:
        working-directory: integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integration_tests/requirements-${{ matrix.requirements }}.txt
      - run: pip install -r requirements-${{ matrix.requirements }}.txt
      # One worker per core (4 on GitHub's runners); conftest gives each its own dbt target folder.
      - run: pytest -m "not sandbox" -n auto

  # The checks the branch rules require ("offline (floor)", "offline (latest)"): green only when every part is.
  offline:
    name: offline (${{ matrix.requirements }})
    needs: offline-part
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        requirements: [floor, latest]
    steps:
      - run: test "${{ needs.offline-part.result }}" = success

  sandbox:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-floor.txt
      - name: Write private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/snowflake_key.p8"
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$key_path"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - run: pytest -m sandbox
      - name: Spike S4 with the pinned Elementary (macros/compat/ELEMENTARY_VERSION)
        # Separate venv: elementary-data pulls a newer dbt-core and would replace the dbt 1.8 floor above.
        # requirements-elementary.txt applies constraints-elementary.txt (dbt-core, sqlglot, pytest).
        run: |
          python -m venv elementary_probe/.venv
          elementary_probe/.venv/bin/pip install -r requirements-elementary.txt pytest
          elementary_probe/.venv/bin/pytest -m sandbox tests/spikes/test_s4_edr_contract.py
