name: icecore
version: "0.0.1"
config-version: 2
require-dbt-version: [">=1.8.0", "<3.0.0"]

macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  icecore:
    telemetry: true
    monitors: true
    cost: false
    root_cause: false
    alerts: false
    anomaly_engine: auto
    anomaly_sensitivity: medium
    anomaly_min_consecutive: 1
    shadow_engine: none
    payload_cap_kb: 64
