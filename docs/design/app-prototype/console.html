      <Kpi label="Tests passing" value={tids.length ? `${tids.length - failing.length} of ${tids.length}` : 'None'} tone={failing.length ? 'fail' : tids.length ? 'ok' : undefined} />
      <Kpi label="Open incidents" value={incs.length} tone={incs.length ? 'warn' : 'ok'} sub={incs.map(i => KIND_LABEL[i.kind]).join(', ')} />
      {SLA_BY[id] && <Kpi label="Schedule" value={SLA_BY[id].late ? 'Late' : 'On time'} tone={SLA_BY[id].late ? 'stale' : 'ok'} sub={`every ${SLA_BY[id].expected_every}, last ${fmtTs(SLA_BY[id].last)}`} />}
    </div>}
    <Tabs value={tab} onChange={setTab} tabs={tabs} />
    {tab === 'history' && <>
      <Card title={isTest ? 'Failing rows per run' : 'Build time and credits per run'} sub={isTest ? 'Green bars passed; red bars failed, height is the number of failing rows.' : 'Red bars are failed builds. Credits of the newest runs may not be attributed yet.'}>
        {(isTest || ex.length) ? <EChart option={histOpt} height={240} /> : <div className="empty-state"><b>No builds recorded</b>{n.type === 'source' ? 'Sources are not built; see Schedules & freshness for their data age.' : 'This node did not run in the window.'}</div>}
      </Card>
      {isTest ? <Card title="Results" flush><DataTable rows={RUNS.filter((r, i) => tarr[i] != null)} rowKey={r => r.invocation_id} onRow={r => go('runs', null, { run: r.invocation_id })} sort={{ key: 't', dir: -1 }}
        cols={[{ key: 't', label: 'Run', render: r => fmtTs(r.t) }, { key: 's', label: 'Result', render: r => <TestPill s={tarr[r.idx]} />, sort: r => tarr[r.idx] }, { key: 'f', label: 'Failing rows', num: true, render: r => TRF[id][r.idx] || 0, sort: r => TRF[id][r.idx] }, { key: 'inv', label: 'Run id', render: r => <span className="mono muted">{r.invocation_id}</span> }]} /></Card>
        : ex.length > 0 && <Card title="Builds" sub="Click a row to open the run timeline." flush><DataTable rows={ex.filter(Boolean)} rowKey={r => r.invocation_id} onRow={r => go('runs', null, { run: r.invocation_id })} sort={{ key: 't', dir: -1 }} maxH={380}
          cols={[{ key: 't', label: 'Run', render: r => fmtTs(RUNS[r.i].t), sort: r => r.t }, { key: 'status', label: 'Status', render: r => <RunPill s={r.status} /> }, { key: 'execution_time_s', label: 'Build time', num: true, desc: true, render: r => fmtSec(r.execution_time_s) }, { key: 'credits', label: 'Credits', num: true, desc: true, render: r => r.credits == null ? <span className="muted">Not yet attributed</span> : fmtCr(r.credits) }]} /></Card>}
    </>}
    {tab === 'tests' && <Card title="Tests on this node" sub="Click a row to open the test." flush>
      <DataTable rows={tids.map(t => NODE[t])} rowKey={r => r.unique_id} onRow={r => go('node', r.unique_id)} sort={{ key: 's', dir: 1 }} empty="No test is attached to this node. Add tests to cover it."
        cols={[{ key: 's', label: 'Status', render: r => <TestPill s={latestTest(r.unique_id)} />, sort: r => (isBad(latestTest(r.unique_id)) ? 0 : 1) }, { key: 'name', label: 'Test' }, { key: 'test_name', label: 'Type', render: r => r.test_name || 'singular' }, { key: 'column', label: 'Column', render: r => r.column || <span className="muted">—</span> }, { key: 'strip', label: 'Last 30 runs', ns: true, render: r => <RunStrip arr={TR[r.unique_id] || []} /> }]} />
    </Card>}
    {tab === 'metrics' && (sers.length ? <div className="grid2">
      <Card title={`${humanMetric(curSer.metric)} of ${n.name}`} sub="Observed against expected and its band. A red dot is a point outside the band." right={<div className="hstack">{sers.length > 1 && <select className="inp" value={curSer.key} onChange={e => setSer(e.target.value)}>{sers.map(x => <option key={x.key} value={x.key}>{humanMetric(x.metric)}</option>)}</select>}{Object.keys(curSer.pts).map(e => <EngineBadge key={e} e={e} />)}</div>}>
        <BandChart series={curSer} engine={Object.keys(curSer.pts)[0]} />
      </Card>
      <Card title="Shadow scoring" sub="Native and Cortex side by side."><ShadowPanel series={curSer} /></Card>
    </div> : <Card title="Metrics"><div className="empty-state"><b>No metric is monitored on {n.name}</b>{incs.some(i => i.kind === 'anomaly') ? 'An anomaly alert names this node, but no metric series was recorded for it in this window.' : 'Monitored metrics such as row count appear here with their expected band.'}</div></Card>)}
    {tab === 'schema' && <Card title="Schema history" flush>
      <DataTable rows={schema} rowKey={r => r.column + r.t} empty="No schema change detected on this table in the window."
        cols={[{ key: 't', label: 'Detected', render: r => fmtTs(r.t) }, { key: 'column', label: 'Column', render: r => <span className="mono">{r.column}</span> }, { key: 'change', label: 'Change', render: r => <Pill tone={r.change === 'added' ? 'ok' : r.change === 'removed' ? 'fail' : 'warn'}>{CHANGE_LABEL[r.change]}</Pill> }, { key: 'd', label: 'Details', ns: true, render: r => r.change === 'type_changed' ? `${r.from} to ${r.to}` : r.type }]} />
    </Card>}
    {tab === 'lineage' && <Card title="Lineage neighbourhood" sub="Two steps up and down from this node. Click a node to open it." flush right={<button className="btn" onClick={() => go('lineage', null, { focus: target || id, mode: 'both' })}>Open full lineage</button>}>
      {target ? <div className="lin-wrap mini"><LineageCanvas compact ids={hood(target, 2)} focus={target} mode="both" onSelect={x => x && go('node', x)} /></div> : <div className="empty-state">This test has no model in the graph.</div>}
    </Card>}
  </div>;
}

/* ---------------- Settings ---------------- */
function Settings() {
  const { incidents } = useApp();
  const channels = {}; incidents.forEach(i => { channels[i.channel] = (channels[i.channel] || 0) + 1; });
  return <div className="page">
    <PageHead title="Settings & about" sub="What this account can do, the versions in use, and where alerts go." />
    <div className="kpis">
      <Kpi label="Edition" value={CAP.edition || '—'} />
      <Kpi label="icecore version" value={CAP.icecore_version || '—'} />
      <Kpi label="Cortex anomaly engine" value={CAP.cortex ? 'Available' : 'Not available'} tone={CAP.cortex ? 'ok' : 'warn'} sub={CAP.cortex ? 'can shadow-score metrics' : 'native engine only'} />
      <Kpi label="Alert channels" value={Object.keys(channels).length} />
    </div>
    <div className="grid2 even">
      <Card title="Capabilities" flush><div className="kv">
        <div>Project</div><div>{D.project}</div>
        <div>Edition</div><div>{CAP.edition}</div>
        <div>Event table</div><div className="mono">{CAP.event_table}</div>
        <div>Cortex</div><div>{CAP.cortex ? 'Available' : 'Not available'}</div>
        <div>icecore version</div><div>{CAP.icecore_version}</div>
        <div>dbt versions</div><div>{(CAP.dbt_versions || []).join('; ')}</div>
        <div>Report generated</div><div>{fmtTs(parseT(D.generated_at))}</div>
        <div>Latest run</div><div>{fmtTs(RUNS[LAST].t)}</div>
      </div></Card>
      <Card title="Alert channels" sub="Channels that received incidents in the window." flush>
        <DataTable rows={Object.entries(channels).map(([c, n]) => ({ c, n }))} rowKey={r => r.c} sort={{ key: 'n', dir: -1 }} cols={[{ key: 'c', label: 'Channel' }, { key: 'n', label: 'Incidents', num: true, desc: true }]} />
      </Card>
    </div>
    <Card title="Health score" sub="Shown per layer on the Overview; the same formula appears when you hover a layer tile.">
      <div style={{ maxWidth: '76ch', color: 'var(--ink-2)' }}>
        <p style={{ marginTop: 0 }}>Each test scores 100 when it passes, 50 on a warning and 0 when it fails. The layer score is a weighted average:</p>
        <p className="mono" style={{ background: 'var(--bg)', padding: '8px 10px', borderRadius: 6 }}>score = (0.50 × tests + 0.20 × freshness + 0.15 × schedules + 0.15 × anomalies) ÷ weights used</p>
        <p>Freshness is the share of the layer's models built successfully in the latest run. Schedules is the share of declared schedules met. Anomalies is the share of monitored metrics inside their expected band. A part with no data is left out and the other weights are rescaled. Gold includes gold analytics models.</p>
      </div>
    </Card>
  </div>;
}

/* ---------------- shell ---------------- */
function parseHash() {
  const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const parts = (path || '').split('/').filter(Boolean);
  const q = {}; new URLSearchParams(qs || '').forEach((v, k) => { q[k] = v; });
  return { page: parts[0] || 'overview', arg: parts.slice(1).map(decodeURIComponent).join('/'), q };
}
const hashFor = (page, arg, q) => { let h = '#/' + page + (arg ? '/' + encodeURIComponent(arg) : ''); if (q) { const s = new URLSearchParams(Object.entries(q).filter(([, v]) => v != null && v !== '')).toString(); if (s) h += '?' + s; } return h; };

function GlobalSearch() {
  const { go, status } = useApp();
  const [q, setQ] = useState(''); const [i, setI] = useState(0);
  const res = q ? D.nodes.filter(n => n.name.toLowerCase().includes(q.toLowerCase())).sort((a, b) => (a.type === 'test') - (b.type === 'test') || a.name.length - b.name.length).slice(0, 10) : [];
  const pick = n => { go('node', n.unique_id); setQ(''); };
  return <div className="gsearch">
    <Ic d={ICON.search} s={14} />
    <input placeholder="Search models, sources, tests" value={q} aria-label="Search nodes" onChange={e => { setQ(e.target.value); setI(0); }}
      onKeyDown={e => { if (e.key === 'ArrowDown') { setI(x => Math.min(x + 1, res.length - 1)); e.preventDefault(); } else if (e.key === 'ArrowUp') { setI(x => Math.max(x - 1, 0)); e.preventDefault(); } else if (e.key === 'Enter' && res[i]) pick(res[i]); else if (e.key === 'Escape') setQ(''); }} />
    {q && <div className="res" role="listbox">{res.length ? res.map((n, k) => <button key={n.unique_id} className={k === i ? 'on' : ''} role="option" aria-selected={k === i} onMouseDown={e => { e.preventDefault(); pick(n); }}>
      <span>{n.name}</span><span className="muted">{n.type === 'test' ? <TestPill s={latestTest(n.unique_id)} /> : <StatusPill s={status[n.unique_id].status} />}</span></button>)
      : <div className="muted" style={{ padding: 8 }}>No node named like “{q}”.</div>}</div>}
  </div>;
}

function App() {
  const [route, setRoute] = useState(parseHash());
  const [theme, setTheme] = useState(document.documentElement.dataset.theme || 'light');
  const [incidents, setIncidents] = useState(() => D.incidents.map(i => ({ ...i, state: i.acknowledged_by ? 'acknowledged' : 'open' })));
  const [toast, setToast] = useState(null);
  useEffect(() => { const f = () => { setRoute(parseHash()); }; window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3200); return () => clearTimeout(t); }, [toast]);
  const go = (page, arg, q) => { location.hash = hashFor(page, arg, q); const m = document.querySelector('.main'); if (m && page !== route.page) m.scrollTop = 0; };
  const nav = (page, arg, q) => { history.replaceState(null, '', hashFor(page, arg, q)); setRoute(parseHash()); };
  const toggleTheme = () => { const t = theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('icecore-theme', t); } catch (e) { } setTheme(t); };
  const act = (key, state) => {
    setIncidents(list => list.map(i => i.incident_key !== key ? i : { ...i, state, acknowledged_by: state === 'acknowledged' ? (i.acknowledged_by || 'you') : state === 'open' ? null : i.acknowledged_by, resolvedAt: state === 'resolved' ? AS_OF : null }));
    const i = incidents.find(x => x.incident_key === key);
    setToast(`${state === 'acknowledged' ? 'Acknowledged' : state === 'resolved' ? 'Resolved' : 'Reopened'}: ${i ? i.title : key}`);
  };
  const status = useMemo(() => computeStatus(incidents), [incidents]);
  const health = useMemo(() => computeHealth(incidents), [incidents]);
  const ctx = { route, go, nav, theme, incidents, act, status, health };
  const openN = incidents.filter(i => i.state === 'open').length;
  const late = SLAS.filter(s => s.late).length + incidents.filter(i => i.kind === 'silence' && i.state !== 'resolved' && !(SLA_BY[incAsset(i)] || {}).late).length;
  const items = [
    ['overview', 'Overview', ICON.overview],
    ['incidents', 'Incidents', ICON.incidents, openN, 'fail'],
    ['tests', 'Tests & anomalies', ICON.tests, FAILS[LAST] || null, 'fail'],
    ['runs', 'Runs', ICON.runs, RUNS[LAST].status !== 'success' ? '!' : null, 'fail'],
    ['freshness', 'Schedules & freshness', ICON.fresh, late || null, 'stale'],
    ['schema', 'Schema changes', ICON.schema, SCHEMA.length || null, 'warn'],
    ['cost', 'Cost', ICON.cost],
    null,
    ['lineage', 'Lineage', ICON.lineage],
    ['models', 'Models & sources', ICON.models, ASSETS.length, ''],
    null,
    ['settings', 'Settings & about', ICON.settings],
  ];
  const active = route.page === 'node' ? (NODE[route.arg] && NODE[route.arg].type === 'test' ? 'tests' : 'models') : route.page;
  let page;
  switch (route.page) {
    case 'incidents': page = <Incidents />; break;
    case 'tests': page = <Tests />; break;
    case 'runs': page = <Runs />; break;
    case 'lineage': page = <Lineage />; break;
    case 'cost': page = <Cost />; break;
    case 'freshness': page = <Freshness />; break;
    case 'schema': page = <Schema />; break;
    case 'models': page = <Models />; break;
    case 'node': page = <NodePage id={route.arg} />; break;
    case 'settings': page = <Settings />; break;
    default: page = <Overview />;
  }
  return <Ctx.Provider value={ctx}>
    <div className="app">
      <header className="top">
        <div className="brand"><Ic d={ICON.core} s={18} />icecore</div>
        <div className="proj"><b>{D.project}</b><span className="env">{RUNS[LAST].target}</span></div>
        <div className="grow" />
        <GlobalSearch />
        <span className="asof" title="Latest data in this report">Data as of {fmtTs(AS_OF)}</span>
        <button className="iconbtn" onClick={toggleTheme} aria-label={theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'} title={theme === 'dark' ? 'Light theme' : 'Dark theme'}><Ic d={theme === 'dark' ? ICON.sun : ICON.moon} s={15} /></button>
      </header>
      <nav className="side" aria-label="Sections">
        {items.map((it, k) => it ? <button key={it[0]} className={'nav' + (active === it[0] ? ' on' : '')} aria-current={active === it[0] ? 'page' : undefined} onClick={() => go(it[0])}>
          <Ic d={it[2]} />{it[1]}{it[3] != null && <span className={'cnt ' + (it[4] || '')}>{it[3]}</span>}</button> : <hr key={'h' + k} />)}
        <div className="foot">Static report of {fmtTs(parseT(D.generated_at))}. Acknowledgements are kept in this tab only.</div>
      </nav>
      <main className="main" key={route.page + '/' + route.arg}>{page}</main>
    </div>
    {toast && <div className="toast" role="status">{toast}</div>}
  </Ctx.Provider>;
}

try { const t = localStorage.getItem('icecore-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) { }
if (!D) { document.getElementById('root').innerHTML = '<p style="padding:24px">icecore-mock-data.js did not load. Keep it next to this file.</p>'; }
else ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
