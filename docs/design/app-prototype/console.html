<!doctype html>
<!--
DIRECTION D: Console
1. Idea: a quiet, dense, tabbed workspace that sits naturally beside a warehouse web console; every page has the same anatomy: title, 3-5 KPI tiles with sparklines, a filter bar, one chart, one table; a row click opens the node page.
2. Suits: the platform lead doing the morning check and the engineer triaging an alert, who both want one predictable layout everywhere and plain status pills over decoration.
3. Great: one learned pattern for ten sections; a transparent health score per layer (formula on hover); failures-first tables; lineage with status overlay and root-cause path; credits next to duration everywhere.
4. Cost to build: low. About 90% maps 1:1 to stock Streamlit (st.metric, st.dataframe, st.tabs, Altair); the only custom component is the React Flow lineage. Roughly 1-2 weeks.
5. Generated report: this file is the report. The CLI writes the views as JSON in place of icecore-mock-data.js; Acknowledge/Resolve stay local (session) in the static file.
6. Streamlit: one st.navigation page per left-nav entry, URL state in st.query_params; the element map below says which widget renders what and what Streamlit cannot do natively.

STREAMLIT ELEMENT MAP (target: Streamlit >= 1.45, local and in Snowflake)
- Left nav with counts ............ st.navigation([st.Page(...)]) in the sidebar; counts go in the page title ("Incidents (4)"). No coloured badges natively.
- Top bar search .................. st.selectbox over node names (accepts typing) -> st.switch_page + st.query_params["node"].
- Theme toggle .................... built-in settings menu (light/dark); custom tokens via .streamlit/config.toml [theme] + [theme.dark].
- Page header + KPI tiles ......... st.title + st.caption; st.columns(5) of st.metric(label, value, delta, help=..., border=True, chart_data=series, chart_type="line"|"bar").
- Health score tile + formula ..... st.metric(..., help="formula as markdown"): the hover tooltip shows the formula. The bronze > silver > gold pipeline strip and per-component bars need st.html (static) or are dropped.
- Filter bar ...................... st.columns with st.segmented_control / st.pills (status, layer, window), st.multiselect, st.text_input, st.number_input; values mirrored in st.query_params.
- Primary table + status pills .... st.dataframe(df, column_config={TextColumn, NumberColumn(format), ProgressColumn, LineChartColumn/BarChartColumn for sparklines, LinkColumn}), hide_index=True.
                                    Pills: no coloured chip column type; use emoji-prefixed TextColumn ("🔴 Failed") or pandas Styler cell colours.
- Row click -> node page .......... st.dataframe(on_select="rerun", selection_mode="single-row") then st.switch_page("node.py") with st.query_params.
- "Last 30 runs" strip ............ BarChartColumn of 0/1 values (no per-bar colour), or Altair rect heatmap.
- Tabs (Open/Ack/Resolved etc.) ... st.tabs (labels carry counts). Note st.tabs renders all tabs every run; use st.segmented_control when tabs are heavy.
- Acknowledge / Resolve ........... st.button per selected row (or st.data_editor checkbox column) -> UPDATE on the ack table -> st.rerun(); st.toast for feedback.
- Charts .......................... Altair via st.altair_chart: bars + rule lines, band chart = mark_area(y=lower,y2=upper) + mark_line(expected, dashed) + mark_line(observed) + mark_point(anomaly);
                                    Gantt = mark_bar(x=start, x2=end, y=node); timeline of incidents = mark_bar(x, x2). Chart click -> st.altair_chart(on_select="rerun") with a point selection.
                                    (streamlit-echarts could reuse these ECharts options verbatim, but it is a third-party component.)
- Shadow scoring (native vs Cortex) two st.columns of st.metric + st.dataframe of the joined points.
- Lineage ......................... CUSTOM COMPONENT (React + reactflow@11 + dagre), the one place it is unavoidable: pan/zoom/minimap, status overlay, upstream/downstream highlight,
                                    root-cause path, layer filter, search, node side panel; returns the clicked node id to Python (Streamlit.setComponentValue). Same bundle as the Native App.
- Node side panel ................. st.dialog or a right st.columns pane.
WHAT STREAMLIT CANNOT DO NATIVELY: coloured pills inside dataframe cells (only Styler/emoji); hover-linked highlight across charts and tables; inline expanding rows; a keyboard-first
  table with sticky filter bar; badges in the nav; rich hover popovers (only plain `help` tooltips); any graph/lineage interaction; instant client-side ack without a rerun.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icecore console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css">
<style>
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --side:#F9FAFB; --ink:#17202D; --ink-2:#465265; --ink-3:#778194;
  --line:#DFE3E9; --line-2:#ECEFF3; --hover:#F1F4F8; --sel:#E8F0FB;
  --accent:#1D5FB0; --accent-soft:#E5EEF9; --band:rgba(29,95,176,.13); --bar:#A9BCD6;
  --fail:#C2342A; --fail-soft:#FBE8E6; --warn:#A5680B; --warn-soft:#FBF0DC; --ok:#1E7A4F; --ok-soft:#E2F2E9;
  --stale:#6A4DB8; --stale-soft:#EEE9FA; --muted:#8A93A1; --muted-soft:#EDEFF2;
  --bronze:#A3632C; --silver:#7B8899; --gold:#B5880F; --transient:#3C8293; --sources:#98A1AE; --snapshot:#8A6BB3;
  --shadow:0 1px 2px rgba(16,24,40,.05); --pop:0 10px 30px rgba(16,24,40,.16);
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#121821; --panel:#18202B; --side:#151C26; --ink:#E5EAF1; --ink-2:#AEB8C6; --ink-3:#7F8A9B;
  --line:#28323F; --line-2:#212A36; --hover:#1E2733; --sel:#1C2B40;
  --accent:#6EA6EE; --accent-soft:#1B2C44; --band:rgba(110,166,238,.18); --bar:#3C5476;
  --fail:#F0766B; --fail-soft:#3A1F21; --warn:#E3A847; --warn-soft:#382B17; --ok:#5CC48E; --ok-soft:#173226;
  --stale:#A592EE; --stale-soft:#2A2442; --muted:#7F8A9B; --muted-soft:#232C38;
  --bronze:#CF8A4F; --silver:#A3B0C1; --gold:#DDB33E; --transient:#5FB0C2; --sources:#7F8A9B; --snapshot:#AA8FD6;
  --shadow:0 1px 2px rgba(0,0,0,.3); --pop:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:11.5px}
.muted{color:var(--ink-3)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);height:100vh}
/* top bar */
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 16px 0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em;width:186px}
.brand svg{color:var(--accent)}
.proj{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.proj b{font-weight:600;color:var(--ink)}
.env{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.top .grow{flex:1}
.gsearch{position:relative;width:min(340px,32vw)}
.gsearch input{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 10px 0 30px}
.gsearch svg{position:absolute;left:9px;top:8px;color:var(--ink-3)}
.gsearch .res{position:absolute;top:34px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--pop);z-index:50;max-height:320px;overflow:auto;padding:4px}
.gsearch .res button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;background:none;padding:6px 8px;border-radius:5px;text-align:left;cursor:pointer}
.gsearch .res button:hover,.gsearch .res button.on{background:var(--hover)}
.asof{color:var(--ink-3);font-size:12px;white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--hover)}
/* side nav */
.side{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:12px 10px}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);text-align:left;font-weight:500}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav.on{background:var(--sel);color:var(--accent);font-weight:600}
.nav svg{flex:none}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;padding:0 6px;border-radius:9px;line-height:17px;background:var(--muted-soft);color:var(--ink-2)}
.nav .cnt.fail{background:var(--fail-soft);color:var(--fail)} .nav .cnt.warn{background:var(--warn-soft);color:var(--warn)} .nav .cnt.stale{background:var(--stale-soft);color:var(--stale)}
.side .foot{margin:14px 10px 0;color:var(--ink-3);font-size:11.5px;line-height:1.5}
/* main */
.main{overflow:auto;min-width:0}
.page{padding:20px 28px 48px;max-width:1500px}
.crumbs{color:var(--ink-3);font-size:12px;margin-bottom:4px}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.ph h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.015em}
.ph p{margin:3px 0 0;color:var(--ink-3);max-width:76ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px 10px;min-width:0;box-shadow:var(--shadow)}
.kpi-label{color:var(--ink-2);font-size:12px;display:flex;gap:5px;align-items:center}
.kpi-label .help{display:inline-flex;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);font-size:9.5px;align-items:center;justify-content:center;color:var(--ink-3);cursor:help}
.kpi-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:3px}
.kpi-value{font-size:23px;font-weight:650;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.kpi-value .unit{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:3px}
.kpi-sub{color:var(--ink-3);font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-fail{color:var(--fail)} .t-warn{color:var(--warn)} .t-ok{color:var(--ok)} .t-stale{color:var(--stale)}
.delta{font-weight:600;margin-right:5px} .delta.bad{color:var(--fail)} .delta.good{color:var(--ok)} .delta.flat{color:var(--ink-3)}
/* filter bar */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.fgrp{display:flex;align-items:center;gap:7px}
.fgrp > label,.fgrp > span.l{color:var(--ink-3);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:4px 10px;cursor:pointer;color:var(--ink-2);font-size:12px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.seg button:disabled{opacity:.45;cursor:default}
.inp{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 9px;min-width:0}
.inp.num{width:70px}
select.inp{padding-right:4px}
/* cards */
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 14px 0}
.card-h h3{margin:0;font-size:13.5px;font-weight:650}
.card-h p{margin:2px 0 0;color:var(--ink-3);font-size:12px}
.card-b{padding:8px 14px 12px}
.card-b.flush{padding:8px 0 0}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;background:none;padding:8px 12px 9px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-size:11px;padding:0 6px;border-radius:9px;background:var(--muted-soft);color:var(--ink-2);line-height:17px}
.tab .sev{font-size:11px;color:var(--ink-3);font-weight:400}
/* table */
.tbl-wrap{overflow:auto;border-top:1px solid var(--line-2)}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{position:sticky;top:0;z-index:1;background:var(--panel);text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.ns{cursor:default}
.tbl th .sort{font-size:8px;margin-left:4px;color:var(--accent)}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.tbl td:first-child,.tbl th:first-child{padding-left:14px}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl tr.sel td{background:var(--sel)}
.tbl td.empty{text-align:center;color:var(--ink-3);padding:22px;white-space:normal}
.tbl .num{text-align:right}
.tbl .wrap{white-space:normal;min-width:220px}
.cell2{display:flex;flex-direction:column;line-height:1.3}
.cell2 small{color:var(--ink-3);font-size:11px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px 1px 7px;border-radius:10px;line-height:18px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-fail{background:var(--fail-soft);color:var(--fail)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)}
.p-stale{background:var(--stale-soft);color:var(--stale)} .p-muted{background:var(--muted-soft);color:var(--ink-2)} .p-info{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:0 7px;border-radius:4px;line-height:18px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel);white-space:nowrap}
.badge.cortex{border-color:var(--stale);color:var(--stale)}
.badge.native{border-color:var(--accent);color:var(--accent)}
.lyr{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.lyr i{width:8px;height:8px;border-radius:2px;display:inline-block}
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12px;font-weight:600;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#0E1620}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.strip{display:block}
.empty-state{padding:26px 18px;text-align:center;color:var(--ink-2)}
.empty-state b{display:block;color:var(--ink);margin-bottom:4px}
.note{font-size:12px;color:var(--ink-3);margin-top:-4px;margin-bottom:12px}
/* health pipeline */
.health{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;align-items:stretch;margin-bottom:14px}
.hjoin{display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.htile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px 12px 16px;box-shadow:var(--shadow);cursor:help;overflow:visible}
.htile::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--lc)}
.htile:hover,.htile:focus-visible{border-color:var(--lc)}
.htop{display:flex;justify-content:space-between;align-items:baseline}
.hname{font-weight:650;font-size:13.5px}
.hname small{font-weight:400;color:var(--ink-3);margin-left:6px;font-size:12px}
.hscore{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hscore span{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:2px}
.hcomps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.hc{font-size:11px;color:var(--ink-3)}
.hc .bar{height:4px;border-radius:2px;background:var(--line-2);margin:4px 0 2px;overflow:hidden}
.hc .bar i{display:block;height:100%;border-radius:2px}
.hc b{color:var(--ink-2);font-weight:600}
.hpop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--pop);padding:12px 14px;cursor:auto;color:var(--ink-2);font-size:12px;display:none}
.htile:hover .hpop,.htile:focus-within .hpop,.htile:focus .hpop{display:block}
.hpop h4{margin:0 0 6px;color:var(--ink);font-size:12.5px}
.hpop .f{font-family:var(--mono);font-size:11px;background:var(--bg);border-radius:5px;padding:6px 8px;margin:6px 0;color:var(--ink)}
.hpop table{width:100%;border-collapse:collapse;margin-top:4px}
.hpop td{padding:3px 4px;border-top:1px solid var(--line-2);vertical-align:top}
.hpop td.n{text-align:right;white-space:nowrap;color:var(--ink)}
.hpop .drop{color:var(--ink-3);font-style:italic}
/* lineage */
.lin-wrap{position:relative;height:calc(100vh - 48px - 178px);min-height:540px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lin-wrap.mini{height:380px;min-height:0;border:0;border-radius:0}
.lin-tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ice-node{width:196px;height:48px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:6px 9px 6px 13px;position:relative;font-size:12px;color:var(--ink);box-shadow:var(--shadow);transition:opacity .15s}
.ice-node .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:7px 0 0 7px;background:var(--sc)}
.ice-node .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.ice-node .meta{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:10.5px;margin-top:2px;white-space:nowrap}
.ice-node .meta i{width:7px;height:7px;border-radius:2px;display:inline-block}
.ice-node .dot{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--sc)}
.ice-node .nb{margin-left:auto;color:var(--ink-2)}
.ice-node .nb.f{color:var(--fail);font-weight:600}
.ice-node.dim{opacity:.28}
.ice-node.hl{border-color:var(--accent)}
.ice-node.sel{box-shadow:0 0 0 2px var(--accent)}
.ice-node.root{box-shadow:0 0 0 2px var(--fail);border-color:var(--fail)}
.ice-node.impacted{border:1px dashed var(--warn)}
.ice-node .tag{position:absolute;top:-9px;left:10px;font-size:10px;font-weight:700;padding:0 6px;border-radius:8px;line-height:16px}
.ice-node .tag.r{background:var(--fail);color:#fff}
.ice-node .tag.i{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.s-failed{--sc:var(--fail)} .s-warn{--sc:var(--warn)} .s-ok{--sc:var(--ok)} .s-stale{--sc:var(--stale)} .s-notrun{--sc:var(--muted)}
.react-flow__handle{opacity:0;width:4px;height:4px;min-width:0;min-height:0;border:0}
.react-flow__attribution{background:transparent!important;font-size:9px}
.react-flow__controls{box-shadow:var(--shadow);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.react-flow__controls-button{background:var(--panel);border-bottom:1px solid var(--line);fill:var(--ink-2)}
.react-flow__controls-button:hover{background:var(--hover)}
.react-flow__controls-button svg{fill:var(--ink-2)}
.react-flow__minimap{background:var(--bg);border:1px solid var(--line);border-radius:6px}
.lpanel{position:absolute;z-index:6;top:10px;right:10px;width:310px;max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--pop);padding:12px 14px}
.lpanel h4{margin:0;font-size:14px;word-break:break-all}
.lpanel .x{position:absolute;right:8px;top:8px}
.lpanel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:12px}
.lpanel dt{color:var(--ink-3)} .lpanel dd{margin:0;text-align:right}
.lpanel .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lpanel ul{margin:4px 0 0;padding-left:16px;color:var(--ink-2)}
.lpanel .sec{border-top:1px solid var(--line-2);margin-top:10px;padding-top:8px}
.lpanel .sec > b{font-size:12px}
.rc-box{background:var(--fail-soft);color:var(--ink);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:12px}
.legend{position:absolute;z-index:5;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow);font-size:11.5px;display:flex;flex-direction:column;gap:3px;max-width:240px}
.legend .row{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.legend .row i{width:9px;height:9px;border-radius:50%}
.legend .row b{margin-left:auto;color:var(--ink);font-weight:600;padding-left:12px}
.legend .fl{border-top:1px solid var(--line-2);margin-top:5px;padding-top:6px}
.legend .fl button{display:block;border:0;background:none;padding:2px 0;color:var(--fail);cursor:pointer;font-weight:600;text-align:left}
.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:7px;box-shadow:var(--pop);font-size:12.5px;max-width:420px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:0;font-size:12.5px}
.kv div{padding:7px 14px;border-bottom:1px solid var(--line-2)}
.kv div:nth-child(odd){color:var(--ink-3)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.reasons span{font-size:12px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.hstack{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.linkish:hover{text-decoration:underline}
@media (max-width:1180px){ .grid2,.grid2.even{grid-template-columns:minmax(0,1fr)} .page{padding:16px 18px 40px} }
@media (max-width:1100px){ .app{grid-template-columns:196px minmax(0,1fr)} .brand{width:164px} .asof{display:none} .hcomps{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

<body>
<div id="root"></div>
<noscript>This report needs JavaScript to render.</noscript>
<script src="icecore-mock-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const { useState, useMemo, useEffect, useRef, useContext, createContext, Fragment } = React;
const RF = window.ReactFlow;
const ReactFlowView = RF.default || RF.ReactFlow;
const { MiniMap, Controls, Background, Handle, Position, MarkerType, useReactFlow } = RF;
const D = window.ICECORE_DATA;

/* ---------------- time + format helpers ---------------- */
const MS = { s: 1e3, m: 60e3, h: 3600e3, d: 86400e3 };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2, '0');
const parseT = s => (s ? new Date(String(s).slice(0, 23)).getTime() : null);
const fmtDay = t => { const d = new Date(t); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtTs = t => { if (t == null) return '—'; const d = new Date(t); return `${MON[d.getMonth()]} ${d.getDate()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtRun = t => { const d = new Date(t); return `${MON[d.getMonth()]} ${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtSec = s => (s == null ? '—' : s < 60 ? `${s.toFixed(1)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`);
const fmtSpan = ms => { const a = Math.abs(ms); return a < MS.h ? `${Math.round(a / MS.m)} min` : a < 2 * MS.d ? `${(a / MS.h).toFixed(1)} h` : `${(a / MS.d).toFixed(1)} days`; };
const fmtCr = c => (c == null ? '—' : c < 0.1 ? c.toFixed(4) : c.toFixed(3));
const fmtNum = v => { if (v == null) return '—'; const a = Math.abs(v); return a >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : a >= 1e4 ? (v / 1e3).toFixed(1) + 'k' : v.toLocaleString('en-US'); };
const pct = v => (v == null ? 'n/a' : `${v.toFixed(v >= 99.95 || v === 0 ? 0 : 1)}%`);
const durStr = s => { const m = /^(\d+(?:\.\d+)?)([smhd])$/.exec(s || ''); return m ? +m[1] * MS[m[2]] : 0; };
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const median = a => { const b = a.filter(v => v != null).sort((x, y) => x - y); if (!b.length) return null; const m = Math.floor(b.length / 2); return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const humanMetric = m => ({ row_count: 'Row count', freshness_lag_minutes: 'Freshness lag' }[m] || m.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()));
const metricUnit = m => (/minutes$/.test(m) ? 'minutes' : m === 'row_count' ? 'rows' : 'value');
const RC_KIND = { stale_source: 'Stale source' };
const rcKind = k => (k ? RC_KIND[k] || k.replace(/_/g, ' ') : '');

/* ---------------- data model (derived only from window.ICECORE_DATA) ---------------- */
const RUNS = [...D.runs].sort((a, b) => parseT(a.started_at) - parseT(b.started_at)).map((r, i) => ({ ...r, t: parseT(r.started_at), idx: i }));
const NR = RUNS.length, LAST = NR - 1;
const RUN_IDX = {}; RUNS.forEach((r, i) => { RUN_IDX[r.invocation_id] = i; });
const AS_OF = Math.max(parseT(D.generated_at), ...RUNS.map(r => r.t + r.duration_s * 1000));
const NODE = {}; D.nodes.forEach(n => { NODE[n.unique_id] = n; });
const ASSETS = D.nodes.filter(n => n.type !== 'test');
const TESTS = D.nodes.filter(n => n.type === 'test');
const BY_NAME = {}; ASSETS.forEach(n => { BY_NAME[n.name] = n.unique_id; });
const PARENTS = {}, CHILDREN = {};
ASSETS.forEach(n => { PARENTS[n.unique_id] = n.depends_on.filter(p => NODE[p] && NODE[p].type !== 'test'); CHILDREN[n.unique_id] = []; });
ASSETS.forEach(n => PARENTS[n.unique_id].forEach(p => CHILDREN[p].push(n.unique_id)));
const testTarget = t => { const d = (t.depends_on || []).filter(x => NODE[x]); return d.length ? d[d.length - 1] : null; };
const TESTS_OF = {}; TESTS.forEach(t => { const m = testTarget(t); if (m) { (TESTS_OF[m] = TESTS_OF[m] || []).push(t.unique_id); } });
const TR = {}, TRF = {};
D.test_results.forEach(r => {
  const i = RUN_IDX[r.invocation_id]; if (i == null) return;
  if (!TR[r.test_unique_id]) { TR[r.test_unique_id] = Array(NR).fill(null); TRF[r.test_unique_id] = Array(NR).fill(null); }
  TR[r.test_unique_id][i] = r.status; TRF[r.test_unique_id][i] = r.failures;
});
const isBad = s => s === 'fail' || s === 'error';
const TRC = {};
D.test_results.forEach(r => { const i = RUN_IDX[r.invocation_id]; if (i == null || !r.root_cause_unique_id) return; if (!TRC[r.test_unique_id] || i > TRC[r.test_unique_id].i) TRC[r.test_unique_id] = { id: r.root_cause_unique_id, kind: r.root_cause_kind, i }; });
const latestIdx = tid => { const a = TR[tid]; if (!a) return -1; for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return i; return -1; };
const latestTest = tid => { const i = latestIdx(tid); return i < 0 ? null : TR[tid][i]; };
const FAILS = RUNS.map((r, i) => TESTS.filter(t => TR[t.unique_id] && isBad(TR[t.unique_id][i])).length);
const TESTED = RUNS.map((r, i) => TESTS.filter(t => TR[t.unique_id] && TR[t.unique_id][i] != null).length);
const EX = {}, EX_RUN = {};
D.node_executions.forEach(e => {
  const i = RUN_IDX[e.invocation_id]; if (i == null) return;
  const x = { ...e, t: parseT(e.started_at), i };
  if (!EX[e.unique_id]) EX[e.unique_id] = Array(NR).fill(null);
  EX[e.unique_id][i] = x; (EX_RUN[e.invocation_id] = EX_RUN[e.invocation_id] || []).push(x);
});
Object.values(EX_RUN).forEach(a => a.sort((x, y) => x.t - y.t));
const SERIES = {};
D.metrics.forEach(m => {
  const k = m.unique_id + '|' + m.metric;
  if (!SERIES[k]) SERIES[k] = { key: k, uid: m.unique_id, relation: m.relation, metric: m.metric, pts: {} };
  (SERIES[k].pts[m.engine] = SERIES[k].pts[m.engine] || []).push({ ...m, t: parseT(m.observed_at) });
});
Object.values(SERIES).forEach(s => Object.values(s.pts).forEach(a => a.sort((x, y) => x.t - y.t)));
const SERIES_LIST = Object.values(SERIES);
const seriesLatest = s => { let best = null; Object.values(s.pts).forEach(a => { const p = a[a.length - 1]; if (p && (!best || p.t > best.t)) best = p; }); return best; };
const seriesAnomalous = s => Object.values(s.pts).some(a => a.length && a[a.length - 1].anomaly);
const SLAS = D.slas.map(s => { const last = parseT(s.last_success_at); const allowed = durStr(s.expected_every) + durStr(s.grace); const due = last + allowed; return { ...s, last, allowed, due, late: AS_OF > due, used: (AS_OF - last) / allowed }; });
const SLA_BY = {}; SLAS.forEach(s => { SLA_BY[s.unique_id] = s; });
const FRESH = {}; D.source_freshness.forEach(f => { FRESH[f.unique_id] = f; });
const SCHEMA = D.schema_changes.map(c => ({ ...c, t: parseT(c.detected_at) })).sort((a, b) => b.t - a.t);
const CAP = D.capabilities || {};

const LAYER_GROUP = l => ({ gold_analytics: 'gold', gold: 'gold', silver: 'silver', bronze: 'bronze', transient: 'transient', seed: 'sources', source: 'sources', snapshot: 'snapshot' }[l] || l);
const LAYER_LABEL = { sources: 'Sources & seeds', transient: 'Transient', bronze: 'Bronze', silver: 'Silver', gold: 'Gold', snapshot: 'Snapshots' };
const LAYER_ORDER = ['sources', 'transient', 'bronze', 'silver', 'gold', 'snapshot'];
const KIND_LABEL = { test_failure: 'Test failure', anomaly: 'Anomaly', schema_change: 'Schema change', silence: 'Missed schedule', cost: 'Cost' };
const STATUS_LABEL = { failed: 'Failed', warn: 'Warning', stale: 'Late', ok: 'OK', notrun: 'Not run' };
const STATUS_TONE = { failed: 'fail', warn: 'warn', stale: 'stale', ok: 'ok', notrun: 'muted' };
const CHANGE_LABEL = { added: 'Column added', removed: 'Column removed', type_changed: 'Type changed' };

const incNode = inc => { if (inc.node_unique_id && NODE[inc.node_unique_id]) return inc.node_unique_id; if (NODE[inc.node]) return inc.node; return BY_NAME[String(inc.node).split('|')[0]] || null; };
const incAsset = inc => { const id = incNode(inc); if (!id) return null; return NODE[id].type === 'test' ? testTarget(NODE[id]) : id; };
const declaredRoot = id => { for (const t of (TESTS_OF[id] || [])) if (isBad(latestTest(t)) && TRC[t] && NODE[TRC[t].id]) return TRC[t];
  const inc = D.incidents.find(i => i.root_cause && NODE[i.root_cause] && incAsset(i) === id); return inc ? { id: inc.root_cause, kind: inc.root_cause_kind } : null; };
const incTarget = inc => String(inc.node).split('|')[0].replace(/^test\.[^.]+\./, '').replace(/\.[0-9a-f]{10}$/, '');

function computeStatus(incidents) {
  const rank = { ok: 0, notrun: 1, warn: 2, stale: 3, failed: 4 };
  const st = {};
  ASSETS.forEach(n => {
    const id = n.unique_id; let s = 'ok'; const reasons = [];
    const up = (x, r) => { reasons.push(r); if (rank[x] > rank[s]) s = x; };
    const ex = EX[id] ? EX[id][LAST] : null;
    if (n.type === 'source') { const f = FRESH[id]; if (f && f.max_lag_min != null && f.freshness_lag_min > f.max_lag_min) up('stale', `Source data is ${fmtSpan(f.freshness_lag_min * MS.m)} old (limit ${f.max_lag_min} min)`); }
    else if (!ex) up('notrun', 'Not built in the latest run');
    else if (ex.status !== 'success') up('failed', 'Build failed in the latest run');
    const tids = TESTS_OF[id] || [];
    const ft = tids.filter(t => isBad(latestTest(t))); if (ft.length) up('failed', `${ft.length} failing test${ft.length > 1 ? 's' : ''}`);
    const wt = tids.filter(t => latestTest(t) === 'warn'); if (wt.length) up('warn', `${wt.length} test warning${wt.length > 1 ? 's' : ''}`);
    SERIES_LIST.filter(x => x.uid === id && seriesAnomalous(x)).forEach(x => up('warn', `${humanMetric(x.metric)} outside its expected band`));
    const sla = SLA_BY[id]; if (sla && sla.late) up('stale', `Missed its ${sla.expected_every} schedule`);
    incidents.filter(i => i.state !== 'resolved' && i.kind !== 'test_failure' && incAsset(i) === id)
      .forEach(i => up(i.kind === 'silence' ? 'stale' : (i.severity === 'error' ? 'failed' : 'warn'), i.title));
    st[id] = { status: s, reasons };
  });
  return st;
}

const WEIGHTS = { tests: 0.5, fresh: 0.2, sched: 0.15, anom: 0.15 };
function computeHealth(incidents) {
  return ['bronze', 'silver', 'gold'].map(L => {
    const models = ASSETS.filter(n => LAYER_GROUP(n.layer) === L);
    const ids = new Set(models.map(m => m.unique_id));
    let pass = 0, warn = 0, fail = 0;
    TESTS.filter(t => ids.has(testTarget(t))).forEach(t => { const s = latestTest(t.unique_id); if (s === 'pass') pass++; else if (s === 'warn') warn++; else if (s) fail++; });
    const nt = pass + warn + fail;
    const built = models.filter(m => EX[m.unique_id] && EX[m.unique_id][LAST]);
    const okb = built.filter(m => EX[m.unique_id][LAST].status === 'success');
    const slas = SLAS.filter(s => ids.has(s.unique_id));
    const missed = slas.filter(s => s.late || incidents.some(i => i.kind === 'silence' && i.state !== 'resolved' && incAsset(i) === s.unique_id));
    const ser = SERIES_LIST.filter(s => ids.has(s.uid)); const an = ser.filter(seriesAnomalous);
    const comps = [
      { key: 'tests', label: 'Tests', w: WEIGHTS.tests, v: nt ? (pass * 100 + warn * 50) / nt : null, detail: nt ? `(${pass} pass × 100 + ${warn} warn × 50 + ${fail} fail × 0) ÷ ${nt} tests` : 'No tests attached to this layer' },
      { key: 'fresh', label: 'Freshness', w: WEIGHTS.fresh, v: built.length ? okb.length / built.length * 100 : null, detail: built.length ? `${okb.length} of ${built.length} models built successfully in the latest run` : 'No model built in the latest run' },
      { key: 'sched', label: 'Schedules', w: WEIGHTS.sched, v: slas.length ? (slas.length - missed.length) / slas.length * 100 : null, detail: slas.length ? `${slas.length - missed.length} of ${slas.length} declared schedules met (late now or open missed-schedule alert counts as missed)` : 'No schedule declared in this layer' },
      { key: 'anom', label: 'Anomalies', w: WEIGHTS.anom, v: ser.length ? (ser.length - an.length) / ser.length * 100 : null, detail: ser.length ? `${ser.length - an.length} of ${ser.length} monitored metrics inside their expected band` : 'No monitored metric in this layer' },
    ];
    const used = comps.filter(c => c.v != null); const W = sum(used.map(c => c.w));
    const score = W ? sum(used.map(c => c.w * c.v)) / W : null;
    return { layer: L, score, comps, W, models: models.length, tests: nt, fail };
  });
}

/* ---------------- theme + chart helpers ---------------- */
const Ctx = createContext(null);
const useApp = () => useContext(Ctx);
const pal = () => {
  const cs = getComputedStyle(document.documentElement); const g = n => cs.getPropertyValue('--' + n).trim();
  return { bg: g('bg'), panel: g('panel'), ink: g('ink'), ink2: g('ink-2'), ink3: g('ink-3'), line: g('line'), line2: g('line-2'), accent: g('accent'), accentSoft: g('accent-soft'), band: g('band'), bar: g('bar'),
    fail: g('fail'), warn: g('warn'), ok: g('ok'), stale: g('stale'), muted: g('muted'), bronze: g('bronze'), silver: g('silver'), gold: g('gold'), transient: g('transient'), sources: g('sources'), snapshot: g('snapshot') };
};
const statusColor = (p, s) => ({ failed: p.fail, warn: p.warn, stale: p.stale, ok: p.ok, notrun: p.muted }[s] || p.muted);
const layerColor = (p, g) => p[g] || p.muted;
const FONT = '"Public Sans",system-ui,sans-serif';
const base = (p, o) => Object.assign({
  animationDuration: 250, textStyle: { fontFamily: FONT, color: p.ink2, fontSize: 11 },
  grid: { left: 64, right: 24, top: 30, bottom: 50 },
  tooltip: { trigger: 'axis', confine: true, backgroundColor: p.panel, borderColor: p.line, textStyle: { color: p.ink, fontSize: 12, fontFamily: FONT }, extraCssText: 'box-shadow:0 6px 18px rgba(0,0,0,.14);border-radius:6px;' },
  legend: { top: 0, right: 0, textStyle: { color: p.ink2, fontSize: 11 }, itemWidth: 12, itemHeight: 8, icon: 'roundRect' },
}, o);
const ax = (p, name, extra) => Object.assign({
  name, nameLocation: 'middle', nameGap: 32, nameTextStyle: { color: p.ink3, fontSize: 11 },
  axisLine: { lineStyle: { color: p.line } }, axisTick: { show: false }, axisLabel: { color: p.ink3, fontSize: 10.5 },
  splitLine: { lineStyle: { color: p.line2 } },
}, extra || {});

function EChart({ option, height = 260, onClick }) {
  const ref = useRef(null), inst = useRef(null), cb = useRef(onClick);
  cb.current = onClick;
  useEffect(() => {
    const c = echarts.init(ref.current, null, { renderer: 'canvas' }); inst.current = c;
    c.on('click', e => cb.current && cb.current(e));
    const ro = new ResizeObserver(() => c.resize()); ro.observe(ref.current);
    return () => { ro.disconnect(); c.dispose(); inst.current = null; };
  }, []);
  useEffect(() => { if (inst.current) inst.current.setOption(option, true); }, [option]);
  return <div ref={ref} style={{ height, width: '100%', cursor: onClick ? 'pointer' : 'default' }} />;
}

/* ---------------- small UI atoms ---------------- */
const Ic = ({ d, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{d}</svg>;

  sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></>,

};
const Pill = ({ tone, children }) => <span className={'pill p-' + tone}>{children}</span>;
const StatusPill = ({ s }) => <Pill tone={STATUS_TONE[s] || 'muted'}>{STATUS_LABEL[s] || s}</Pill>;
const SevPill = ({ s }) => <Pill tone={s === 'error' ? 'fail' : s === 'warn' ? 'warn' : 'muted'}>{s === 'error' ? 'Error' : s === 'warn' ? 'Warning' : s}</Pill>;
const RunPill = ({ s }) => <Pill tone={s === 'success' ? 'ok' : 'fail'}>{s === 'success' ? 'Success' : 'Error'}</Pill>;
const TestPill = ({ s }) => (s == null ? <Pill tone="muted">No result</Pill> : <Pill tone={s === 'pass' ? 'ok' : s === 'warn' ? 'warn' : 'fail'}>{s === 'pass' ? 'Pass' : s === 'warn' ? 'Warning' : s === 'error' ? 'Error' : 'Fail'}</Pill>);
const EngineBadge = ({ e }) => <span className={'badge ' + e}>{e === 'cortex' ? 'Cortex' : 'Native'}</span>;
const Layer = ({ l }) => { const g = LAYER_GROUP(l); return <span className="lyr"><i style={{ background: `var(--${g})` }} />{l === 'gold_analytics' ? 'Gold (analytics)' : LAYER_LABEL[g] || l}</span>; };

function Spark({ data, tone = 'accent', w = 84, h = 28, type = 'line' }) {
  const vals = data.map(v => (v == null ? null : +v)); const nums = vals.filter(v => v != null);
  if (nums.length < 2) return null;
  const color = `var(--${tone === 'muted' ? 'ink-3' : tone})`;
  let min = type === 'bar' ? 0 : Math.min(...nums); const max = Math.max(...nums); const r = max - min || 1;
  const y = v => h - 2 - (v - min) / r * (h - 5);
  if (type === 'bar') {
    const bw = w / vals.length;
    return <svg width={w} height={h} className="strip" aria-hidden="true">{vals.map((v, i) => v == null ? null : <rect key={i} x={i * bw + .5} y={max === 0 ? h - 1 : y(v)} width={Math.max(1, bw - 1.2)} height={max === 0 ? 1 : h - y(v)} fill={color} opacity={v ? 1 : .35} rx="0.5" />)}</svg>;
  }
  const x = i => i * (w - 4) / (vals.length - 1) + 2;
  let d = '', pen = false;
  vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; });
  let li = vals.length - 1; while (li > 0 && vals[li] == null) li--;
  return <svg width={w} height={h} className="strip" aria-hidden="true"><path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" /><circle cx={x(li)} cy={y(vals[li])} r="2.2" fill={color} /></svg>;
}

function RunStrip({ arr }) {
  const w = 4, gap = 1.5;
  return <svg width={arr.length * (w + gap)} height={14} className="strip" aria-label="Results of the last runs">{arr.map((s, i) => <rect key={i} x={i * (w + gap)} y={s == null ? 6 : 1} width={w} height={s == null ? 2 : 12} rx="1" fill={s == null ? 'var(--line)' : s === 'pass' ? 'var(--ok)' : s === 'warn' ? 'var(--warn)' : 'var(--fail)'} opacity={s === 'pass' ? .55 : 1}><title>{fmtRun(RUNS[i].t)}: {s || 'not run'}</title></rect>)}</svg>;
}

function Kpi({ label, value, unit, sub, tone, spark, sparkType, sparkTone, help, delta }) {
  return <div className="kpi">
    <div className="kpi-label">{label}{help && <span className="help" title={help} tabIndex={0} aria-label={help}>?</span>}</div>
    <div className="kpi-row"><div className={'kpi-value ' + (tone ? 't-' + tone : '')}>{value}{unit && <span className="unit">{unit}</span>}</div>{spark && <Spark data={spark} type={sparkType} tone={sparkTone || tone || 'accent'} />}</div>
    {(sub || delta) && <div className="kpi-sub">{delta}{sub}</div>}
  </div>;
}
const Delta = ({ v, goodWhenDown, fmt }) => { if (v == null || !isFinite(v)) return null; const flat = Math.abs(v) < 1e-9; const bad = !flat && (goodWhenDown ? v > 0 : v < 0); return <span className={'delta ' + (flat ? 'flat' : bad ? 'bad' : 'good')}>{v > 0 ? '+' : ''}{fmt ? fmt(v) : v}</span>; };

function Seg({ options, value, onChange, label }) {
  return <div className="fgrp">{label && <span className="l">{label}</span>}<div className="seg" role="group" aria-label={label}>{options.map(o => { const [k, l, dis] = Array.isArray(o) ? o : [o, o]; return <button key={k} className={value === k ? 'on' : ''} aria-pressed={value === k} disabled={dis} onClick={() => onChange(k)}>{l}</button>; })}</div></div>;
}
function Card({ title, sub, right, children, flush }) {
  return <section className="card"><header className="card-h"><div><h3>{title}</h3>{sub && <p>{sub}</p>}</div>{right}</header><div className={flush ? 'card-b flush' : 'card-b'}>{children}</div></section>;
}
function Tabs({ tabs, value, onChange }) {
  return <div className="tabs" role="tablist">{tabs.map(t => <button key={t.key} role="tab" aria-selected={value === t.key} className={'tab' + (value === t.key ? ' on' : '')} onClick={() => onChange(t.key)}>{t.label}{t.count != null && <span className="n">{t.count}</span>}{t.extra && <span className="sev">{t.extra}</span>}</button>)}</div>;
}
function PageHead({ title, sub, crumbs, right }) {
  const { go } = useApp();
  return <div className="ph"><div>{crumbs && <div className="crumbs">{crumbs.map((c, i) => <Fragment key={i}>{i > 0 && ' / '}{c.to ? <button onClick={() => go(c.to)}>{c.label}</button> : c.label}</Fragment>)}</div>}<h1>{title}</h1>{sub && <p>{sub}</p>}</div>{right}</div>;
}
function DataTable({ cols, rows, onRow, sort: init, rowKey, empty, maxH, selKey }) {
  const [sort, setSort] = useState(init || null);
  const sorted = useMemo(() => {
    if (!sort) return rows; const c = cols.find(x => x.key === sort.key); if (!c) return rows;
    const f = c.sort || (r => r[c.key]);
    return [...rows].sort((a, b) => { const x = f(a), y = f(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * sort.dir; });
  }, [rows, sort]); // eslint-disable-line
  return <div className="tbl-wrap" style={{ maxHeight: maxH }}><table className="tbl">
    <thead><tr>{cols.map(c => <th key={c.key} className={(c.ns ? 'ns ' : '') + (c.num ? 'num' : '')} style={{ width: c.w }} aria-sort={sort && sort.key === c.key ? (sort.dir > 0 ? 'ascending' : 'descending') : undefined}
      onClick={c.ns ? undefined : () => setSort(s => (s && s.key === c.key ? { key: c.key, dir: -s.dir } : { key: c.key, dir: c.desc ? -1 : 1 }))}>{c.label}{sort && sort.key === c.key && <span className="sort">{sort.dir > 0 ? '▲' : '▼'}</span>}</th>)}</tr></thead>
    <tbody>{sorted.length ? sorted.map((r, i) => { const k = rowKey ? rowKey(r) : i; return <tr key={k} className={(onRow ? 'click ' : '') + (selKey != null && k === selKey ? 'sel' : '')} tabIndex={onRow ? 0 : undefined}
      onClick={onRow ? () => onRow(r) : undefined} onKeyDown={onRow ? e => { if (e.key === 'Enter') onRow(r); } : undefined}>{cols.map(c => <td key={c.key} className={(c.num ? 'num ' : '') + (c.cls || '')}>{c.render ? c.render(r) : r[c.key]}</td>)}</tr>; })
      : <tr><td colSpan={cols.length} className="empty">{empty || 'Nothing matches these filters. Clear a filter to see more rows.'}</td></tr>}</tbody>
  </table></div>;
}
const NodeLink = ({ id, label }) => { const { go } = useApp(); if (!id || !NODE[id]) return <span>{label}</span>; return <button className="linkish" onClick={e => { e.stopPropagation(); go('node', id); }}>{label || NODE[id].name}</button>; };

const WINDOWS = [['7', 'Last 7 days'], ['15', 'Last 15 days']];
const runsInWindow = days => RUNS.filter(r => r.t >= AS_OF - +days * MS.d);

/* ---------------- Overview ---------------- */
function HealthStrip({ health }) {
  const p = pal();
  return <div className="health">{health.map((h, i) => <Fragment key={h.layer}>
    {i > 0 && <div className="hjoin"><Ic d={ICON.chev} s={18} /></div>}
    <div className="htile" tabIndex={0} style={{ '--lc': `var(--${h.layer})` }} aria-label={`${LAYER_LABEL[h.layer]} health ${h.score == null ? 'not available' : Math.round(h.score)} out of 100`}>
      <div className="htop"><div className="hname">{LAYER_LABEL[h.layer]}<small>{h.models} models, {h.tests} tests</small></div>
        <div className={'hscore ' + (h.score == null ? '' : h.score >= 95 ? 't-ok' : h.score >= 80 ? 't-warn' : 't-fail')}>{h.score == null ? 'n/a' : Math.round(h.score)}<span>/100</span></div></div>
      <div className="hcomps">{h.comps.map(c => <div key={c.key} className="hc">{c.label}<div className="bar"><i style={{ width: (c.v == null ? 0 : c.v) + '%', background: c.v == null ? 'transparent' : c.v >= 95 ? p.ok : c.v >= 80 ? p.warn : p.fail }} /></div><b>{c.v == null ? 'n/a' : Math.round(c.v)}</b></div>)}</div>
      <div className="hpop" role="tooltip">
        <h4>How the {LAYER_LABEL[h.layer].toLowerCase()} score is computed</h4>
        Each test scores 100 when it passes, 50 on a warning, 0 when it fails. The layer score is the weighted average of four parts; a part with no data is left out and the remaining weights are rescaled.
        <div className="f">score = Σ(weight × part) ÷ Σ(weights used){'\n'}= {h.comps.filter(c => c.v != null).map(c => `${c.w} × ${c.v.toFixed(1)}`).join(' + ')}{h.W ? ` ÷ ${h.W.toFixed(2)}` : ''} = {h.score == null ? 'n/a' : h.score.toFixed(1)}</div>
        <table><tbody>{h.comps.map(c => <tr key={c.key}><td><b>{c.label}</b> <span className="muted">({Math.round(c.w * 100)}%)</span><div className={c.v == null ? 'drop' : ''}>{c.detail}{c.v == null ? '; weight dropped' : ''}</div></td><td className="n">{c.v == null ? 'n/a' : c.v.toFixed(1)}</td></tr>)}</tbody></table>
      </div>
    </div></Fragment>)}</div>;
}

function Overview() {
  const { incidents, status, health, go, theme } = useApp();
  const [win, setWin] = useState('15'); const [layer, setLayer] = useState('all');
  const wr = useMemo(() => runsInWindow(win), [win]);
  const open = incidents.filter(i => i.state !== 'resolved');
  const missed = SLAS.filter(s => s.late || incidents.some(i => i.kind === 'silence' && i.state !== 'resolved' && incAsset(i) === s.unique_id));
  const credits = wr.map(r => r.credits); const pending = wr.filter(r => r.credits == null).length;
  const days = [...Array(7)].map((_, i) => AS_OF - (6 - i) * MS.d);
  const openTrend = days.map(d => incidents.filter(i => parseT(i.first_detected_at) <= d && (i.state !== 'resolved' || (i.resolvedAt || 0) > d)).length);
  const okRuns = wr.filter(r => r.status === 'success').length;
  const rows = open.filter(i => layer === 'all' || (incAsset(i) && LAYER_GROUP(NODE[incAsset(i)].layer) === layer));
  const opt = useMemo(() => {
    const p = pal();
    return base(p, {
      grid: { left: 60, right: 56, top: 30, bottom: 54 },
      legend: { top: 0, right: 0, data: ['Run duration', 'Failing tests'], textStyle: { color: p.ink2, fontSize: 11 } },
      xAxis: ax(p, 'Run start time', { type: 'category', data: wr.map(r => fmtRun(r.t)), splitLine: { show: false }, nameGap: 34 }),
      yAxis: [ax(p, 'Duration (seconds)', { type: 'value', nameGap: 40 }), ax(p, 'Failing tests (count)', { type: 'value', minInterval: 1, position: 'right', nameGap: 30, splitLine: { show: false } })],
      series: [
        { name: 'Run duration', type: 'bar', barMaxWidth: 16, color: p.bar, data: wr.map(r => ({ value: r.duration_s, inv: r.invocation_id, itemStyle: { color: r.status === 'success' ? p.bar : p.fail, borderRadius: [2, 2, 0, 0] } })) },
        { name: 'Failing tests', type: 'line', yAxisIndex: 1, step: 'middle', symbol: 'none', color: p.ink2, lineStyle: { width: 1.5 }, data: wr.map(r => FAILS[r.idx]) },
      ],
    });
  }, [wr, theme]);
  const sevRank = s => (s === 'error' ? 0 : 1);
  return <div className="page">
    <PageHead title="Overview" sub={`What is broken now and how the platform ran, as of ${fmtTs(AS_OF)}. Project ${D.project}.`} />
    <div className="kpis">
      <Kpi label="Open incidents" value={incidents.filter(i => i.state === 'open').length} tone={incidents.some(i => i.state === 'open') ? 'fail' : 'ok'} sub={`${incidents.filter(i => i.state === 'acknowledged').length} acknowledged`} spark={openTrend} sparkTone="muted" help="Incidents not yet acknowledged. Sparkline: unresolved incidents per day, last 7 days." />
      <Kpi label="Failing tests" value={FAILS[LAST]} tone={FAILS[LAST] ? 'fail' : 'ok'} sub={`of ${TESTED[LAST]} in the latest run`} spark={wr.map(r => FAILS[r.idx])} sparkType="bar" sparkTone="fail" help="Tests that failed or errored in the latest run. Bars: failing tests per run." />
      <Kpi label="Successful runs" value={`${okRuns} of ${wr.length}`} tone={okRuns === wr.length ? 'ok' : 'warn'} sub={`median ${fmtSec(median(wr.map(r => r.duration_s)))}`} spark={wr.map(r => r.duration_s)} sparkTone="muted" help="Runs that ended in success in the window. Sparkline: run duration." />
      <Kpi label="Missed schedules" value={missed.length} tone={missed.length ? 'stale' : 'ok'} sub={`of ${SLAS.length} declared schedules`} help="A declared schedule is missed when the last success is older than expected interval + grace, or a missed-schedule alert is open." />
      <Kpi label="Credits" value={sum(credits).toFixed(2)} sub={pending ? `${pending} recent runs not yet attributed` : 'all runs attributed'} spark={credits} sparkTone="accent" help="Warehouse credits attributed to the runs in the window." />
    </div>
    <HealthStrip health={health} />
    <div className="fbar">
      <Seg label="Window" options={WINDOWS} value={win} onChange={setWin} />

    </div>

        <DataTable rows={rows} rowKey={r => r.incident_key} onRow={r => incNode(r) ? go('node', incNode(r)) : go('incidents')}
          sort={{ key: 'sev', dir: 1 }}
          cols={[
            { key: 'sev', label: 'Severity', render: r => <SevPill s={r.severity} />, sort: r => sevRank(r.severity) * 1e13 - parseT(r.first_detected_at) },
            { key: 'title', label: 'Incident', cls: 'wrap', render: r => <div className="cell2"><span>{r.title}</span><small>{KIND_LABEL[r.kind]} on {incTarget(r)}{r.root_cause && NODE[r.root_cause] ? `; root cause ${NODE[r.root_cause].name}` : ''}</small></div> },
            { key: 'first', label: 'First seen', render: r => fmtTs(parseT(r.first_detected_at)), sort: r => parseT(r.first_detected_at) },

      <Card title="Runs: duration and failing tests" sub="Each bar is one run; red bars ended in error. Click a bar to open its node timeline.">

      </Card>
    </div>
    <Card title="Nodes that are not OK" sub="Status from the latest run, tests, schedules and open incidents. Click a row to open the node." flush>

        sort={{ key: 'st', dir: -1 }}

          { key: 'name', label: 'Node', render: r => <b>{r.name}</b> },
          { key: 'layer', label: 'Layer', render: r => <Layer l={r.layer} /> },
          { key: 'st', label: 'Status', render: r => <StatusPill s={status[r.unique_id].status} />, sort: r => ({ failed: 4, stale: 3, warn: 2, notrun: 1, ok: 0 })[status[r.unique_id].status] },
          { key: 'why', label: 'Why', cls: 'wrap', ns: true, render: r => status[r.unique_id].reasons.join('; ') },
        ]} empty="Every model in this layer is OK." />
    </Card>
  </div>;
}

/* ---------------- Incidents ---------------- */
function Incidents() {
  const { incidents, act, go, theme } = useApp();
  const [tab, setTab] = useState('open'); const [kind, setKind] = useState('all'); const [sev, setSev] = useState('all'); const [q, setQ] = useState('');
  const by = s => incidents.filter(i => i.state === s);
  const sevTxt = a => { const e = a.filter(i => i.severity === 'error').length, w = a.filter(i => i.severity === 'warn').length; return a.length ? `${e} error, ${w} warning` : ''; };
  const rows = by(tab).filter(i => (kind === 'all' || i.kind === kind) && (sev === 'all' || i.severity === sev) && (!q || (i.title + ' ' + i.node + ' ' + (i.channel || '')).toLowerCase().includes(q.toLowerCase())));
  const unresolved = incidents.filter(i => i.state !== 'resolved');

  const shown = [...rows].sort((a, b) => parseT(a.first_detected_at) - parseT(b.first_detected_at));
  const opt = useMemo(() => {
    const p = pal(); const start = Math.min(...incidents.map(i => parseT(i.first_detected_at))) - MS.d / 2;
    return base(p, {
      grid: { left: 210, right: 40, top: 10, bottom: 46 },
      tooltip: { trigger: 'item', confine: true, backgroundColor: p.panel, borderColor: p.line, textStyle: { color: p.ink, fontSize: 12 }, formatter: e => { const i = shown[e.dataIndex]; return `<b>${esc(i.title)}</b><br/>First seen ${esc(fmtTs(parseT(i.first_detected_at)))}<br/>Open for ${esc(fmtSpan((i.resolvedAt || AS_OF) - parseT(i.first_detected_at)))}<br/>${esc(i.occurrences)} occurrence(s)`; } },
      xAxis: ax(p, 'Date (first seen to now)', { type: 'value', min: start, max: AS_OF + MS.h * 2, axisLabel: { color: p.ink3, fontSize: 10.5, formatter: v => fmtDay(v) }, splitNumber: 5 }),

      series: [

        { type: 'bar', stack: 'r', barMaxWidth: 14, data: shown.map(i => ({ value: (i.resolvedAt || AS_OF) - parseT(i.first_detected_at), itemStyle: { color: i.severity === 'error' ? p.fail : p.warn, borderRadius: 3 } })), label: { show: true, position: 'right', color: p.ink3, fontSize: 10.5, formatter: e => `${shown[e.dataIndex].occurrences}×` } },

        empty={tab === 'resolved' ? 'No resolved incidents yet. Resolve one from the Acknowledged tab when the fix is in.' : tab === 'acknowledged' ? 'Nothing acknowledged. Acknowledge an open incident to show someone is on it.' : 'No open incidents match these filters.'}

          { key: 'occurrences', label: 'Times', num: true, desc: true },

          { key: 'ack', label: 'Acknowledged by', render: r => r.acknowledged_by || <span className="muted">Nobody</span>, sort: r => r.acknowledged_by || '' },
          { key: 'rc', label: 'Root cause', ns: true, render: r => r.root_cause && NODE[r.root_cause] ? <div className="cell2"><NodeLink id={r.root_cause} /><small>{rcKind(r.root_cause_kind)}{incAsset(r) && <> <button className="linkish" onClick={e => { e.stopPropagation(); go('lineage', null, { focus: incAsset(r), mode: 'root' }); }}>Trace</button></>}</small></div> : r.root_cause || (incAsset(r) ? <button className="linkish" onClick={e => { e.stopPropagation(); go('lineage', null, { focus: incAsset(r), mode: 'root' }); }}>Trace in lineage</button> : <span className="muted">Not set</span>) },
          { key: 'act', label: '', ns: true, render: r => r.state === 'open' ? <button className="btn primary" onClick={e => { e.stopPropagation(); act(r.incident_key, 'acknowledged'); }}>Acknowledge</button>
            : r.state === 'acknowledged' ? <button className="btn" onClick={e => { e.stopPropagation(); act(r.incident_key, 'resolved'); }}>Resolve</button>
              : <button className="btn" onClick={e => { e.stopPropagation(); act(r.incident_key, 'open'); }}>Reopen</button> },
        ]} />
    </Card>
    <Card title="How long each incident has been open" sub="Bars run from first seen to now (or to resolution); the label is the number of occurrences. Red is error, amber is warning.">
      <EChart option={opt} height={Math.max(160, 60 + shown.length * 30)} />
    </Card>
    <p className="note">Acknowledge and Resolve are kept in this browser tab only (static report). In the app they write to the acknowledgement table.</p>
  </div>;
}

/* ---------------- Tests & anomalies ---------------- */
function BandChart({ series, engine, height = 300 }) {
  const { theme } = useApp();
  const pts = (series && series.pts[engine]) || [];
  const opt = useMemo(() => {
    const p = pal();
    return base(p, {
      grid: { left: 70, right: 20, top: 30, bottom: 50 },
      legend: { top: 0, right: 0, data: ['Observed', 'Expected', 'Expected band', 'Anomaly'], textStyle: { color: p.ink2, fontSize: 11 } },
      tooltip: { trigger: 'axis', confine: true, backgroundColor: p.panel, borderColor: p.line, textStyle: { color: p.ink, fontSize: 12 },
        formatter: a => { const x = pts[a[0].dataIndex]; return `<b>${esc(fmtDay(x.t))}</b><br/>Observed ${esc(fmtNum(x.value))}<br/>Expected ${esc(fmtNum(x.expected))}<br/>Band ${esc(fmtNum(x.lower))} to ${esc(fmtNum(x.upper))}<br/>${esc(x.anomaly ? '<b style="color:' + p.fail + '">Anomaly</b>' : 'Inside the band')}${esc(x.score != null ? '<br/>Score ' + x.score : '')}`; } },
      xAxis: ax(p, 'Observed at (day)', { type: 'category', boundaryGap: false, data: pts.map(x => fmtDay(x.t)), splitLine: { show: false } }),
      yAxis: ax(p, `${humanMetric(series ? series.metric : '')} (${metricUnit(series ? series.metric : '')})`, { type: 'value', scale: true, nameGap: 52, axisLabel: { color: p.ink3, fontSize: 10.5, formatter: v => fmtNum(v) } }),
      series: [
        { name: 'Lower', type: 'line', stack: 'band', symbol: 'none', lineStyle: { opacity: 0 }, data: pts.map(x => x.lower), tooltip: { show: false } },
        { name: 'Expected band', type: 'line', stack: 'band', symbol: 'none', lineStyle: { opacity: 0 }, areaStyle: { color: p.band, opacity: 1 }, color: p.band, data: pts.map(x => x.upper - x.lower) },
        { name: 'Expected', type: 'line', symbol: 'none', color: p.ink3, lineStyle: { type: 'dashed', width: 1 }, data: pts.map(x => x.expected) },
        { name: 'Observed', type: 'line', symbolSize: 4, color: p.accent, lineStyle: { width: 2 }, data: pts.map(x => x.value) },
        { name: 'Anomaly', type: 'scatter', symbolSize: 11, color: p.fail, data: pts.map(x => (x.anomaly ? x.value : null)) },
      ],
    });
  }, [series && series.key, engine, theme]); // eslint-disable-line
  if (!pts.length) return <div className="empty-state"><b>No points for this engine</b>Pick another engine for this metric.</div>;
  return <EChart option={opt} height={height} />;
}

function ShadowPanel({ series }) {
  const engines = series ? Object.keys(series.pts) : [];
  if (!series) return null;
  if (engines.length < 2) {
    return <div className="empty-state" style={{ textAlign: 'left', padding: '6px 2px' }}>
      <b>Only the {engines[0] === 'cortex' ? 'Cortex' : 'native'} engine scored this metric</b>
      Shadow scoring shows native and Cortex side by side when both score the same point.
      Cortex is {CAP.cortex ? 'available on this account' : 'not available on this account'}; no Cortex score has been recorded for {series.relation} yet.
      <div style={{ marginTop: 10 }} className="hstack"><EngineBadge e="native" /> {(series.pts.native || []).length} points <span className="badge cortex">Cortex</span> {(series.pts.cortex || []).length} points</div>
    </div>;
  }
  const nat = series.pts.native || [], cx = series.pts.cortex || []; const byT = {}; cx.forEach(x => { byT[x.t] = x; });
  const rows = nat.filter(x => byT[x.t]).map(x => ({ t: x.t, v: x.value, n: x, c: byT[x.t] })).reverse();
  const agree = rows.filter(r => r.n.anomaly === r.c.anomaly).length;
  return <div>
    <div className="hstack" style={{ marginBottom: 8 }}><span>Engines agree on <b>{agree} of {rows.length}</b> shared points{rows.filter(r => r.n.anomaly || r.c.anomaly).length ? `; ${rows.filter(r => r.n.anomaly && r.c.anomaly).length} flagged by both, ${rows.filter(r => r.n.anomaly !== r.c.anomaly).length} by one only` : ''}. Newest first.</span></div>
    <DataTable rows={rows} rowKey={r => r.t} maxH={240} cols={[
      { key: 't', label: 'Day', render: r => fmtDay(r.t) },
      { key: 'v', label: 'Observed', num: true, render: r => fmtNum(r.v) },
      { key: 'n', label: 'Native band', render: r => `${fmtNum(r.n.lower)} to ${fmtNum(r.n.upper)}`, ns: true },
      { key: 'nf', label: 'Native', render: r => r.n.anomaly ? <Pill tone="fail">Anomaly</Pill> : <Pill tone="ok">Normal</Pill>, ns: true },
      { key: 'ns', label: 'Native score', num: true, desc: true, render: r => r.n.score == null ? '—' : r.n.score.toFixed(2), sort: r => r.n.score },
      { key: 'c', label: 'Cortex band', render: r => `${fmtNum(r.c.lower)} to ${fmtNum(r.c.upper)}`, ns: true },
      { key: 'cf', label: 'Cortex', render: r => r.c.anomaly ? <Pill tone="fail">Anomaly</Pill> : <Pill tone="ok">Normal</Pill>, ns: true },
      { key: 'cs', label: 'Cortex score', num: true, desc: true, render: r => r.c.score == null ? '—' : r.c.score.toFixed(2), sort: r => r.c.score },
    ]} />
  </div>;
}

      <Kpi label="Anomalies now" value={SERIES_LIST.filter(seriesAnomalous).length} tone={SERIES_LIST.some(seriesAnomalous) ? 'fail' : 'ok'} sub={`${D.metrics.filter(m => m.anomaly).length} anomalous points in 30 days`} />

/* ---------------- Runs ---------------- */
function Gantt({ run, filterLayer }) {
  const { theme, go } = useApp();
  const ex = (EX_RUN[run.invocation_id] || []).filter(e => filterLayer === 'all' || LAYER_GROUP(NODE[e.unique_id].layer) === filterLayer);
  const opt = useMemo(() => {
    const p = pal();
    return base(p, {
      grid: { left: 180, right: 30, top: 10, bottom: 46 },
      tooltip: { trigger: 'item', confine: true, backgroundColor: p.panel, borderColor: p.line, textStyle: { color: p.ink, fontSize: 12 }, formatter: e => { const x = ex[e.dataIndex]; const n = NODE[x.unique_id]; return `<b>${esc(n.name)}</b><br/>${esc(LAYER_LABEL[LAYER_GROUP(n.layer)])}, ${esc(n.materialization || n.type)}<br/>Starts at +${esc(((x.t - run.t) / 1000).toFixed(1))} s<br/>Took ${esc(fmtSec(x.execution_time_s))}<br/>Credits ${esc(fmtCr(x.credits))}${esc(x.status !== 'success' ? '<br/><b style="color:' + p.fail + '">Error</b>' : '')}`; } },
      xAxis: ax(p, 'Seconds since run start', { type: 'value', min: 0 }),
      yAxis: ax(p, '', { type: 'category', inverse: true, data: ex.map(x => NODE[x.unique_id].name), splitLine: { show: false }, axisLabel: { color: p.ink2, fontSize: 10.5 } }),
      series: [
        { type: 'bar', stack: 'g', silent: true, itemStyle: { color: 'transparent' }, data: ex.map(x => (x.t - run.t) / 1000), tooltip: { show: false } },
        { type: 'bar', stack: 'g', barCategoryGap: '28%', data: ex.map(x => ({ value: x.execution_time_s, uid: x.unique_id, itemStyle: { color: x.status === 'success' ? layerColor(p, LAYER_GROUP(NODE[x.unique_id].layer)) : p.fail, borderRadius: 2, borderColor: x.status === 'success' ? 'transparent' : p.fail, borderWidth: x.status === 'success' ? 0 : 2 } })) },
      ],
    });
  }, [run.invocation_id, filterLayer, theme]); // eslint-disable-line
  if (!ex.length) return <div className="empty-state"><b>No node ran in this layer</b>Pick another layer.</div>;
  return <EChart option={opt} height={60 + ex.length * 17} onClick={e => e.data && e.data.uid && go('node', e.data.uid)} />;
}

const NODE_W = 196, NODE_H = 48;
function layoutGraph(ids) {
  const g = new dagre.graphlib.Graph(); g.setGraph({ rankdir: 'LR', nodesep: 14, ranksep: 64, marginx: 20, marginy: 20 }); g.setDefaultEdgeLabel(() => ({}));
  const set = new Set(ids); const edges = [];
  ids.forEach(id => g.setNode(id, { width: NODE_W, height: NODE_H }));
  ids.forEach(id => (PARENTS[id] || []).forEach(p => { if (set.has(p)) { g.setEdge(p, id); edges.push([p, id]); } }));
  dagre.layout(g);
  const pos = {}; ids.forEach(id => { const n = g.node(id); pos[id] = { x: n.x - NODE_W / 2, y: n.y - NODE_H / 2 }; });
  return { pos, edges };
}
const walk = (id, map) => { const out = new Set(); const st = [id]; while (st.length) { const x = st.pop(); (map[x] || []).forEach(p => { if (!out.has(p)) { out.add(p); st.push(p); } }); } return out; };
const ancestors = id => walk(id, PARENTS);
const descendants = id => walk(id, CHILDREN);
const hood = (id, hops) => { const out = new Set([id]); let f = [id]; for (let h = 0; h < hops; h++) { const nx = []; f.forEach(x => [...(PARENTS[x] || []), ...(CHILDREN[x] || [])].forEach(y => { if (!out.has(y)) { out.add(y); nx.push(y); } })); f = nx; } return [...out]; };
function rootCause(id, status) {
  const bad = x => status[x] && ['failed', 'warn', 'stale'].includes(status[x].status);
  const anc = ancestors(id); const chain = [...anc, id].filter(bad);
  const roots = chain.filter(x => ![...ancestors(x)].some(bad));
  const path = new Set([...anc, id]); const dec = declaredRoot(id);
  if (dec) { path.add(dec.id); return { path, roots: [dec.id], impacted: descendants(id), declared: dec }; }
  return { path, roots: roots.length ? roots : [id], impacted: descendants(id) };
}
function IceNode({ data }) {

}
