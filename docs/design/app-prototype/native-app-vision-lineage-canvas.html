        </div></div>
      <div className="box"><h3 style={{ margin: '0 0 8px', fontSize: 14 }}>How statuses are worked out</h3>
        <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13, lineHeight: 1.6 }} className="ink2">
          <li><b>Failed</b>: the latest build errored, a test on the node failed in the latest run, or an error incident points at it.</li>
          <li><b>Missed schedule</b>: a missed-run event exists, or the declared window plus grace has passed at report time.</li>
          <li><b>Warning</b>: a warning incident (anomaly, cost spike, schema change) points at it.</li>
          <li><b>Not run</b>: dbt never builds it (sources).</li>
          <li><b>Cost change</b>: average credits of the last 4 attributed runs divided by the median of the earlier ones.</li>
        </ul></div>
    </div>
  </div>;
}

/* ============================== palette ============================== */
const SECTIONS = [
  { key: 'incidents', label: 'Incidents', hint: 'triage, acknowledge' }, { key: 'tests', label: 'Tests & anomalies', hint: 'results, band charts' },
  { key: 'runs', label: 'Runs', hint: 'list, node timeline' }, { key: 'cost', label: 'Cost', hint: 'credits, regressions' },
  { key: 'sched', label: 'Schedules & freshness', hint: 'SLAs, missed runs' }, { key: 'schema', label: 'Schema changes', hint: 'columns over time' },
  { key: 'settings', label: 'Settings', hint: 'edition, channels' },
];
function Palette({ onClose, items }) {
  const [q, setQ] = useState(''); const [i, setI] = useState(0); const ref = useRef(null); const listRef = useRef(null);
  useEffect(() => { ref.current && ref.current.focus(); }, []);
  const ql = q.trim().toLowerCase();
  const score = it => { if (!ql) return it.group === 'Nodes' || it.group === 'Tests' ? -1 : 1; const s = (it.label + ' ' + (it.hint || '')).toLowerCase(); if (s.startsWith(ql)) return 3; if (s.includes(ql)) return 2;
    let k = 0; for (const ch of s) if (ch === ql[k]) k++; return k === ql.length ? 1 : -1; };
  const res = items.map(it => [it, score(it)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 40).map(x => x[0]);
  const groups = []; res.forEach(it => { let g = groups.find(x => x.g === it.group); if (!g) groups.push(g = { g: it.group, items: [] }); g.items.push(it); });
  const flat = groups.flatMap(g => g.items);
  useEffect(() => { setI(0); }, [q]);
  useEffect(() => { const el = listRef.current && listRef.current.querySelector('[aria-selected="true"]'); el && el.scrollIntoView({ block: 'nearest' }); }, [i]);
  const run = it => { onClose(); setTimeout(() => it.run(), 0); };
  const onKey = e => { if (e.key === 'ArrowDown') { e.preventDefault(); setI(Math.min(flat.length - 1, i + 1)); } else if (e.key === 'ArrowUp') { e.preventDefault(); setI(Math.max(0, i - 1)); }
    else if (e.key === 'Enter' && flat[i]) { e.preventDefault(); run(flat[i]); } else if (e.key === 'Escape') { e.preventDefault(); onClose(); } };
  let k = -1;
  return <div className="scrim" onMouseDown={e => e.target === e.currentTarget && onClose()}>
    <div className="card pal" role="dialog" aria-label="Jump to">
      <input ref={ref} value={q} onChange={e => setQ(e.target.value)} onKeyDown={onKey} placeholder="Jump to a section, model, source or test" aria-label="Search" />
      <ul ref={listRef} role="listbox">
        {groups.map(g => <Fragment key={g.g}><li className="g">{g.g}</li>
          {g.items.map(it => { k++; const me = k; return <li key={it.id} className="it" role="option" aria-selected={me === i} onMouseEnter={() => setI(me)} onClick={() => run(it)}>
            {it.dot && <span className="dot" style={{ background: it.dot }} />}<span>{it.label}</span><span className="h">{it.hint}</span></li>; })}</Fragment>)}
        {!flat.length && <li className="g">Nothing matches “{q}”. Try a model name like fct_orders.</li>}
      </ul>
    </div>
  </div>;
}

/* ============================== shell ============================== */
function Strip({ open, acks, openSheet }) {
  const { P } = useContext(ThemeCtx);
  const openInc = INCIDENTS.filter(i => !(acks[i.incident_key] || i.acknowledged_by));
  const lr = RUNS[LAST];
  const ok = RUNS.filter(r => r.status === 'success').length;
  const worstSrc = DATA.source_freshness.reduce((a, f) => !a || f.freshness_lag_min > a.freshness_lag_min ? f : a, null);
  const missed = Object.values(SLA).filter(s => s.missed).length;
  const totalCr = sum(RUNS.map(r => r.credits || 0));
  const att = RUNS.filter(r => r.credits != null).map(r => r.credits);
  const last5 = mean(att.slice(-5)), prev5 = mean(att.slice(-10, -5));
  const delta = prev5 ? (last5 / prev5 - 1) * 100 : 0;
  if (!open) return null;
  return <div className="strip" role="region" aria-label="Overview">
    <button className="readout" onClick={() => openSheet('incidents')}><span className="lbl">Open incidents</span><span className="val" style={{ color: openInc.length ? P.failed : P.ok }}>{openInc.length}<small>{plural(openInc.filter(i => i.severity === 'error').length, 'error')}, {INCIDENTS.length - openInc.length} acknowledged</small></span></button>
    <button className="readout" onClick={() => openSheet('runs')}><span className="lbl">Latest run, {fmtDT(ts(lr.started_at))}</span><span className="val" style={{ color: lr.status === 'success' ? P.ok : P.failed }}>{lr.status === 'success' ? 'Passed' : 'Failed'}<small>{fmtS(lr.duration_s)}, {lr.nodes_failed} failed</small></span></button>
    <button className="readout" onClick={() => openSheet('runs')}><span className="lbl">Runs, last {NR}</span><span className="val">{ok} passed<small>{NR - ok} failed</small></span>
      <RunStrip label="Run result, oldest first" cells={RUNS.map(r => ({ s: r.status === 'success' ? 'ok' : 'fail', t: `${fmtDT(ts(r.started_at))}: ${r.status}` }))} /></button>
    <button className="readout" onClick={() => openSheet('tests')}><span className="lbl">Tests, latest run</span><span className="val"><span style={{ color: LATEST_FAILING.length ? P.failed : P.ok }}>{LATEST_FAILING.length} failing</span><small>{TESTS.length - LATEST_FAILING.length} passing</small></span></button>
    <button className="readout" onClick={() => openSheet('sched')}><span className="lbl">Schedules</span><span className="val" style={{ color: missed ? P.failed : P.ok }}>{missed} missed<small>of {Object.keys(SLA).length} declared</small></span></button>
    <button className="readout" onClick={() => openSheet('sched')}><span className="lbl">Freshness, worst source</span><span className="val" style={{ color: worstSrc && srcLate(worstSrc.unique_id) ? P.failed : undefined }}>{worstSrc ? fmtMin(worstSrc.freshness_lag_min) : '—'}<small>{worstSrc ? `${worstSrc.name}${SRC_MAX[worstSrc.unique_id] != null ? `, limit ${fmtMin(SRC_MAX[worstSrc.unique_id])}` : ''}` : ''}</small></span></button>
    <button className="readout" onClick={() => openSheet('cost')}><span className="lbl">Credits, {NR} runs</span><span className="val">{totalCr.toFixed(2)}<small style={{ color: delta > 5 ? P.warn : undefined }}>{delta >= 0 ? '+' : ''}{delta.toFixed(0)}% last 5 runs</small></span>
      <Spark values={RUNS.map(r => r.credits)} w={110} h={18} label="Credits per run" /></button>
    <button className="readout" onClick={() => openSheet('schema')} style={{ borderRight: 0 }}><span className="lbl">Schema changes</span><span className="val">{DATA.schema_changes.length}<small>columns, last {fmtDay(ts(DATA.schema_changes.map(c => c.detected_at).sort().slice(-1)[0] || DATA.generated_at))}</small></span></button>
  </div>;
}

function Shell() {
  const rf = useReactFlow();
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('icecore-b-theme') || 'light'; } catch (e) { return 'light'; } });
  const [overlay, setOverlay] = useState('status');
  const [showTests, setShowTests] = useState(false);
  const [hiddenLanes, setHiddenLanes] = useState(new Set());
  const [selected, setSelected] = useState(null);
  const [tab, setTab] = useState('overview');
  const [sheet, setSheet] = useState(null);
  const [sheetBig, setSheetBig] = useState(false);
  const [stripOpen, setStripOpen] = useState(true);
  const [palette, setPalette] = useState(false);
  const [rc, setRc] = useState(null);
  const [acks, setAcks] = useState({});
  const [pIdx, setPIdx] = useState(null);
  const [legendFilter, setLegendFilter] = useState(null);
  const [hover, setHover] = useState(null);
  const stageRef = useRef(null);
  const [stageW, setStageW] = useState(1200);
  useEffect(() => { const el = stageRef.current; if (!el) return; const ro = new ResizeObserver(() => setStageW(el.clientWidth)); ro.observe(el); return () => ro.disconnect(); }, []);
  const P = PAL[theme];

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); try { localStorage.setItem('icecore-b-theme', theme); } catch (e) {} }, [theme]);

  const layout = useMemo(() => { if (!showTests) return LAYOUT_LANES; if (!LAYOUT_TESTS) LAYOUT_TESTS = layoutWithTests(); return LAYOUT_TESTS; }, [showTests]);
  useEffect(() => { const t = setTimeout(() => rf.fitView({ padding: 0.06, duration: 400 }), 60); return () => clearTimeout(t); }, [showTests]);

  const nodes = useMemo(() => {
    const out = [];
    layout.lanes.forEach(L => out.push({ id: 'lane-' + L.key, type: 'lane', position: { x: L.x, y: L.y }, data: L, draggable: false, selectable: false, focusable: false, zIndex: -1, style: { width: L.w, height: L.h } }));
    GRAPH.forEach(n => out.push({ id: n.unique_id, type: 'model', position: layout.pos[n.unique_id], data: {}, draggable: false, width: NODE_W, height: NODE_H }));
    if (showTests) layout.tests.forEach(t => out.push({ id: t, type: 'test', position: layout.pos[t], data: {}, draggable: false }));
    return out;
  }, [layout, showTests]);

  const rcInfo = useMemo(() => {
    if (!rc) return null; const t = BY_ID[rc]; const models = testTargets(t);
    const set = new Set(models); models.forEach(m => ancestors(m, false).forEach(a => set.add(a))); if (showTests) set.add(rc);
    const root = rootCauseOf(rc); if (root && GRAPH_SET.has(root.id)) set.add(root.id);
    let hot = set;
    if (root && models.some(m => ancestors(m, false).has(root.id))) { const d = descendants(root.id, false); hot = new Set([root.id, ...models, ...[...set].filter(x => d.has(x))]); if (showTests) hot.add(rc); }
    const r = TRES[rc][LAST];
    return { set, hot, models, root, flag: `${testLabel(t)} failing, ${r ? r.failures : 0} rows`, rootFlag: root ? `Root cause: ${rootEvidence(root)}` : null };
  }, [rc, showTests]);

  const focusSet = useMemo(() => {
    if (rcInfo) return rcInfo.set;
    if (!selected) return null;
    const s = new Set([selected]); ancestors(selected, showTests).forEach(x => s.add(x)); descendants(selected, showTests).forEach(x => s.add(x)); return s;
  }, [selected, showTests, rcInfo]);
  const upSet = useMemo(() => selected && !rcInfo ? new Set([selected, ...ancestors(selected, showTests)]) : null, [selected, showTests, rcInfo]);
  const downSet = useMemo(() => selected && !rcInfo ? new Set([selected, ...descendants(selected, showTests)]) : null, [selected, showTests, rcInfo]);

  const edges = useMemo(() => {
    const out = [];
    const add = (s, t, isTest) => {
      const off = hiddenLanes.has(laneOf(s)) || (!isTest && hiddenLanes.has(laneOf(t)));
      let stroke = P.lineStrong, w = 1.4, animated = false, cls = '';
      if (rcInfo) { if (rcInfo.hot.has(s) && rcInfo.hot.has(t)) { stroke = P.failed; w = 2.8; animated = true; cls = 'rc'; } else if (rcInfo.set.has(s) && rcInfo.set.has(t)) { stroke = P.lineStrong; w = 1.6; } else cls = 'dim'; }
      else if (focusSet && upSet) { const isUp = upSet.has(s) && upSet.has(t); const isDown = downSet.has(s) && downSet.has(t);
          if (isUp || isDown) { stroke = isUp ? P.ice : P.warn; w = 2.4; } else cls = 'dim'; }
      if (off) cls = 'dim';
      out.push({ id: s + '>' + t, source: s, target: t, animated, className: cls, style: { stroke, strokeWidth: w }, markerEnd: { type: MarkerType.ArrowClosed, width: 14, height: 14, color: stroke }, zIndex: cls === 'rc' ? 2 : 0 });
    };
    GRAPH.forEach(n => n.depends_on.forEach(d => { if (GRAPH_SET.has(d)) add(d, n.unique_id, false); }));
    if (showTests) layout.tests.forEach(t => testTargets(BY_ID[t]).forEach(d => add(d, t, true)));
    if (rcInfo && rcInfo.root && GRAPH_SET.has(rcInfo.root.id) && !rcInfo.models.some(m => ancestors(m, false).has(rcInfo.root.id))) {
      rcInfo.models.forEach(m => out.push({ id: 'rc-link-' + m, source: rcInfo.root.id, target: m, animated: true, className: 'rc', zIndex: 3,
        label: `named root cause${rcInfo.root.kind ? ': ' + (RC_KIND[rcInfo.root.kind] || rcInfo.root.kind) : ''}`, labelStyle: { fill: P.failed, fontWeight: 600, fontSize: 12 },
        labelBgStyle: { fill: P.surface }, labelBgPadding: [6, 3], labelBgBorderRadius: 6,
        style: { stroke: P.failed, strokeWidth: 2.6 }, markerEnd: { type: MarkerType.ArrowClosed, width: 14, height: 14, color: P.failed } }));
    }
    return out;
  }, [layout, showTests, focusSet, upSet, downSet, rcInfo, hiddenLanes, P, selected]);

  const centerOn = useCallback((uid, zoomTo) => {
    const node = rf.getNode(uid); if (!node) return;
    const z = zoomTo || Math.max(rf.getZoom(), 0.95);
    const h = stageRef.current ? stageRef.current.clientHeight : 800;
    const dy = sheet ? (h * 0.31) / z : 0;
    const w = node.width || NODE_W, hh = node.height || NODE_H;
    rf.setCenter(node.position.x + w / 2, node.position.y + hh / 2 + dy, { zoom: z, duration: 500 });
  }, [rf, sheet]);

  const focusNode = useCallback((uid, opts = {}) => {
    if (!BY_ID[uid]) return;
    if (BY_ID[uid].type === 'test' && !showTests) { setSelected(uid); setTab('overview'); const m = testTargets(BY_ID[uid])[0]; if (m) setTimeout(() => centerOn(m), 80); return; }
    setSelected(uid); setTab(opts.tab || 'overview'); if (!opts.keepRc) setRc(null);
    if (hiddenLanes.has(laneOf(uid))) { const s = new Set(hiddenLanes); s.delete(laneOf(uid)); setHiddenLanes(s); }
    setTimeout(() => centerOn(uid), 80);
  }, [centerOn, showTests, hiddenLanes]);

  const trace = useCallback(tid => {
    setRc(tid); const models = testTargets(BY_ID[tid]);
    setSelected(models[0] || tid); setTab('tests'); setOverlay('status');
    setTimeout(() => {
      const ids = new Set(models); models.forEach(m => ancestors(m, false).forEach(a => ids.add(a)));
      const root = rootCauseOf(tid); if (root && GRAPH_SET.has(root.id)) ids.add(root.id);
      const h = stageRef.current ? stageRef.current.clientHeight : 800;
      rf.fitView({ nodes: [...ids].map(id => ({ id })), padding: sheet ? 0.25 : 0.18, duration: 600, maxZoom: 1.05 });
      if (sheet) setSheet(null);
    }, 90);
  }, [rf, sheet]);

  const jumpProblem = useCallback(i => { setPIdx(i); const u = PROBLEMS[i]; setRc(null); focusNode(u); }, [focusNode]);
  const openSheet = useCallback(k => { setSheet(k); setPalette(false); }, []);
  const ack = useCallback(k => setAcks(a => ({ ...a, [k]: 'you' })), []);
  const toggleLane = useCallback(k => setHiddenLanes(prev => { const s = new Set(prev); s.has(k) ? s.delete(k) : s.add(k); if (k === 'gold') { s.has('gold') ? s.add('snapshot') : s.delete('snapshot'); } return s; }), []);

  useEffect(() => {
    const onKey = e => {
      const typing = /INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || '');
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPalette(p => !p); return; }
      if (e.key === 'Escape') { if (palette) return; if (rc) { setRc(null); return; } if (sheet) { setSheet(null); return; } if (selected) { setSelected(null); return; } }
      if (typing || palette || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === '/') { e.preventDefault(); setPalette(true); }
      else if (/^[1-5]$/.test(e.key)) setOverlay(OVERLAYS[+e.key - 1].key);
      else if (e.key.toLowerCase() === 't') setShowTests(s => !s);
      else if (e.key === ']' && PROBLEMS.length) jumpProblem(pIdx == null ? 0 : (pIdx + 1) % PROBLEMS.length);
      else if (e.key === '[' && PROBLEMS.length) jumpProblem(pIdx == null ? PROBLEMS.length - 1 : (pIdx - 1 + PROBLEMS.length) % PROBLEMS.length);
    };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  }, [palette, rc, sheet, selected, pIdx, jumpProblem]);

  const items = useMemo(() => {
    const it = [];
    it.push({ id: 's-overview', group: 'Go to', label: 'Overview', hint: 'whole graph, overview strip', run: () => { setSheet(null); setSelected(null); setRc(null); setStripOpen(true); rf.fitView({ padding: 0.06, duration: 400 }); } });
    SECTIONS.forEach(s => it.push({ id: 's-' + s.key, group: 'Go to', label: s.label, hint: s.hint, run: () => openSheet(s.key) }));
    PROBLEMS.forEach(u => it.push({ id: 'p-' + u, group: 'Problems', label: BY_ID[u].name, hint: NODE[u].reasons[0] ? NODE[u].reasons[0].text : '', dot: statusColor(P, NODE[u].status), run: () => focusNode(u) }));
    LATEST_FAILING.forEach(t => it.push({ id: 'rc-' + t, group: 'Problems', label: `Trace root cause of ${testLabel(BY_ID[t])}`, hint: testTargets(BY_ID[t]).map(m => BY_ID[m].name).join(', '), dot: P.failed, run: () => trace(t) }));
    OVERLAYS.forEach((o, i) => it.push({ id: 'o-' + o.key, group: 'Map layer', label: `Show ${o.label.toLowerCase()}`, hint: `key ${i + 1}`, run: () => setOverlay(o.key) }));
    it.push({ id: 'a-tests', group: 'Actions', label: 'Toggle tests on canvas', hint: 'key T', run: () => setShowTests(s => !s) });
    it.push({ id: 'a-theme', group: 'Actions', label: 'Switch light or dark theme', hint: '', run: () => setTheme(t => t === 'light' ? 'dark' : 'light') });
    it.push({ id: 'a-fit', group: 'Actions', label: 'Fit the whole graph', hint: '', run: () => rf.fitView({ padding: 0.06, duration: 400 }) });
    it.push({ id: 'a-strip', group: 'Actions', label: 'Show or hide the overview strip', hint: '', run: () => setStripOpen(s => !s) });
    GRAPH.forEach(n => it.push({ id: 'n-' + n.unique_id, group: 'Nodes', label: n.name, hint: `${n.type}, ${LAYER_LABEL[n.layer]}`, dot: statusColor(P, NODE[n.unique_id].status), run: () => focusNode(n.unique_id) }));
    TESTS.forEach(t => it.push({ id: 't-' + t.unique_id, group: 'Tests', label: testLabel(t), hint: testTargets(t).map(m => BY_ID[m].name).join(', ') || 'project check', dot: isBad(TRES[t.unique_id][LAST]) ? P.failed : P.ok, run: () => focusNode(t.unique_id) }));
    return it;
  }, [P, focusNode, trace, openSheet, rf]);

  const view = useMemo(() => ({ overlay, selected, focusSet, hiddenLanes, legendFilter, showTests, rc, rcModels: rcInfo ? rcInfo.models : [], rcFlag: rcInfo ? rcInfo.flag : null, rcRoot: rcInfo && rcInfo.root ? rcInfo.root.id : null, rcRootFlag: rcInfo ? rcInfo.rootFlag : null }),
    [overlay, selected, focusSet, hiddenLanes, legendFilter, showTests, rc, rcInfo]);

  const sheetMeta = {
    incidents: ['Incidents', `${INCIDENTS.filter(i => !(acks[i.incident_key] || i.acknowledged_by)).length} open, ${INCIDENTS.length} in total`],
    tests: ['Tests & anomalies', `${LATEST_FAILING.length} failing of ${TESTS.length} in the latest run, ${Object.values(METRICS).filter(metricAnomalous).length} of ${Object.keys(METRICS).length} monitored metrics anomalous`],
    runs: ['Runs', `${NR} runs, ${RUNS.filter(r => r.status !== 'success').length} failed`],
    cost: ['Cost', `${sum(RUNS.map(r => r.credits || 0)).toFixed(3)} credits over ${NR} runs`],
    sched: ['Schedules & freshness', `${Object.values(SLA).filter(s => s.missed).length} missed of ${Object.keys(SLA).length} schedules, ${DATA.source_freshness.length} sources`],
    schema: ['Schema changes', `${DATA.schema_changes.length} column changes on ${new Set(DATA.schema_changes.map(c => c.relation)).size} tables`],
    settings: ['Settings & about', `icecore ${(DATA.capabilities || {}).icecore_version || ''}`],
  };
  const sheetBody = {
    incidents: () => <IncidentsSheet acks={acks} ack={ack} onFocus={focusNode} onTrace={trace} />,
    tests: () => <TestsSheet onFocus={focusNode} onTrace={trace} />,
    runs: () => <RunsSheet onFocus={focusNode} />,
    cost: () => <CostSheet onFocus={focusNode} />,
    sched: () => <SchedulesSheet onFocus={focusNode} />,
    schema: () => <SchemaSheet onFocus={focusNode} />,
    settings: () => <SettingsSheet theme={theme} setTheme={setTheme} showTests={showTests} setShowTests={setShowTests} overlay={overlay} setOverlay={setOverlay} />,
  };

  return <ThemeCtx.Provider value={{ theme, P }}>
    <ViewCtx.Provider value={view}>
      <div className="app">
        <header className="topbar">
          <div className="brand"><Logo />icecore</div>
          <div className="proj"><b>{DATA.project}</b>, report of {fmtDT(NOW)}</div>
          <button className="kbtn" onClick={() => setPalette(true)} aria-label="Open the jump-to palette"><Icon n="search" s={15} />Jump to a section or node<kbd>{/Mac/.test(navigator.platform) ? '⌘K' : 'Ctrl K'}</kbd></button>
          <span className="spacer" />
          <div className="chips">{SECTIONS.slice(0, 6).map(s => <button key={s.key} className="chip" aria-pressed={sheet === s.key} onClick={() => setSheet(sheet === s.key ? null : s.key)} style={{ display: window.innerWidth < 1500 ? 'none' : undefined }}>{s.label}</button>)}</div>
          <button className="iconbtn" aria-label="Settings" title="Settings" onClick={() => setSheet(sheet === 'settings' ? null : 'settings')}><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)" /></svg></button>
          <button className="iconbtn" aria-label={theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme'} title="Theme" onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}><Icon n={theme === 'light' ? 'moon' : 'sun'} /></button>
          <button className="iconbtn" aria-label={stripOpen ? 'Hide overview strip' : 'Show overview strip'} title="Overview strip" onClick={() => setStripOpen(!stripOpen)}><Icon n={stripOpen ? 'up' : 'down'} /></button>
        </header>
        <Strip open={stripOpen} acks={acks} openSheet={openSheet} />
        <div className="main">
          <div className="stage" ref={stageRef}>
            <Flow nodes={nodes} edges={edges} nodeTypes={NODE_TYPES} fitView fitViewOptions={{ padding: 0.08 }} minZoom={0.15} maxZoom={2}
              nodesDraggable={false} nodesConnectable={false} elementsSelectable={false} proOptions={{ hideAttribution: true }}
              onNodeClick={(e, n) => { if (n.type === 'lane') return; setRc(null); setSelected(n.id); setTab('overview'); }}
              onPaneClick={() => { if (rc) setRc(null); else setSelected(null); setLegendFilter(null); }}
              onNodeMouseEnter={(e, n) => n.type !== 'lane' && setHover({ id: n.id, x: e.clientX, y: e.clientY })}
              onNodeMouseLeave={() => setHover(null)}>
              <Background variant="dots" gap={22} size={1.3} color={theme === 'light' ? '#C3CDD6' : '#27333F'} />
              <MiniMap pannable zoomable position="bottom-right" maskColor={P.mask} style={{ width: 190, height: 120 }}
                nodeColor={n => n.type === 'lane' ? P.lane[n.data.key] + '22' : n.type === 'test' ? (isBad(TRES[n.id][LAST]) ? P.failed : P.line) : statusColor(P, NODE[n.id].status)}
                nodeStrokeWidth={0} nodeBorderRadius={4} ariaLabel="Mini map of the lineage" />
              <Controls showInteractive={false} position="bottom-left" />
            </Flow>
            {!sheet && <Legend overlay={overlay} legendFilter={legendFilter} setLegendFilter={setLegendFilter} showTests={showTests} narrow={stageW < 760} />}
            {!sheet && <ProblemsPill idx={pIdx} onJump={jumpProblem} />}
            {!sheet && <Toolbar overlay={overlay} setOverlay={setOverlay} showTests={showTests} setShowTests={setShowTests} hiddenLanes={hiddenLanes} toggleLane={toggleLane} compact={!!selected || stageW < 1060} />}
            {sheet && <Sheet title={sheetMeta[sheet][0]} sum={sheetMeta[sheet][1]} big={sheetBig} setBig={setSheetBig} onClose={() => setSheet(null)}>{sheetBody[sheet]()}</Sheet>}
          </div>
          {rc ? <RootCauseCard tid={rc} onFocus={(u, o) => focusNode(u, { ...(o || {}), keepRc: !o })} onClose={() => setRc(null)} openSheet={openSheet} />
            : selected && <NodePanel key={selected} uid={selected} tab={tab} setTab={setTab} onFocus={focusNode} onTrace={trace} onClose={() => { setSelected(null); setRc(null); }} openSheet={openSheet} acks={acks} />}
        </div>
      </div>
      {palette && <Palette items={items} onClose={() => setPalette(false)} />}
      {hover && BY_ID[hover.id] && <HoverCard id={hover.id} x={hover.x} y={hover.y} overlay={overlay} />}
    </ViewCtx.Provider>
  </ThemeCtx.Provider>;
}
function HoverCard({ id, x, y, overlay }) {
  const { P } = useContext(ThemeCtx);
  const n = BY_ID[id];
  if (n.type === 'test') { const bad = isBad(TRES[id][LAST]); return <div className="card hover" style={{ left: x + 14, top: y + 14 }}><b>{testLabel(n)}</b><div className="ink2">{bad ? `Failing, ${TRES[id][LAST].failures} rows` : 'Passing'}</div></div>; }
  const st = NODE[id].status; const le = EXEC[id][LAST];
  const left = Math.min(x + 14, window.innerWidth - 320);
  return <div className="card hover" style={{ left, top: y + 14 }}>
    <b>{n.name}</b>
    <div style={{ display: 'flex', alignItems: 'center', gap: 6, margin: '2px 0 4px' }}><span className="dot" style={{ background: statusColor(P, st) }} /><span style={{ fontWeight: 600 }}>{STATUS_LABEL[st]}</span><span className="muted">{LAYER_LABEL[n.layer]}</span></div>
    {NODE[id].reasons.slice(0, 2).map((r, i) => <div key={i} className="ink2">{r.text}</div>)}
    <div className="muted" style={{ marginTop: 4 }}>{le ? `Last build ${fmtS(le.execution_time_s)}, ` : ''}{TESTS_OF[id].length} tests{COST[id].has ? `, ${COST[id].total.toFixed(3)} credits in all runs` : ''}{SRC_LAG[id] != null ? `${fmtMin(SRC_LAG[id])} behind source` : ''}</div>
    <div className="muted" style={{ marginTop: 2 }}>Click to open its panel and path.</div>
  </div>;
}

function App() { return <ReactFlowProvider><Shell /></ReactFlowProvider>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
