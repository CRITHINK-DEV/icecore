<!doctype html>
<!--
DIRECTION B, "Lineage canvas". Idea: the project's lineage IS the home screen; status, freshness, cost, tests and schedules are map layers you switch on it, and every other section opens as a sheet over the graph.
Who it suits: engineers triaging a failed run ("what broke, what is upstream, what does it hit") and leads who think in pipelines; less suited to people who only want a ranked list.
What is great: one spatial anchor; problems glow and a pill jumps between them; a failing test animates its root-cause path; the node panel holds history, tests, band charts, schema and cost with no page change.
What it costs: the most front-end work of the four (React Flow + dagre layout, semantic zoom, overlays, focus/centering logic); about 3 to 4 weeks for one engineer to production quality, plus layout tuning for 300+ node projects.
Generated report: this file is the prototype; the CLI writes the view rows as window.ICECORE_DATA next to the same React bundle (inlined), so it opens offline exactly like this.
Streamlit: the canvas, node panel and sheets ship as ONE custom component (this React app) fed by the views; Streamlit only hosts it and handles acknowledge writes; the Snowflake Native App reuses the same bundle.

Custom component note (Streamlit): needs a custom component for the React Flow canvas and its overlays, the docked node panel (tabs, band charts),
the command palette (Ctrl/Cmd-K) and the overlay sheets; the run Gantt and band charts could fall back to st.plotly_chart but would lose the click-to-focus link to the graph.
The acknowledge button is local state here; in Streamlit it would call back to Python to write ALERTS_FEED.acknowledged_by.
-->

/* nodes */

.sheet { position:absolute; left:0; right:0; bottom:0; z-index:12; background:var(--surface); border-top:1px solid var(--line); border-radius:16px 16px 0 0; box-shadow:0 -12px 40px rgba(16,24,32,.16); display:flex; flex-direction:column; animation:rise .22s ease-out; }

<script type="text/babel" data-presets="react">
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================== data model ============================== */
const DATA = window.ICECORE_DATA || { nodes: [], runs: [], node_executions: [], test_results: [], metrics: [], source_freshness: [], schema_changes: [], slas: [], incidents: [], capabilities: {} };

const fmtDay = t => { const d = new Date(t); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };

const NOW = ts(DATA.generated_at);
const RUNS = [...DATA.runs].sort((a, b) => a.started_at.localeCompare(b.started_at));
const NR = RUNS.length, LAST = NR - 1;
const RUN_IDX = {}; RUNS.forEach((r, i) => RUN_IDX[r.invocation_id] = i);
const BY_ID = {}; DATA.nodes.forEach(n => BY_ID[n.unique_id] = n);
const GRAPH = DATA.nodes.filter(n => n.type !== 'test');
const GRAPH_SET = new Set(GRAPH.map(n => n.unique_id));
const TESTS = DATA.nodes.filter(n => n.type === 'test');
const BY_NAME = {}; GRAPH.forEach(n => BY_NAME[n.name] = n.unique_id);

const LANES = [
  { key: 'inputs', label: 'Inputs' },
  { key: 'transient', label: 'Transient' },
  { key: 'bronze', label: 'Bronze' },
  { key: 'silver', label: 'Silver' },
  { key: 'gold', label: 'Gold' },
  { key: 'snapshot', label: 'Snapshots', under: 'gold' },

const LANE_OF_LAYER = { source: 'inputs', seed: 'inputs', transient: 'transient', bronze: 'bronze', silver: 'silver', gold: 'gold', gold_analytics: 'gold', snapshot: 'snapshot' };
const laneOf = uid => LANE_OF_LAYER[(BY_ID[uid] || {}).layer] || 'inputs';
const LAYER_LABEL = { source: 'source', seed: 'seed', transient: 'transient', bronze: 'bronze', silver: 'silver', gold: 'gold', gold_analytics: 'gold analytics', snapshot: 'snapshot' };

const EXEC = {}; GRAPH.forEach(n => EXEC[n.unique_id] = new Array(NR).fill(null));
DATA.node_executions.forEach(e => { const i = RUN_IDX[e.invocation_id]; if (EXEC[e.unique_id] && i != null) EXEC[e.unique_id][i] = e; });
const TRES = {}; TESTS.forEach(t => TRES[t.unique_id] = new Array(NR).fill(null));
DATA.test_results.forEach(r => { const i = RUN_IDX[r.invocation_id]; if (TRES[r.test_unique_id] && i != null) TRES[r.test_unique_id][i] = r; });
const TESTS_OF = {}; GRAPH.forEach(n => TESTS_OF[n.unique_id] = []);
TESTS.forEach(t => t.depends_on.forEach(d => { if (TESTS_OF[d]) TESTS_OF[d].push(t.unique_id); }));
const PROJECT_CHECKS = TESTS.filter(t => !t.depends_on.length);
const isBad = r => r && r.status && r.status !== 'pass' && r.status !== 'success';
const testTargets = t => t.depends_on.filter(d => GRAPH_SET.has(d));

const TEST_WORDS = { not_null: 'Not null', unique: 'Unique', accepted_values: 'Accepted values', relationships: 'Relationship', is_empty: 'Is empty',
  expect_column_values_to_be_between: 'Value in range', non_negative_value: 'Not negative', positive_value: 'Positive', date_not_in_future: 'Date not in future',
  accepted_range: 'Accepted range', valid_email: 'Valid email' };
function testLabel(t) {
  if (!t) return '';
  if (t.test_name) return `${TEST_WORDS[t.test_name] || t.test_name.replace(/_/g, ' ')}${t.column ? ' (' + t.column + ')' : ''}`;
  return t.name.replace(/^is_empty_fct_/, 'Empty: ').replace(/_$/, '').replace(/_/g, ' ');
}
const testType = t => t.test_name ? (TEST_WORDS[t.test_name] || t.test_name) : (t.depends_on.length ? 'Custom' : 'Project check');

/* adjacency */

  GRAPH.forEach(n => n.depends_on.forEach(d => { if (GRAPH_SET.has(d)) add(d, n.unique_id); }));
  if (withTests) TESTS.forEach(t => testTargets(t).forEach(d => add(d, t.unique_id)));
  return { parents, children };
}
const ADJ = { false: buildAdj(false), true: buildAdj(true) };
function walk(start, map) { const out = new Set(); const st = [...(map[start] || [])]; while (st.length) { const x = st.pop(); if (out.has(x)) continue; out.add(x); (map[x] || []).forEach(y => st.push(y)); } return out; }
const ancestors = (uid, wt) => walk(uid, ADJ[wt].parents);
const descendants = (uid, wt) => walk(uid, ADJ[wt].children);

/* incidents -> nodes */
const KIND = { test_failure: 'Failing test', anomaly: 'Anomaly', schema_change: 'Schema change', silence: 'Missed schedule', cost: 'Cost spike' };

  if (BY_ID[key]) { const n = BY_ID[key]; return n.type === 'test' ? { nodeId: testTargets(n).slice(-1)[0] || null, testId: key } : { nodeId: key }; }

/* SLAs, freshness */
const SLA = {};

});
const SRC_LAG = {}, SRC_MAX = {}; DATA.source_freshness.forEach(f => { SRC_LAG[f.unique_id] = f.freshness_lag_min; if (f.max_lag_min != null) SRC_MAX[f.unique_id] = f.max_lag_min; });

/* metrics */
const METRICS = {};
DATA.metrics.forEach(m => { const k = m.unique_id + '|' + m.metric; const g = METRICS[k] = METRICS[k] || { key: k, uid: m.unique_id, relation: m.relation, metric: m.metric, engines: {} }; (g.engines[m.engine] = g.engines[m.engine] || []).push(m); });
Object.values(METRICS).forEach(g => Object.values(g.engines).forEach(a => a.sort((x, y) => x.observed_at.localeCompare(y.observed_at))));

const metricAnomalous = g => Object.values(g.engines).some(a => a.length && a[a.length - 1].anomaly);

const METRIC_UNIT = { row_count: { axis: 'Rows', u: 'rows', name: 'Row count', fmt: fmtN }, freshness_lag_minutes: { axis: 'Minutes behind', u: 'min', name: 'Freshness lag', fmt: v => String(v) } };
const unitOf = m => METRIC_UNIT[m] || { axis: 'Value', u: '', name: m.replace(/_/g, ' '), fmt: v => String(v) };
const SCHEMA_OF = name => DATA.schema_changes.filter(c => c.relation === name);

/* cost */
const COST = {};
GRAPH.forEach(n => {

const PENDING_RUNS = RUNS.filter(r => r.credits == null).length;

function rootCauseOf(tid) {
  const rs = TRES[tid] || []; const r = [...rs].reverse().find(x => x && isBad(x) && x.root_cause_unique_id);

}
/* status + reasons */
const SEV_RANK = { failed: 3, stale: 2, warn: 1, ok: 0, notrun: -1 };
const STATUS_LABEL = { failed: 'Failed', warn: 'Warning', stale: 'Missed schedule', ok: 'OK', notrun: 'Not run' };
const NODE = {};
GRAPH.forEach(n => {
  const uid = n.unique_id; const reasons = [];
  const le = EXEC[uid][LAST];
  if (le && le.status === 'error') reasons.push({ sev: 'failed', text: `Build failed in the latest run (${fmtDT(ts(RUNS[LAST].started_at))})` });
  const failing = TESTS_OF[uid].filter(t => isBad(TRES[t][LAST]));
  failing.forEach(t => {
    const inc = INCIDENTS.find(i => i.testId === t);
    reasons.push({ sev: 'failed', text: `${testLabel(BY_ID[t])} failing, ${TRES[t][LAST].failures} rows`, testId: t, incident: inc && inc.incident_key });
  });
  INCIDENTS.filter(i => i.nodeId === uid && !(i.testId && failing.includes(i.testId))).forEach(i => {
    reasons.push({ sev: i.kind === 'silence' ? 'stale' : i.severity === 'error' ? 'failed' : 'warn', text: i.title, incident: i.incident_key });
  });
  TESTS.forEach(t => { if (!isBad(TRES[t.unique_id][LAST])) return; const rt = rootCauseOf(t.unique_id);
    if (rt && rt.id === uid) reasons.push({ sev: 'warn', text: `Named root cause of the failing test ${testLabel(t)} on ${testTargets(t).map(m => BY_ID[m].name).join(', ')}: ${RC_KIND[rt.kind] || rt.kind || 'unknown'} (${rootEvidence(rt)})`, testId: t.unique_id, isRoot: true }); });
  if (srcLate(uid)) reasons.push({ sev: 'stale', text: `${fmtMin(SRC_LAG[uid])} behind the source system, limit ${fmtMin(SRC_MAX[uid])}` });
  let status = reasons.length ? reasons.reduce((a, r) => SEV_RANK[r.sev] > SEV_RANK[a] ? r.sev : a, 'ok') : (EXEC[uid].some(Boolean) ? 'ok' : 'notrun');

const PROBLEMS = GRAPH.map(n => n.unique_id).filter(u => ['failed', 'stale', 'warn'].includes(NODE[u].status))
  .sort((a, b) => SEV_RANK[NODE[b].status] - SEV_RANK[NODE[a].status] || BY_ID[a].name.localeCompare(BY_ID[b].name));

/* test helpers */
function failingSince(tid) { const r = TRES[tid]; if (!isBad(r[LAST])) return null; let i = LAST; while (i > 0 && isBad(r[i - 1])) i--; return i; }
const LATEST_FAILING = TESTS.filter(t => isBad(TRES[t.unique_id][LAST])).map(t => t.unique_id);
const FAILS_PER_RUN = RUNS.map((_, i) => TESTS.filter(t => isBad(TRES[t.unique_id][i])).length);

/* ============================== layout ============================== */
const NODE_W = 200, NODE_H = 54, COL = 248, ROW = 74, LANE_GAP = 28, TEST_W = 180, TEST_H = 28;
function layoutLanes() {
  const g = new dagre.graphlib.Graph(); g.setGraph({ rankdir: 'LR', nodesep: 20, ranksep: 50 }); g.setDefaultEdgeLabel(() => ({}));
  GRAPH.forEach(n => g.setNode(n.unique_id, { width: NODE_W, height: NODE_H }));
  GRAPH.forEach(n => n.depends_on.forEach(d => { if (GRAPH_SET.has(d)) g.setEdge(d, n.unique_id); }));
  dagre.layout(g);
  const depth = {};
  const dep = uid => { if (depth[uid] != null) return depth[uid]; const L = laneOf(uid); let d = 0; BY_ID[uid].depends_on.forEach(p => { if (GRAPH_SET.has(p) && laneOf(p) === L) d = Math.max(d, dep(p) + 1); }); return depth[uid] = d; };
  GRAPH.forEach(n => dep(n.unique_id));
  const laneCols = {}; GRAPH.forEach(n => { const L = laneOf(n.unique_id); laneCols[L] = Math.max(laneCols[L] || 0, depth[n.unique_id] + 1); });
  const laneX = {}; let x = 0;
  LANES.forEach(L => { if (!laneCols[L.key] || L.under) return; laneX[L.key] = x; x += laneCols[L.key] * COL + LANE_GAP; });

  Object.entries(cols).forEach(([k, ids]) => {

  });

    } else {
      lanes.push({ key: L.key, label: L.label, x: laneX[L.key] - 22, y: y0, w: laneCols[L.key] * COL - 4, h: y1 - y0, count: ids.length });
    }

}

  const g = new dagre.graphlib.Graph(); g.setGraph({ rankdir: 'LR', nodesep: 8, ranksep: 70 }); g.setDefaultEdgeLabel(() => ({}));
  GRAPH.forEach(n => g.setNode(n.unique_id, { width: NODE_W, height: NODE_H }));
  const tests = TESTS.filter(t => testTargets(t).length);
  tests.forEach(t => g.setNode(t.unique_id, { width: TEST_W, height: TEST_H }));

const LAYOUT_LANES = layoutLanes();
let LAYOUT_TESTS = null;

/* ============================== theme ============================== */
const PAL = {
  light: { surface: '#FFFFFF', surface2: '#F3F6F8', line: '#D6DEE5', lineStrong: '#AEBBC7', ink: '#16202A', ink2: '#4A5866', ink3: '#74818E', ice: '#1668A0', iceSoft: '#DCEBF6',
    failed: '#CF3A2B', warn: '#B9740A', stale: '#7656D0', ok: '#2C8A5F', notrun: '#8E99A5', failedSoft: '#FBE3E0', warnSoft: '#FCEFD6', staleSoft: '#ECE6FB', okSoft: '#DFF2E8', notrunSoft: '#EDF0F3',
    lane: { inputs: '#64717E', transient: '#3F93A3', bronze: '#A4652A', silver: '#8795A4', gold: '#BE9116', snapshot: '#6A7BA0' },
    freshLo: '#E2F0F8', freshHi: '#145A88', costLo: '#FCF1DF', costHi: '#B4400F', mask: 'rgba(232,237,241,0.72)' },
  dark: { surface: '#1A2430', surface2: '#202C39', line: '#2C3946', lineStrong: '#43525F', ink: '#E4EAF0', ink2: '#A9B6C2', ink3: '#7F8C99', ice: '#62B2E8', iceSoft: '#173247',
    failed: '#F0685A', warn: '#E9A53A', stale: '#A48BF0', ok: '#4CC08A', notrun: '#7D8996', failedSoft: '#3D2120', warnSoft: '#3A2C14', staleSoft: '#2A2342', okSoft: '#173327', notrunSoft: '#222C36',
    lane: { inputs: '#8D9AA7', transient: '#5DB3C2', bronze: '#CC8A4C', silver: '#A7B4C2', gold: '#DDB33E', snapshot: '#8C9CC2' },
    freshLo: '#1D3446', freshHi: '#7CC6F2', costLo: '#33281A', costHi: '#F08A4B', mask: 'rgba(19,27,36,0.72)' },
};
const ThemeCtx = createContext({ theme: 'light', P: PAL.light });
const ViewCtx = createContext(null);
function hexMix(a, b, t) {

const FONT = '"Schibsted Grotesk", system-ui, sans-serif';

/* ============================== small charts ============================== */
function Spark({ values, w = 96, h = 24, color, label }) {
  const pts = values.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return <span className="muted">—</span>;
  const max = Math.max(...pts.map(p => p[1])), min = Math.min(...pts.map(p => p[1]));
  const X = i => 2 + (i / (values.length - 1)) * (w - 4), Y = v => h - 3 - ((v - min) / ((max - min) || 1)) * (h - 6);
  const d = pts.map((p, k) => (k ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const lp = pts[pts.length - 1];
  return <svg width={w} height={h} role="img" aria-label={label}><title>{label}</title><path d={d} fill="none" stroke={color || 'var(--ice)'} strokeWidth="1.5" /><circle cx={X(lp[0])} cy={Y(lp[1])} r="2.4" fill={color || 'var(--ice)'} /></svg>;
}
function RunStrip({ cells, label }) {
  const C = { ok: 'var(--ok)', fail: 'var(--failed)', none: 'var(--line)', warn: 'var(--warn)' };
  return <svg width={cells.length * 6} height="14" role="img" aria-label={label}>
    {cells.map((c, i) => <rect key={i} x={i * 6} y="0" width="4" height="14" rx="1" fill={C[c.s] || C.none}><title>{c.t}</title></rect>)}
  </svg>;
}
function EChart({ option, height = 220, onClick }) {
  const ref = useRef(null), inst = useRef(null), cb = useRef(onClick);
  cb.current = onClick;
  useEffect(() => {
    inst.current = echarts.init(ref.current, null, { renderer: 'canvas' });
    inst.current.on('click', p => cb.current && cb.current(p));
    const ro = new ResizeObserver(() => inst.current && inst.current.resize()); ro.observe(ref.current);
    return () => { ro.disconnect(); inst.current.dispose(); inst.current = null; };
  }, []);
  useEffect(() => { inst.current && inst.current.setOption(option, true); }, [option]);
  return <div ref={ref} style={{ height, width: '100%' }} />;
}
const cTitle = (P, text, sub) => ({ text, subtext: sub, left: 0, top: 0, textStyle: { fontSize: 13, fontWeight: 600, color: P.ink, fontFamily: FONT }, subtextStyle: { color: P.ink3, fontSize: 11.5, fontFamily: FONT } });
const cAxis = (P, name, extra = {}) => ({ name, nameLocation: 'middle', nameGap: 32, nameTextStyle: { color: P.ink3, fontSize: 11.5, fontFamily: FONT },
  axisLine: { lineStyle: { color: P.line } }, axisTick: { show: false }, axisLabel: { color: P.ink3, fontSize: 11, fontFamily: FONT },
  splitLine: { lineStyle: { color: P.line, type: 'dashed' } }, ...extra });
const cTip = P => ({ backgroundColor: P.surface, borderColor: P.line, textStyle: { color: P.ink, fontFamily: FONT, fontSize: 12 }, extraCssText: 'box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:8px;' });

function bandOption(P, pts, title, metric) {
  const U = unitOf(metric || 'row_count');
  const cats = pts.map(p => fmtDay(ts(p.observed_at)));
  const f = v => v == null ? '—' : `${Number(v).toLocaleString()} ${U.u}`;
  return {
    animation: false, title: cTitle(P, title), grid: { left: 58, right: 12, top: 40, bottom: 44 },
    tooltip: { ...cTip(P), trigger: 'axis', formatter: ps => { const i = ps[0].dataIndex, p = pts[i];
      return `<b>${fmtDay(ts(p.observed_at))}</b>, ${ENGINE_LABEL(p.engine)} engine<br>Observed: ${f(p.value)}<br>Expected: ${f(p.expected)}<br>Normal range: ${f(p.lower)} to ${f(p.upper)}${p.score != null ? '<br>Anomaly score: ' + p.score : ''}${p.anomaly ? '<br><b style="color:' + P.failed + '">Outside the range</b>' : ''}`; } },
    xAxis: cAxis(P, 'Day observed', { type: 'category', data: cats, boundaryGap: false, splitLine: { show: false }, nameGap: 28 }),
    yAxis: cAxis(P, U.axis, { type: 'value', scale: metric !== 'freshness_lag_minutes', nameGap: 46, axisLabel: { color: P.ink3, fontSize: 11, formatter: U.fmt } }),
    series: [
      { name: 'Lower', type: 'line', data: pts.map(p => p.lower), stack: 'band', symbol: 'none', lineStyle: { opacity: 0 }, silent: true },
      { name: 'Normal range', type: 'line', data: pts.map(p => p.upper - p.lower), stack: 'band', symbol: 'none', lineStyle: { opacity: 0 }, areaStyle: { color: P.ice, opacity: 0.14 }, silent: true },
      { name: 'Expected', type: 'line', data: pts.map(p => p.expected), symbol: 'none', lineStyle: { color: P.ink3, width: 1, type: 'dashed' } },
      { name: 'Observed', type: 'line', data: pts.map(p => ({ value: p.value, symbolSize: p.anomaly ? 11 : 4, itemStyle: { color: p.anomaly ? P.failed : P.ice } })), symbol: 'circle', lineStyle: { color: P.ice, width: 2 } },
    ],
  };
}
function MetricBlock({ g, onFocus, narrow, showName }) {

/* ============================== canvas nodes ============================== */
function overlayLook(P, overlay, uid) {
  const st = NODE[uid].status;
  if (overlay === 'status') {
    if (st === 'ok') return { bg: P.surface, border: P.lineStrong, ink: P.ink, dot: P.ok };
    return { bg: statusSoft(P, st), border: statusColor(P, st), ink: P.ink, dot: statusColor(P, st) };
  }
  if (overlay === 'fresh') {
    const a = freshAge(uid); if (a == null) return { unmeasured: true };
    const bg = hexMix(P.freshLo, P.freshHi, Math.sqrt(a / 720)); return { bg, border: srcLate(uid) || (SLA[uid] && SLA[uid].missed) ? P.failed : hexMix(P.freshLo, P.freshHi, 1), ink: lum(bg) < 0.45 ? '#FFFFFF' : '#16202A' };
  }
  if (overlay === 'cost') {
    const c = COST[uid]; if (!c.has) return { unmeasured: true };
    const bg = hexMix(P.costLo, P.costHi, Math.sqrt(c.total / COST_MAX)); return { bg, border: hexMix(P.costLo, P.costHi, 1), ink: lum(bg) < 0.45 ? '#FFFFFF' : '#16202A' };
  }
  if (overlay === 'tests') {
    const n = TESTS_OF[uid].length; if (!n) return { unmeasured: true };
    return NODE[uid].failing.length ? { bg: P.failedSoft, border: P.failed, ink: P.ink } : { bg: P.okSoft, border: P.ok, ink: P.ink };
  }
  if (overlay === 'sched') {
    const s = SLA[uid]; if (!s) return { unmeasured: true };
    const k = s.state === 'missed' ? 'failed' : s.state === 'soon' ? 'warn' : 'ok';
    return { bg: statusSoft(P, k), border: statusColor(P, k), ink: P.ink };
  }
  return {};
}
function overlaySub(overlay, uid) {
  const n = BY_ID[uid], st = NODE[uid].status;
  if (overlay === 'status') return st === 'ok' ? (n.materialization || n.type) : `${STATUS_LABEL[st]}${n.type === 'source' ? ' (source)' : ''}`;
  if (overlay === 'fresh') { if (SRC_LAG[uid] != null) return `${fmtMin(SRC_LAG[uid])} behind${SRC_MAX[uid] != null ? `, limit ${fmtMin(SRC_MAX[uid])}` : ''}`; if (SLA[uid]) return `last success ${fmtMin(SLA[uid].ageMin)} ago`; return 'not measured'; }
  if (overlay === 'cost') { const c = COST[uid]; return c.has ? `${c.total.toFixed(3)} cr in ${RUNS.length} runs` : 'no compute'; }
  if (overlay === 'tests') { const t = TESTS_OF[uid].length, f = NODE[uid].failing.length; return !t ? 'no tests' : f ? `${f} of ${t} failing` : `${t} passing`; }
  if (overlay === 'sched') { const s = SLA[uid]; if (!s) return 'no schedule declared'; return s.state === 'missed' ? `missed ${s.expected_every} schedule` : `due by ${fmtDT(s.deadline)}`; }
  return '';
}

function ModelNode({ id }) {
  const v = useContext(ViewCtx); const { P } = useContext(ThemeCtx);
  const zoom = useStore(s => s.transform[2]);
  const far = zoom < 0.82;
  const n = BY_ID[id], st = NODE[id].status;
  const look = overlayLook(P, v.overlay, id);
  const lane = laneOf(id);
  const nt = TESTS_OF[id].length, nf = NODE[id].failing.length;
  const cls = ['n'];
  if (far) cls.push('far');
  if (look.unmeasured) cls.push('unmeasured');
  if (v.hiddenLanes.has(lane)) cls.push('off');
  else if (v.focusSet && !v.focusSet.has(id)) cls.push('dim');
  else if (v.legendFilter && v.overlay === 'status' && st !== v.legendFilter) cls.push('dim');
  if (v.selected === id) cls.push('sel'); else if (v.focusSet && v.focusSet.has(id) && !v.rc) cls.push('inpath');
  const isProblem = PROBLEMS.includes(id);
  if (isProblem) cls.push('glow');
  const style = { background: look.bg, borderColor: look.border, color: look.ink, '--g': statusColor(P, st) };
  const ratio = COST[id].ratio;
  const rcFlag = v.rc && v.rcModels.includes(id) ? v.rcFlag : v.rc && v.rcRoot === id ? v.rcRootFlag : null;
  return (
    <div className={cls.join(' ')} style={style}>
      <Handle type="target" position={Position.Left} />
      <div className="n-stripe" style={{ background: P.lane[lane] }} />
      <div className="n-main">
        <div className="n-name">{n.name}</div>
        {!far && <div className="n-sub">{overlaySub(v.overlay, id)}</div>}
      </div>
      <div className="n-side">
        {v.overlay === 'status' && !look.unmeasured && <span className="dot" style={{ background: look.dot }} />}
        {v.overlay === 'cost' && ratio && ratio >= 1.5 ? <span className="n-badge hot" title="Credits in the last 4 attributed runs vs the earlier median">{ratio.toFixed(1)}×</span>
          : nt > 0 && !v.showTests ? <span className={'n-badge' + (nf ? ' bad' : '')} title={`${nt} tests, ${nf} failing in the latest run`}>{nf ? `${nf}/${nt}` : nt}{far ? '' : ' tests'}</span> : null}
      </div>
      {rcFlag && <div className={'n-flag' + (v.rcRoot === id ? ' root' : '')}>{rcFlag}</div>}
      <Handle type="source" position={Position.Right} />
    </div>
  );
}
function TestNode({ id }) {
  const v = useContext(ViewCtx);
  const t = BY_ID[id]; const bad = isBad(TRES[id][LAST]);
  const cls = ['t']; if (bad) cls.push('fail');
  if (v.focusSet && !v.focusSet.has(id)) cls.push('dim');
  if (v.selected === id) cls.push('sel');
  return <div className={cls.join(' ')} title={t.name}><Handle type="target" position={Position.Left} /><span className="dot" style={{ background: bad ? 'var(--failed)' : 'var(--ok)' }} /><span>{testLabel(t)}</span></div>;
}

function Legend({ overlay, legendFilter, setLegendFilter, showTests, narrow }) {

  const [min, setMin] = useState(false);
  useEffect(() => { if (narrow) setMin(true); }, [narrow]);

      <span className="dot" style={{ background: statusColor(P, s) }} />{STATUS_LABEL[s]}<b>{counts[s] || 0}</b></button>)}

  else if (overlay === 'fresh') body = <>
    <h4>Freshness</h4><div className="ramp" style={{ background: `linear-gradient(90deg, ${P.freshLo}, ${P.freshHi})` }} />
    <div className="ends"><span>0 min</span><span>12 h or more</span></div>

    <div className="ends"><span>0 cr</span><span>{COST_MAX.toFixed(3)} cr</span></div>

    <div className="row"><span className="dot" style={{ background: P.ok }} />All passing<b>{GRAPH.filter(n => TESTS_OF[n.unique_id].length && !NODE[n.unique_id].failing.length).length}</b></div>

    <h4>Schedules</h4>
    {[['failed', 'Missed schedule', 'missed'], ['warn', 'Due within 2 hours', 'soon'], ['ok', 'On time', 'ontime']].map(([c, l, k]) =>
      <div key={k} className="row"><span className="dot" style={{ background: statusColor(P, c) }} />{l}<b>{Object.values(SLA).filter(s => s.state === k).length}</b></div>)}

  const title = { status: 'Status', fresh: 'Freshness', cost: 'Cost heat', tests: 'Tests', sched: 'Schedules' }[overlay];
  if (min) return <div className="float card legend min"><h4>{title} legend<button className="iconbtn" style={{ marginLeft: 6 }} aria-label="Show legend" onClick={() => setMin(false)}><Icon n="down" /></button></h4></div>;
  return <div className="float card legend"><button className="iconbtn" style={{ position: 'absolute', top: 4, right: 4, width: 26, height: 26 }} aria-label="Hide legend" onClick={() => setMin(true)}><Icon n="up" s={14} /></button>{body}</div>;
}

function sameColumnChecks(tid) {
  const t = BY_ID[tid]; if (!t || !t.column) return [];
  const col = t.column.toLowerCase();
  const models = testTargets(t);
  const up = new Set(); models.forEach(m => ancestors(m, false).forEach(a => up.add(a)));
  const down = new Set(); models.forEach(m => descendants(m, false).forEach(a => down.add(a)));
  const out = [];
  TESTS.forEach(o => { if (o.unique_id === tid || (o.column || '').toLowerCase() !== col) return;
    testTargets(o).forEach(m => { const where = models.includes(m) ? 'same model' : up.has(m) ? 'upstream' : down.has(m) ? 'downstream' : null;
      if (where) out.push({ test: o.unique_id, model: m, where, bad: isBad(TRES[o.unique_id][LAST]) }); }); });
  return out;
}
function RootCauseCard({ tid, onFocus, onClose, openSheet }) {
  const t = BY_ID[tid]; const models = testTargets(t);
  const chain = useMemo(() => { const s = new Set(models); models.forEach(m => ancestors(m, false).forEach(a => s.add(a)));
    const order = { inputs: 0, transient: 1, bronze: 2, silver: 3, gold: 4, snapshot: 5 };
    return [...s].sort((a, b) => order[laneOf(a)] - order[laneOf(b)] || LAYOUT_LANES.pos[a].x - LAYOUT_LANES.pos[b].x); }, [tid]);
  const since = failingSince(tid); const checks = sameColumnChecks(tid);
  const inc = INCIDENTS.find(i => i.testId === tid);
  const root = rootCauseOf(tid); const rootLinked = root && models.some(m => ancestors(m, false).has(root.id));
  return <aside className="panel rpanel" role="region" aria-label="Root-cause path">
    <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
      <div style={{ flex: 1 }}><div className="muted" style={{ fontSize: 12 }}>Root-cause path</div><h4>{testLabel(t)} on {models.map(m => BY_ID[m].name).join(', ')}</h4></div>

    </div>
    <p className="note" style={{ color: 'var(--ink-2)' }}>{since != null ? <>Failing in the last {LAST - since + 1} runs, since {fmtDT(ts(RUNS[since].started_at))}, with {TRES[tid][LAST].failures} bad rows each time.</> : 'Passing in the latest run.'}</p>
    {root && BY_ID[root.id] && <div className="reason" style={{ background: 'var(--failed-soft)', margin: '8px 0 0' }}><span className="dot" style={{ background: 'var(--failed)' }} />
      <div><div>Named root cause: <button className="linkish" onClick={() => onFocus(root.id)}>{BY_ID[root.id].name}</button>{root.kind ? `, ${RC_KIND[root.kind] || root.kind}` : ''}</div>
        <div className="muted" style={{ fontSize: 12 }}>{root.kind === 'schema_change' ? DATA.schema_changes.filter(c => c.relation === BY_ID[root.id].name).map(c => `${c.column} ${c.change.replace('_', ' ')} on ${fmtDT(ts(c.detected_at))}`).join('; ') + '. ' : ''}
          {SRC_LAG[root.id] != null ? `${fmtMin(SRC_LAG[root.id])} behind the source system${SRC_MAX[root.id] != null ? `, limit ${fmtMin(SRC_MAX[root.id])}` : ''}. ` : ''}
          {rootLinked ? 'The red path on the graph runs from it to the failing test along real lineage edges.' : 'The lineage has no edge from it to the models, so the link drawn on the graph comes from the root cause icecore recorded.'}</div></div></div>}
    <ol className="steps">

        const isRoot = root && root.id === u; const before = rootLinked && !isRoot && !descendants(root.id, false).has(u);
        return <li key={u} style={{ opacity: before ? 0.55 : 1 }}><i style={{ background: isRoot ? 'var(--ink)' : col }} /><button onClick={() => onFocus(u)}>{BY_ID[u].name}</button>{isRoot && <span className="engine" style={{ marginLeft: 6, color: 'var(--failed)', borderColor: 'var(--failed)' }}>root cause</span>}
          <div className="muted" style={{ fontSize: 12 }}>{LAYER_LABEL[BY_ID[u].layer]}, {e ? `built ${e.status === 'error' ? 'with an error' : 'fine'} in ${fmtS(e.execution_time_s)}` : SRC_LAG[u] != null ? `${fmtMin(SRC_LAG[u])} behind` : 'not built'}, {nt ? `${nt - nf} of ${nt} tests pass` : 'no tests'}</div></li>; })}
    </ol>
    <div style={{ fontSize: 12.5 }}>
      <b>Same column ({t.column}) checked elsewhere</b>
      {checks.filter(c => c.where !== 'same model').length ? <ul style={{ margin: '4px 0 0', paddingLeft: 18 }}>
        {checks.filter(c => c.where !== 'same model').map(c => <li key={c.test + c.model}>{c.where}: <button className="linkish" onClick={() => onFocus(c.model)}>{BY_ID[c.model].name}</button>, {testLabel(BY_ID[c.test])} {c.bad ? 'fails too' : 'passes'}</li>)}
      </ul> : null}
      <p className="note">{checks.some(c => c.where === 'upstream') ? '' : `No upstream model tests ${t.column}. A not-null test on the first bronze model would show where the bad rows enter.`}</p>
    </div>
    <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
      {inc && <button className="btn sm" onClick={() => openSheet('incidents')}>Open incident</button>}
      <button className="btn sm" onClick={() => onFocus(tid, { tab: 'overview' })}>Test history</button>
      <button className="btn sm" onClick={onClose}>Back to {models.map(m => BY_ID[m].name).join(', ')}</button>
    </div>
  </aside>;
}

/* ============================== node panel ============================== */

    </div>

    <div className="pb">
      {tab === 'overview' && <>
        <div className="sec">
          {NODE[uid].reasons.length ? NODE[uid].reasons.map((r, i) => <div key={i} className="reason" style={{ background: statusSoft(P, r.sev) }}>
            <span className="dot" style={{ background: statusColor(P, r.sev) }} /><div style={{ flex: 1 }}>{r.text}{r.isRoot && <> <button className="linkish" onClick={() => onTrace(r.testId)}>Trace the path</button></>}
              {r.incident && <div className="muted" style={{ fontSize: 12 }}>Incident {r.incident}{acks[r.incident] || (INCIDENTS.find(i => i.incident_key === r.incident) || {}).acknowledged_by ? `, acknowledged by ${acks[r.incident] || INCIDENTS.find(i => i.incident_key === r.incident).acknowledged_by}` : ', not acknowledged'} <button className="linkish" onClick={() => openSheet('incidents')}>open</button></div>}</div></div>)
            : <div className="ink2">{st === 'notrun' ? 'Sources are not built by dbt; icecore watches their freshness and tests.' : 'Healthy in the latest run.'}</div>}
        </div>
        {n.type !== 'source' && <div className="sec"><h3>Last {NR} runs</h3>
          <RunStrip label="Build and test result per run, oldest first" cells={RUNS.map((r, i) => { const e = EXEC[uid][i]; const tf = TESTS_OF[uid].filter(t => isBad(TRES[t][i])).length;
            return { s: !e ? 'none' : e.status === 'error' ? 'fail' : tf ? 'fail' : 'ok', t: `${fmtDT(ts(r.started_at))}: ${!e ? 'not built' : e.status === 'error' ? 'build failed' : 'built'}${tf ? `, ${tf} test failing` : ''}` }; })} />
          <div className="note">Oldest on the left. Red: build error or a failing test.</div></div>}
        {n.type !== 'source' && <div className="sec"><EChart height={170} option={{
          animation: false, title: cTitle(P, 'Build time per run'), grid: { left: 44, right: 8, top: 34, bottom: 36 }, tooltip: { ...cTip(P), trigger: 'axis', valueFormatter: v => v == null ? '—' : v + ' s' },

            <dt>Feeds</dt><dd><div className="nb">{kids.length ? kids.map(p => <button key={p} className="chip" onClick={() => onFocus(p)}><span className="dot" style={{ background: statusColor(P, NODE[p].status) }} />{BY_ID[p].name}</button>) : <span className="muted">nothing</span>}</div></dd>

      {tab === 'cost' && (COST[uid].has ? <>

        <EChart height={210} option={{ animation: false, title: cTitle(P, 'Credits per run'), grid: { left: 54, right: 8, top: 34, bottom: 36 }, tooltip: { ...cTip(P), trigger: 'axis', valueFormatter: v => v == null ? 'pending' : v + ' cr' },
          xAxis: cAxis(P, 'Run start', { type: 'category', data: RUNS.map(r => fmtDay(ts(r.started_at))), splitLine: { show: false }, nameGap: 24, axisLabel: { color: P.ink3, fontSize: 10, interval: 5 } }),
          yAxis: cAxis(P, 'Credits', { type: 'value', nameGap: 42 }),
          series: [{ type: 'bar', data: COST[uid].arr.map(v => ({ value: v, itemStyle: { color: COST[uid].ratio >= 1.5 && v > (COST[uid].baseMed || 0) * 1.5 ? P.warn : P.ice } })), barWidth: '60%' }] }} />
        <p className="note">{PENDING_RUNS} latest runs have no credits yet; attribution usually lands a few hours after the run.</p></>
        : <div className="empty">{n.type === 'source' ? 'Sources use no warehouse compute in dbt runs.' : 'No credits recorded.'}</div>)}
    </div>
  </aside>;
}

      <span className="dot" style={{ background: bad ? 'var(--failed)' : 'var(--ok)' }} />
      <div className="tn"><div style={{ fontWeight: bad ? 600 : 500 }}><button className="linkish" style={{ color: 'inherit' }} onClick={() => onFocus(t)}>{testLabel(BY_ID[t])}</button></div><div className="muted" style={{ fontSize: 12 }}>{bad ? `${TRES[t][LAST].failures} bad rows, failing since ${fmtDT(ts(RUNS[failingSince(t)].started_at))}` : 'passing'}</div></div>
      <RunStrip label="Result per run" cells={TRES[t].map((r, i) => ({ s: !r ? 'none' : isBad(r) ? 'fail' : 'ok', t: `${fmtDT(ts(RUNS[i].started_at))}: ${!r ? 'not run' : r.status}${r && r.failures ? `, ${r.failures} rows` : ''}` }))} />

function TestPanel({ uid, onFocus, onTrace, onClose }) {
  const { P } = useContext(ThemeCtx);

    <div className="ph">
      <div className="kind">test, {testType(t)}<span className="spacer" /><button className="iconbtn" aria-label="Close panel" onClick={onClose}><Icon n="x" /></button></div>

      <span className="status-chip" style={{ background: statusSoft(P, bad ? 'failed' : 'ok'), color: statusColor(P, bad ? 'failed' : 'ok') }}><span className="dot" style={{ background: statusColor(P, bad ? 'failed' : 'ok') }} />{bad ? 'Failing' : 'Passing'}</span>
      <div className="acts">{models.map(m => <button key={m} className="btn" onClick={() => onFocus(m)}>Open {BY_ID[m].name}</button>)}{bad && <button className="btn danger" onClick={() => onTrace(uid)}><Icon n="route" s={14} />Trace root cause</button>}</div>

        xAxis: cAxis(P, 'Run start', { type: 'category', data: RUNS.map(r => fmtDay(ts(r.started_at))), splitLine: { show: false }, nameGap: 24, axisLabel: { color: P.ink3, fontSize: 10, interval: 5 } }),
        yAxis: cAxis(P, 'Rows', { type: 'value', minInterval: 1, nameGap: 30 }),
        series: [{ type: 'bar', data: TRES[uid].map(r => ({ value: r ? r.failures : 0, itemStyle: { color: r && isBad(r) ? P.failed : P.ok } })), barWidth: '60%' }] }} /></div>
      <div className="sec"><h3>Details</h3><dl className="kv"><dt>Unique id</dt><dd className="mono">{uid}</dd><dt>Column</dt><dd>{t.column || '—'}</dd><dt>Tests</dt><dd>{models.length ? models.map(m => BY_ID[m].name).join(', ') : 'the whole project'}</dd>

/* ============================== sheets ============================== */

      <button className="iconbtn" aria-label={big ? 'Shrink sheet' : 'Expand sheet'} onClick={() => setBig(!big)}><Icon n={big ? 'down' : 'up'} /></button>
      <button className="iconbtn" aria-label="Close sheet" onClick={onClose}><Icon n="x" /></button></div>
    <div className="sheet-b">{children}</div>

}
function NodeLink({ uid, onFocus, missing }) {
  if (!uid) return <span className="muted" title="This relation is not part of the project lineage">{missing} (not in lineage)</span>;
  return <button className="linkish" onClick={e => { e.stopPropagation(); onFocus(uid); }}>{BY_ID[uid].name}</button>;
}
function SevMark({ s }) { const { P } = useContext(ThemeCtx); const c = s === 'error' ? P.failed : P.warn; return <span className="sev" style={{ color: c }}><span className="dot" style={{ background: c }} />{s === 'error' ? 'Error' : 'Warning'}</span>; }

function IncidentsSheet({ acks, ack, onFocus, onTrace }) {
  const [sev, setSev] = useState('all'); const [kind, setKind] = useState('all');

    .sort((a, b) => (a.severity === 'error' ? 0 : 1) - (b.severity === 'error' ? 0 : 1) || b.first_detected_at.localeCompare(a.first_detected_at));
  const who = i => acks[i.incident_key] || i.acknowledged_by;
  const groups = [['Open', list.filter(i => !who(i))], ['Acknowledged', list.filter(i => who(i))]];
  return <>
    <div className="bar-filters">
      <div className="chips">{[['all', 'All severities'], ['error', 'Errors'], ['warn', 'Warnings']].map(([k, l]) => <button key={k} className="chip" aria-pressed={sev === k} onClick={() => setSev(k)}>{l}</button>)}</div>
      <div className="vsep" />
      <div className="chips">{[['all', 'All kinds'], ...Object.entries(KIND)].map(([k, l]) => <button key={k} className="chip" aria-pressed={kind === k} onClick={() => setKind(k)}>{l}</button>)}</div>
    </div>
    {groups.map(([g, rows]) => <div key={g} style={{ marginBottom: 18 }}>
      <div className="grp"><h3>{g}</h3><span className="muted">{rows.length}: {plural(rows.filter(r => r.severity === 'error').length, 'error')}, {plural(rows.filter(r => r.severity !== 'error').length, 'warning')}</span></div>
      {rows.length ? <table className="tbl"><thead><tr><th>Severity</th><th>Kind</th><th>What happened</th><th>Node</th><th>First seen</th><th className="num">Times seen</th><th>Channel</th><th>Root cause</th><th>{g === 'Open' ? '' : 'By'}</th></tr></thead>
        <tbody>{rows.map(i => <tr key={i.incident_key} className="click" onClick={() => i.nodeId && onFocus(i.nodeId)}>
          <td><SevMark s={i.severity} /></td><td>{KIND[i.kind] || i.kind}</td><td style={{ fontWeight: 500 }}>{i.title}</td>
          <td><NodeLink uid={i.nodeId} missing={i.missing} onFocus={onFocus} /></td><td>{fmtDT(ts(i.first_detected_at))}</td><td className="num">{i.occurrences}</td><td>{i.channel}</td>
          <td>{i.root_cause ? <span>{BY_ID[i.root_cause] ? <NodeLink uid={GRAPH_SET.has(i.root_cause) ? i.root_cause : null} missing={i.root_cause} onFocus={onFocus} /> : i.root_cause}{i.root_cause_kind ? <span className="muted">, {RC_KIND[i.root_cause_kind] || i.root_cause_kind}</span> : null}
            {i.testId && isBad(TRES[i.testId][LAST]) && <div><button className="btn sm" style={{ marginTop: 4 }} onClick={e => { e.stopPropagation(); onTrace(i.testId); }}><Icon n="route" s={13} />Trace on graph</button></div>}</span> : (i.testId && isBad(TRES[i.testId][LAST]) ? <button className="btn sm" onClick={e => { e.stopPropagation(); onTrace(i.testId); }}><Icon n="route" s={13} />Trace on graph</button> : <span className="muted">Not set</span>)}</td>
          <td>{who(i) ? <span className="ink2">{who(i)}</span> : <button className="btn sm primary" onClick={e => { e.stopPropagation(); ack(i.incident_key); }}>Acknowledge</button>}</td>
        </tr>)}</tbody></table> : <div className="empty">{g === 'Open' ? 'Nothing open with these filters.' : 'Nobody has acknowledged an incident with these filters yet.'}</div>}
    </div>)}
    <p className="note">Acknowledging here is kept in this browser session only. Resolved incidents are not part of this report.</p>
  </>;
}

function TestsSheet({ onFocus, onTrace }) {

    if (q && !(t.name + ' ' + testLabel(t)).toLowerCase().includes(q.toLowerCase())) return false; return true; })
    .sort((a, b) => isBad(TRES[b.unique_id][LAST]) - isBad(TRES[a.unique_id][LAST]) || a.name.localeCompare(b.name));

    xAxis: cAxis(P, 'Run start', { type: 'category', data: RUNS.map(r => fmtDT(ts(r.started_at))), splitLine: { show: false }, nameGap: 26, axisLabel: { color: P.ink3, fontSize: 10, interval: 3, formatter: v => v.split(',')[0] } }),

  const nFail = LATEST_FAILING.length;

  const metricGroups = Object.values(METRICS).sort((a, b) => metricAnomalous(b) - metricAnomalous(a) || Object.keys(b.engines).length - Object.keys(a.engines).length || a.relation.localeCompare(b.relation));

    {sub === 'tests' ? <>
      <EChart height={170} option={opt} />
      <div className="bar-filters" style={{ marginTop: 8 }}>
        <div className="chips">{[['failing', `Failing ${nFail}`], ['passing', `Passing ${TESTS.length - nFail}`], ['all', `All ${TESTS.length}`]].map(([k, l]) => <button key={k} className="chip" aria-pressed={f === k} onClick={() => setF(k)}>{l}</button>)}</div>
        <select className="input" value={ty} onChange={e => setTy(e.target.value)} aria-label="Test type"><option value="all">All test types</option>{types.map(t => <option key={t}>{t}</option>)}</select>
        <input className="input" placeholder="Filter by name" value={q} onChange={e => setQ(e.target.value)} aria-label="Filter tests by name" />
        <span className="muted">{rows.length} shown</span>
      </div>
      <table className="tbl"><thead><tr><th>Status</th><th>Test</th><th>Model</th><th>Last {NR} runs</th><th className="num">Bad rows</th><th>Failing since</th><th></th></tr></thead>
        <tbody>{rows.slice(0, 250).map(t => { const id = t.unique_id; const r = TRES[id][LAST]; const bad = isBad(r); const ms = testTargets(t);
          return <Fragment key={id}><tr className={'click' + (open === id ? ' on' : '')} onClick={() => setOpen(open === id ? null : id)}>
            <td><span className="sev" style={{ color: bad ? P.failed : P.ok }}><span className="dot" style={{ background: bad ? P.failed : P.ok }} />{bad ? 'Failing' : 'Passing'}</span></td>
            <td style={{ fontWeight: bad ? 600 : 400 }}>{testLabel(t)}</td>
            <td>{ms.length ? ms.map((m, k) => <Fragment key={m}>{k ? ', ' : ''}<NodeLink uid={m} onFocus={onFocus} /></Fragment>) : <span className="muted">Project check</span>}</td>
            <td><RunStrip label="Result per run" cells={TRES[id].map((x, i) => ({ s: !x ? 'none' : isBad(x) ? 'fail' : 'ok', t: `${fmtDT(ts(RUNS[i].started_at))}: ${x ? x.status : 'not run'}` }))} /></td>
            <td className="num">{r ? r.failures : '—'}</td><td>{bad ? fmtDT(ts(RUNS[failingSince(id)].started_at)) : <span className="muted">—</span>}</td>
            <td>{bad && <button className="btn sm danger" onClick={e => { e.stopPropagation(); onTrace(id); }}>Trace</button>}</td></tr>
            {open === id && <tr><td colSpan="7" style={{ background: 'var(--surface-2)' }}>
              <div className="cols two" style={{ alignItems: 'start' }}>
                <div><dl className="kv"><dt>Unique id</dt><dd className="mono">{id}</dd><dt>Type</dt><dd>{testType(t)}</dd><dt>Column</dt><dd>{t.column || '—'}</dd><dt>Failed</dt><dd>{TRES[id].filter(isBad).length} of {NR} runs</dd>
                  <dt>Incident</dt><dd>{(INCIDENTS.find(i => i.testId === id) || {}).title || 'none'}</dd>
                  <dt>Root cause</dt><dd>{rootCauseOf(id) ? <><NodeLink uid={rootCauseOf(id).id} onFocus={onFocus} />{rootCauseOf(id).kind ? `, ${RC_KIND[rootCauseOf(id).kind] || rootCauseOf(id).kind}` : ''}</> : 'not recorded'}</dd></dl></div>
                <EChart height={150} option={{ animation: false, title: cTitle(P, 'Bad rows per run'), grid: { left: 40, right: 8, top: 30, bottom: 30 }, tooltip: { ...cTip(P), trigger: 'axis', valueFormatter: v => v + ' rows' },
                  xAxis: cAxis(P, 'Run', { type: 'category', data: RUNS.map(r => fmtDay(ts(r.started_at))), splitLine: { show: false }, nameGap: 18, axisLabel: { show: false } }), yAxis: cAxis(P, 'Rows', { type: 'value', minInterval: 1, nameGap: 26 }),
                  series: [{ type: 'bar', data: TRES[id].map(x => ({ value: x ? x.failures : 0, itemStyle: { color: x && isBad(x) ? P.failed : P.ok } })) }] }} />
              </div></td></tr>}
          </Fragment>; })}</tbody></table>
      {!rows.length && <div className="empty" style={{ marginTop: 10 }}>No test matches these filters. Clear the name filter or pick “All”.</div>}
    </> : <>
      <div className="box" style={{ marginBottom: 14, display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'center' }}>
        <div><b>Scoring engines.</b> <span className="ink2">Native scores all {metricGroups.length} monitored metrics. Cortex is {DATA.capabilities.cortex ? 'available' : 'not available'} in this account{dual.length ? ` and scores ${dual.length} of them in shadow, shown side by side below` : ' but has not scored any metric yet'}. {metricGroups.filter(metricAnomalous).length} metrics are anomalous at their latest point.</span></div>
      </div>
      {anomalyInc.length > 0 && <div className="box" style={{ marginBottom: 14, borderColor: 'var(--warn)' }}>
        <b>Open anomaly incidents</b>
        {anomalyInc.map(i => <div key={i.incident_key} style={{ marginTop: 4 }}><SevMark s={i.severity} /> {i.title}, first seen {fmtDT(ts(i.first_detected_at))}. <NodeLink uid={i.nodeId} missing={i.missing} onFocus={onFocus} />
          {i.nodeId && !metricsOf(i.nodeId).length && <span className="muted"> (its metric points are not in this report)</span>}</div>)}
      </div>}
      {metricGroups.filter(g => Object.keys(g.engines).length > 1).map(g => <MetricBlock key={g.key} g={g} onFocus={onFocus} showName />)}
      <div className="cols two">{metricGroups.filter(g => Object.keys(g.engines).length === 1).map(g => <MetricBlock key={g.key} g={g} onFocus={onFocus} showName narrow />)}</div>
    </>}
  </>;
}

function RunsSheet({ onFocus }) {
  const { P } = useContext(ThemeCtx);
  const [sel, setSel] = useState(LAST);
  const run = RUNS[sel];
  const execs = useMemo(() => GRAPH.map(n => EXEC[n.unique_id][sel]).filter(Boolean).sort((a, b) => ts(a.started_at) - ts(b.started_at)), [sel]);
  const t0 = ts(run.started_at);
  const trend = useMemo(() => ({ animation: false, title: cTitle(P, 'Run duration and credits'), legend: { top: 0, right: 0, textStyle: { color: P.ink2, fontFamily: FONT } },
    grid: { left: 50, right: 60, top: 40, bottom: 40 }, tooltip: { ...cTip(P), trigger: 'axis' },
    xAxis: cAxis(P, 'Run start', { type: 'category', data: RUNS.map(r => fmtDT(ts(r.started_at))), splitLine: { show: false }, nameGap: 26, axisLabel: { color: P.ink3, fontSize: 10, interval: 3, formatter: v => v.split(',')[0] } }),
    yAxis: [cAxis(P, 'Duration (s)', { type: 'value', scale: true, nameGap: 36 }), cAxis(P, 'Credits', { type: 'value', nameGap: 44, splitLine: { show: false } })],
    series: [
      { name: 'Credits', type: 'bar', yAxisIndex: 1, data: RUNS.map(r => r.credits), itemStyle: { color: P.iceSoft === '#173247' ? '#24506F' : '#C9DFEF' }, barWidth: '55%' },
      { name: 'Duration', type: 'line', data: RUNS.map((r, i) => ({ value: r.duration_s, symbolSize: i === sel ? 11 : 6, itemStyle: { color: r.status === 'success' ? P.ok : P.failed } })), lineStyle: { color: P.ink3, width: 1.5 }, symbol: 'circle', tooltip: { valueFormatter: v => v + ' s' } },
    ] }), [P, sel]);
  const gantt = useMemo(() => {
    const cats = execs.map(e => BY_ID[e.unique_id].name);
    return { animation: false, title: cTitle(P, `Node timeline, run of ${fmtDT(t0)}`), grid: { left: 190, right: 16, top: 34, bottom: 40 },
      tooltip: { ...cTip(P), formatter: p => { const e = execs[p.value[0]]; return `<b>${esc(BY_ID[e.unique_id].name)}</b><br>Started ${esc(p.value[1].toFixed(1))} s after the run<br>Took ${esc(fmtS(e.execution_time_s))}<br>${esc(e.status === 'error' ? 'Failed' : 'Built')}, ${esc(fmtCr(e.credits))}`; } },
      xAxis: cAxis(P, 'Seconds since the run started', { type: 'value', min: 0, nameGap: 26 }),
      yAxis: cAxis(P, '', { type: 'category', data: cats, inverse: true, splitLine: { show: false }, axisLabel: { color: P.ink2, fontSize: 11, fontFamily: FONT } }),
      series: [{ type: 'custom', encode: { x: [1, 2], y: 0 }, data: execs.map((e, i) => { const s = (ts(e.started_at) - t0) / 1000; return { value: [i, s, s + e.execution_time_s], itemStyle: { color: e.status === 'error' ? P.failed : P.lane[laneOf(e.unique_id)] } }; }),
        renderItem: (params, api) => { const y = api.value(0); const a = api.coord([api.value(1), y]), b = api.coord([api.value(2), y]); const h = api.size([0, 1])[1] * 0.64;
          return { type: 'rect', shape: { x: a[0], y: a[1] - h / 2, width: Math.max(2, b[0] - a[0]), height: h, r: 2 }, style: api.style() }; } }] };
  }, [P, sel, execs]);
  const slow = [...execs].sort((a, b) => b.execution_time_s - a.execution_time_s).slice(0, 6);
  const testsFailing = FAILS_PER_RUN[sel];
  return <>
    <div className="box" style={{ marginBottom: 14 }}><EChart height={190} option={trend} onClick={p => p.dataIndex != null && setSel(p.dataIndex)} />
      <p className="note">Dots: red for a failed run. Click a run to see its timeline. Credits for the {PENDING_RUNS} latest runs are not attributed yet.</p></div>
    <div className="cols side">
      <div style={{ maxHeight: 560, overflow: 'auto' }}>
        <table className="tbl"><thead><tr><th>Started</th><th>Result</th><th className="num">Took</th><th className="num">Credits</th></tr></thead>
          <tbody>{RUNS.map((r, i) => i).reverse().map(i => { const r = RUNS[i]; return <tr key={r.invocation_id} className={'click' + (i === sel ? ' on' : '')} onClick={() => setSel(i)}>
            <td>{fmtDT(ts(r.started_at))}</td><td><span className="sev" style={{ color: r.status === 'success' ? P.ok : P.failed }}><span className="dot" style={{ background: r.status === 'success' ? P.ok : P.failed }} />{r.status === 'success' ? 'Passed' : `Failed (${r.nodes_failed})`}</span></td>
            <td className="num">{fmtS(r.duration_s)}</td><td className="num">{r.credits == null ? <span className="muted">pending</span> : r.credits.toFixed(3)}</td></tr>; })}</tbody></table>
      </div>
      <div className="box">
        <div style={{ display: 'flex', gap: 18, flexWrap: 'wrap', marginBottom: 8, fontSize: 13 }}>
          <span><b>{run.command}</b> on {run.target}</span><span className="ink2">{fmtS(run.duration_s)}</span><span className="ink2">{fmtCr(run.credits)}</span>
          <span className="ink2">{execs.length} models built, {execs.filter(e => e.status === 'error').length} failed, {plural(testsFailing, 'test')} failing</span><span className="mono muted">{run.invocation_id}</span></div>
        <EChart height={Math.max(260, execs.length * 17 + 80)} option={gantt} onClick={p => p.value && onFocus(execs[p.value[0]].unique_id)} />
        <h3 style={{ fontSize: 13.5, margin: '10px 0 4px' }}>Slowest nodes in this run</h3>
        <table className="tbl"><tbody>{slow.map(e => { const med = median(EXEC[e.unique_id].filter(Boolean).map(x => x.execution_time_s)); return <tr key={e.unique_id}>
          <td><NodeLink uid={e.unique_id} onFocus={onFocus} /></td><td className="num">{fmtS(e.execution_time_s)}</td><td className="num muted">usual {fmtS(med)}</td>
          <td className="num" style={{ color: e.execution_time_s > med * 1.5 ? P.warn : P.ink3, fontWeight: 600 }}>{(e.execution_time_s / med).toFixed(1)}×</td></tr>; })}</tbody></table>
      </div>
    </div>
  </>;
}

function CostSheet({ onFocus }) {
  const { P } = useContext(ThemeCtx);
  const days = useMemo(() => { const m = {}; RUNS.forEach(r => { const k = r.started_at.slice(0, 10); m[k] = m[k] || { cr: 0, pending: 0 }; if (r.credits == null) m[k].pending++; else m[k].cr += r.credits; }); return Object.entries(m); }, []);
  const opt = useMemo(() => ({ animation: false, title: cTitle(P, `Credits per day, last ${days.length} days (all stored history)`), grid: { left: 52, right: 12, top: 36, bottom: 40 },
    tooltip: { ...cTip(P), trigger: 'axis', formatter: ps => { const d = days[ps[0].dataIndex]; return `<b>${esc(fmtDay(ts(d[0] + 'T00:00:00')))}</b><br>${esc(d[1].cr.toFixed(3))} credits${d[1].pending ? `<br>${esc(d[1].pending)} run not attributed yet` : ''}`; } },
    xAxis: cAxis(P, 'Day', { type: 'category', data: days.map(d => fmtDay(ts(d[0] + 'T00:00:00'))), splitLine: { show: false }, nameGap: 26 }),
    yAxis: cAxis(P, 'Credits', { type: 'value', nameGap: 40 }),
    series: [{ type: 'bar', barWidth: '58%', data: days.map(d => ({ value: +d[1].cr.toFixed(4), itemStyle: { color: d[1].pending ? P.lineStrong : P.ice } })),
      label: { show: true, position: 'top', color: P.ink3, fontSize: 10, formatter: p => days[p.dataIndex][1].pending ? 'pending' : '' } }] }), [P, days]);
  const models = GRAPH.filter(n => COST[n.unique_id].has).map(n => n.unique_id);
  const regress = models.filter(u => COST[u].ratio >= 1.3).sort((a, b) => COST[b].ratio - COST[a].ratio);
  const all = [...models].sort((a, b) => COST[b].total - COST[a].total);
  const total = sum(models.map(u => COST[u].total));
  return <>
    <div className="cols two">
      <div className="box"><EChart height={230} option={opt} /><p className="note">Grey days include a run whose credits are not attributed yet.</p></div>
      <div className="box"><h3 style={{ margin: '0 0 6px', fontSize: 13.5 }}>Top regressions</h3>
        <p className="note" style={{ marginTop: 0 }}>Average of the last 4 attributed runs against the earlier median, 1.3× or more.</p>
        {regress.length ? <table className="tbl"><thead><tr><th>Model</th><th className="num">Before</th><th className="num">Now</th><th className="num">Change</th><th>Credits per run</th></tr></thead>
          <tbody>{regress.map(u => <tr key={u} className="click" onClick={() => onFocus(u, { tab: 'cost' })}><td><NodeLink uid={u} onFocus={onFocus} /></td><td className="num">{COST[u].baseMed.toFixed(4)}</td><td className="num">{COST[u].recentAvg.toFixed(4)}</td>
            <td className="num" style={{ color: P.warn, fontWeight: 700 }}>{COST[u].ratio.toFixed(1)}×</td><td><Spark values={COST[u].arr} color={P.warn} label={`Credits per run for ${BY_ID[u].name}`} /></td></tr>)}</tbody></table>
          : <div className="empty">No model costs noticeably more than before.</div>}
        {INCIDENTS.filter(i => i.kind === 'cost').map(i => <p key={i.incident_key} className="note">Incident {i.incident_key}: {i.title}.</p>)}
      </div>
    </div>
    <h3 style={{ fontSize: 14, margin: '18px 0 6px' }}>Credits per model, all {NR} runs ({total.toFixed(3)} credits)</h3>
    <table className="tbl"><thead><tr><th>Model</th><th>Layer</th><th className="num">Credits</th><th className="num">Share</th><th className="num">Usual build time</th><th className="num">Change</th><th>Credits per run</th></tr></thead>
      <tbody>{all.map(u => <tr key={u} className="click" onClick={() => onFocus(u, { tab: 'cost' })}><td><NodeLink uid={u} onFocus={onFocus} /></td><td className="ink2">{LAYER_LABEL[BY_ID[u].layer]}</td>
        <td className="num">{COST[u].total.toFixed(4)}</td><td className="num">{(COST[u].total / total * 100).toFixed(1)}%</td><td className="num">{fmtS(median(EXEC[u].filter(Boolean).map(e => e.execution_time_s)))}</td>
        <td className="num" style={{ color: COST[u].ratio >= 1.3 ? P.warn : P.ink3, fontWeight: COST[u].ratio >= 1.3 ? 700 : 400 }}>{COST[u].ratio ? COST[u].ratio.toFixed(2) + '×' : '—'}</td>
        <td><Spark values={COST[u].arr} label={`Credits per run for ${BY_ID[u].name}`} /></td></tr>)}</tbody></table>
  </>;
}

function SchedulesSheet({ onFocus }) {
  const { P } = useContext(ThemeCtx);
  const slas = Object.values(SLA).sort((a, b) => (b.missed - a.missed) || a.deadline - b.deadline);
  const silences = INCIDENTS.filter(i => i.kind === 'silence');
  const fresh = [...DATA.source_freshness].sort((a, b) => b.freshness_lag_min - a.freshness_lag_min);
  const slaOpt = useMemo(() => ({ animation: false, title: cTitle(P, 'Time since last success against the allowed window'), grid: { left: 160, right: 20, top: 36, bottom: 40 },
    tooltip: { ...cTip(P), trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => v + ' h' },
    xAxis: cAxis(P, 'Hours', { type: 'value', nameGap: 26 }), yAxis: cAxis(P, '', { type: 'category', data: slas.map(s => s.name), inverse: true, splitLine: { show: false }, axisLabel: { color: P.ink2, fontSize: 11 } }),
    series: [{ type: 'bar', barWidth: '50%', data: slas.map(s => ({ value: +(s.ageMin / 60).toFixed(1), itemStyle: { color: s.missed ? P.failed : s.state === 'soon' ? P.warn : P.ok } })),
      markLine: { symbol: 'none', label: { formatter: 'allowed 12 h 30 min', color: P.ink3, fontSize: 10.5 }, lineStyle: { color: P.ink3, type: 'dashed' }, data: [{ xAxis: (slas[0] ? (slas[0].every + slas[0].grace) / 60 : 12.5) }] } }] }), [P]);
  const fOpt = useMemo(() => ({ animation: false, title: cTitle(P, 'Source freshness'), grid: { left: 160, right: 70, top: 36, bottom: 40 },
    tooltip: { ...cTip(P), trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => v + ' min' },
    xAxis: cAxis(P, 'Minutes behind the source system', { type: 'value', nameGap: 26 }), yAxis: cAxis(P, '', { type: 'category', data: fresh.map(f => f.name), inverse: true, splitLine: { show: false }, axisLabel: { color: P.ink2, fontSize: 11 } }),
    series: [{ type: 'bar', barWidth: '50%', data: fresh.map(f => ({ value: f.freshness_lag_min, itemStyle: { color: f.max_lag_min != null && f.freshness_lag_min > f.max_lag_min ? P.failed : P.ok } })),
      label: { show: true, position: 'right', color: P.ink2, fontSize: 11, formatter: p => fmtMin(p.value) },
      markLine: fresh.some(f => f.max_lag_min != null) ? { symbol: 'none', label: { formatter: `limit ${fmtMin(fresh.find(f => f.max_lag_min != null).max_lag_min)}`, position: 'insideEndTop', color: P.ink3, fontSize: 10.5 }, lineStyle: { color: P.ink3, type: 'dashed' }, data: [{ xAxis: fresh.find(f => f.max_lag_min != null).max_lag_min }] } : undefined }] }), [P]);
  return <>
    <div className="cols two">
      <div className="box"><EChart height={240} option={slaOpt} onClick={p => onFocus(slas[p.dataIndex].unique_id)} /></div>
      <div className="box"><EChart height={240} option={fOpt} onClick={p => onFocus(fresh[p.dataIndex].unique_id)} />
        <p className="note">{fresh.filter(f => f.max_lag_min != null && f.freshness_lag_min > f.max_lag_min).length} of {fresh.length} sources are over their limit.</p></div>
    </div>
    <h3 style={{ fontSize: 14, margin: '18px 0 6px' }}>Source freshness ({fresh.length})</h3>
    <table className="tbl"><thead><tr><th>Source</th><th className="num">Behind by</th><th className="num">Limit</th><th>State</th></tr></thead>
      <tbody>{fresh.map(f => { const late = f.max_lag_min != null && f.freshness_lag_min > f.max_lag_min; return <tr key={f.unique_id} className="click" onClick={() => onFocus(f.unique_id)}><td><NodeLink uid={f.unique_id} onFocus={onFocus} /></td>
        <td className="num">{fmtMin(f.freshness_lag_min)}</td><td className="num">{f.max_lag_min != null ? fmtMin(f.max_lag_min) : '—'}</td>
        <td><span className="sev" style={{ color: late ? P.failed : P.ok }}><span className="dot" style={{ background: late ? P.failed : P.ok }} />{late ? 'Late' : 'Fresh'}</span></td></tr>; })}</tbody></table>
    <h3 style={{ fontSize: 14, margin: '18px 0 6px' }}>Declared schedules ({slas.length})</h3>
    <table className="tbl"><thead><tr><th>Model</th><th>Expected every</th><th>Grace</th><th>Last success</th><th>Due by</th><th>State</th></tr></thead>
      <tbody>{slas.map(s => <tr key={s.unique_id} className="click" onClick={() => onFocus(s.unique_id)}><td><NodeLink uid={s.unique_id} onFocus={onFocus} /></td><td>{s.expected_every}</td><td>{s.grace}</td><td>{fmtDT(s.last)}</td><td>{fmtDT(s.deadline)}</td>
        <td><span className="sev" style={{ color: s.missed ? P.failed : s.state === 'soon' ? P.warn : P.ok }}><span className="dot" style={{ background: s.missed ? P.failed : s.state === 'soon' ? P.warn : P.ok }} />{s.missed ? 'Missed schedule' : s.state === 'soon' ? `Due in ${fmtMin(s.left)}` : `On time, ${fmtMin(s.left)} left`}</span></td></tr>)}</tbody></table>
    <h3 style={{ fontSize: 14, margin: '18px 0 6px' }}>Missed runs ({silences.length})</h3>
    {silences.length ? <table className="tbl"><thead><tr><th>Model</th><th>What happened</th><th>Detected</th><th>Acknowledged by</th></tr></thead>
      <tbody>{silences.map(i => <tr key={i.incident_key}><td><NodeLink uid={i.nodeId} missing={i.missing} onFocus={onFocus} /></td><td>{i.title}</td><td>{fmtDT(ts(i.first_detected_at))}</td><td>{i.acknowledged_by || <span className="muted">nobody yet</span>}</td></tr>)}</tbody></table>
      : <div className="empty">No schedule was missed.</div>}
    <p className="note">Times are relative to the report time, {fmtDT(NOW)}. A model counts as missed when a missed-run event was raised or its window plus grace has passed.</p>
  </>;
}

function SchemaSheet({ onFocus }) {
  const { P } = useContext(ThemeCtx);
  const ch = [...DATA.schema_changes].sort((a, b) => b.detected_at.localeCompare(a.detected_at));
  const rels = [...new Set(ch.map(c => c.relation))];
  const C = { added: P.ok, removed: P.failed, type_changed: P.warn };
  const opt = useMemo(() => {
    const t0 = RUNS.length ? ts(RUNS[0].started_at) : NOW;
    return { animation: false, title: cTitle(P, 'Column changes over time'), grid: { left: 120, right: 20, top: 36, bottom: 44 },
      tooltip: { ...cTip(P), formatter: p => { const c = ch[p.dataIndex]; return `<b>${esc(c.relation)}.${esc(c.column)}</b><br>${esc(c.change.replace('_', ' '))}${esc(c.type ? ', ' + c.type : '')}${c.from ? `, ${esc(c.from)} to ${esc(c.to)}` : ''}<br>${esc(fmtDT(ts(c.detected_at)))}`; } },
      xAxis: cAxis(P, 'Date detected', { type: 'time', min: t0, max: NOW, nameGap: 28, axisLabel: { color: P.ink3, fontSize: 11, formatter: v => fmtDay(v) } }),
      yAxis: cAxis(P, 'Table', { type: 'category', data: rels, nameGap: 100, splitLine: { show: true, lineStyle: { color: P.line, type: 'dashed' } } }),
      series: [{ type: 'scatter', symbolSize: 16, data: ch.map(c => ({ value: [ts(c.detected_at), c.relation], itemStyle: { color: C[c.change] || P.ice } })),
        label: { show: true, position: 'right', color: P.ink2, fontSize: 11, formatter: p => ch[p.dataIndex].column } }] };
  }, [P]);
  return <>
    <div className="box" style={{ marginBottom: 14 }}><EChart height={Math.max(170, rels.length * 50 + 90)} option={opt} />

        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-start' }}>
          <div className="seg"><button aria-pressed={theme === 'light'} onClick={() => setTheme('light')}>Light</button><button aria-pressed={theme === 'dark'} onClick={() => setTheme('dark')}>Dark</button></div>
