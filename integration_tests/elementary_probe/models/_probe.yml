version: 2

models:
  - name: probe_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: probe_orders
    data_tests:
      - elementary.volume_anomalies    # the Elementary test
    columns:
      - name: customer_id
        data_tests:
          - not_null:                  # one null on purpose, so the report shows a warning
              config: {severity: warn}
          - relationships:
              to: ref('probe_customers')
              field: customer_id
