version: 2

# Parse-only fixtures for collect_sla_config (UC6). Ephemeral, so even a build creates nothing.
# Meta is declared both at the top level and under config, the two places dbt accepts it.
models:
  - name: sla_hourly
    meta:
      sla: {expected_every: 1h, grace: 15m}
      alerts: {channel: data-platform, severity: warn}
  - name: sla_daily_default_grace
    config:
      meta:
        sla: {expected_every: 1d}
  - name: sla_alerts_only
    meta:
      alerts: {channel: ops-oncall, severity: error}
  - name: sla_none
