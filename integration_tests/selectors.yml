selectors:
  # Used by any dbt command run without --select / --selector. Leaves out the parse-only
  # root-cause fixtures (models/root_cause, seeds/root_cause, snapshots/root_cause), the
  # spike S3 resources (models/spikes, seeds/s3_seed.csv, snapshots/s3_snapshot.sql) and the
  # UC1 hook fixtures (models/hooks), and the UC2 monitor fixtures (models/monitors), whose tests need the tables a
  # sandbox test creates under run_id names.
  - name: default
    default: true
    definition:
      union:
        - method: fqn
          value: "*"
        - exclude:
            - method: tag
              value: root_cause_fixture
            - method: tag
              value: s3_spike
            - method: tag
              value: icecore_hooks
            - method: tag
              value: icecore_fixture
