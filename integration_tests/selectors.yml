selectors:
  # Used by any dbt command run without --select / --selector. Leaves out the parse-only
  # root-cause fixtures (models/root_cause, seeds/root_cause, snapshots/root_cause) and the
  # spike S3 resources (models/spikes, seeds/s3_seed.csv, snapshots/s3_snapshot.sql).
  - name: default
    default: true
    definition:
      union:
        - method: fqn
          value: "*"
        - exclude:
            - method: tag
              value: root_cause_fixture
            - method: tag
              value: s3_spike
