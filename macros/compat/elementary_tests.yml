version: 2

macros:
  - name: elementary_test_results_view_sql
    description: "The SELECT of the compat view `elementary_test_results`: one row per test per invocation, with the 28 columns,
      the order and the types of Elementary's table of that name (Elementary dbt package 0.26.1, pinned in
      macros/compat/ELEMENTARY_VERSION). It selects only from the core view TEST_RESULTS of the obs schema, so its
      row count is the core view's. Filled: id and test_execution_id (invocation_id and test_unique_id joined by a
      dot), test_unique_id, invocation_id, detected_at and created_at (executed_at), column_name, test_type
      (anomaly_detection when the test was scored, else dbt_test), test_sub_type, test_results_description
      (message), test_name, test_short_name, severity (dbt's configured value as it is, default ERROR) and status (lower case), failures and failed_row_count, and
      other (a JSON object of the anomaly result for scored tests), model_unique_id (tested_unique_id: the model or source the test
      is attached to, NULL when ambiguous). Typed NULLs: data_issue_id,
      database_name, schema_name, table_name, owners, tags, test_results_query, test_params, test_alias,
      result_rows."
    arguments:
      - name: obs
        type: string
        description: "The quoted obs schema, as obs_schema() renders it. Default the current obs schema."
