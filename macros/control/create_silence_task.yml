version: 2

macros:
  - name: create_silence_task
    description: >
      Creates the Snowflake task `ICECORE_SILENCE` in the obs schema, the `create_tasks` step of `setup`. Its body is
      `render_silence_task_sql` over the entries of `collect_sla_config`; with no `meta.sla` nothing is created and a
      line says so. `CREATE OR REPLACE TASK` (a task has no COPY GRANTS, so a re-run resets its grants and leaves it
      suspended). The task is created suspended, so creating it never starts spending credits without consent; set
      the var `icecore.silence_task_resume` to true to resume it. Resuming, and `EXECUTE TASK`, need the EXECUTE
      TASK privilege on the account; when resuming fails the macro logs and returns the statement for an admin,
      `GRANT EXECUTE TASK ON ACCOUNT TO ROLE <role>`, and the task stays suspended. A role that cannot create the task
      gets the CREATE TASK grant printed. Vars, defaults in the package `dbt_project.yml`: `silence_task_schedule`
      (5 MINUTE), `silence_task_warehouse` (default the target's warehouse), `silence_task_resume` (false). Returns
      `{task, status, resumed, printed}` where status is ok, skipped or the error of the create.
    arguments:
      - name: schema
        type: string
        description: The obs schema to create the task in. Default the `obs_schema` var.
      - name: entries
        type: list[dict]
        description: The SLA entries. Default `collect_sla_config()`.
      - name: source
        type: string
        description: The relation read as `node_executions`. Default the obs schema's `NODE_EXECUTIONS` view.
      - name: warehouse
        type: string
        description: The task's warehouse. Default the `silence_task_warehouse` var, else the target's warehouse.
      - name: schedule
        type: string
        description: The task's SCHEDULE. Default the `silence_task_schedule` var.
      - name: resume
        type: boolean
        description: Resume the task after creating it. Default the `silence_task_resume` var (false).
