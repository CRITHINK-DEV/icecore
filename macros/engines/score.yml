version: 2

macros:
  - name: score
    description: >
      Anomaly engine dispatcher (spec section 6). Scores the current value of one metric series and
      returns a dict with the same fields whatever engine scored: `engine` (native or cortex),
      `expected`, `lower`, `upper` (acceptance band), `score` (signed distance outside the band,
      0 inside), `is_anomaly` (boolean, after the min_consecutive rule) and `fallback_reason`
      (null, or why the requested engine did not score: `cortex_unavailable`, `history_too_short`, `model_missing`, `model_stale`, `cortex_error`), plus `fallback_detail` (the message behind it) when native scored for a model reason.
      Selection: `native` never calls Cortex; `cortex` falls back to native when Cortex is unavailable
      (`icecore.detect_capabilities`, read without recording), the series covers fewer than 14 days, no
      `model` is given or it does not exist (`model_missing`), it is older than `var('icecore').cortex_refresh_days`
      (default 7, the refresh task's period: `model_stale`), or any Cortex call fails (`cortex_error`: a
      privilege or region problem never fails a test); `auto` uses Cortex under the same conditions, else
      native. A fallback is logged and recorded in `fallback_reason`. Computes and returns values only;
      emitting them is `emit_metric`'s job. At parse time (execute false) settings are validated and the same
      keys are returned with null values, so a model or test calling score always parses.
    arguments:
      - name: series_sql
        type: string
        description: A SELECT returning the history as columns `observed_at` (timestamp) and `value` (number).
      - name: model
        type: string
        description: The table's Cortex model as a (qualified) identifier. Default none, which means `model_missing` when Cortex was to score.
      - name: series
        type: string
        description: The series key the model was trained with. Required with `model`.
      - name: current_value
        type: number
        description: The value observed in this run. Null scores 0 and is never an anomaly.
      - name: engine
        type: string
        description: "`native`, `cortex` or `auto`. Default: `var('icecore').anomaly_engine` (auto)."
      - name: sensitivity
        type: string
        description: "`low`, `medium` or `high`. Default: `var('icecore').anomaly_sensitivity` (medium)."
      - name: min_consecutive
        type: integer
        description: "Integer of at least 1: consecutive out-of-band observations needed before is_anomaly is true. Default: `var('icecore').anomaly_min_consecutive` (1)."
      - name: observed_at
        type: string
        description: "UTC timestamp of the current observation (`YYYY-MM-DD HH:MI:SS`), used by seasonal baselines. Default: the current UTC time."

  - name: native__score
    description: >
      Native engine: pure SQL, always available, one query over the history. Baseline: seasonal
      when the series spans more than four weeks and the current observation's (day-of-week,
      hour-of-day) bucket holds at least 4 points, the band then being computed within that bucket;
      flat (whole series) otherwise. Band: median ± k × MAD with k = 4 (low), 3 (medium) or 2 (high),
      raw MAD floored at greatest(`anomaly_mad_floor_pct` × |median|, `anomaly_mad_floor_abs`)
      (defaults 0.01 and 0), so a constant series of 1000 accepts 970 to 1030 at medium. A median of
      exactly 0 keeps a zero floor by default: a null rate moving off 0 is always an anomaly (set
      `anomaly_mad_floor_abs` to tolerate it). Score: signed distance outside the band, 0 inside.
      is_anomaly: score <> 0 and the min_consecutive - 1 latest history points were also outside their
      own band on the same side. Fewer than 7 history points never flags (baseline
      `insufficient_history`). Timestamps are UTC, as in the event table; observed_at defaults to the
      current UTC time. Known limits: a 4-point bucket minimum means 5 weeks of hourly data are enough
      for seasonality but bands from small buckets are coarse; a steadily growing metric (a table
      that only gains rows) drifts out of a median band and is flagged, mostly at high sensitivity,
      since trend handling (EWMA) is not implemented yet. Called by `score`; returns the contract
      fields plus `baseline` (flat, seasonal, insufficient_history), `history_points` and
      `history_days`.
    arguments:
      - name: series_sql
        type: string
        description: As for `score`.
      - name: current_value
        type: number
        description: As for `score`.
      - name: sensitivity
        type: string
        description: "`low`, `medium` or `high` (already resolved by `score`)."
      - name: min_consecutive
        type: integer
        description: As for `score` (already resolved).
      - name: observed_at
        type: string
        description: As for `score`.

  - name: cortex__score
    description: >
      Cortex engine: scores one series with the SNOWFLAKE.ML.ANOMALY_DETECTION model trained per table
      on all its series (models are refreshed by a task, never trained at test time). One
      DETECT_ANOMALIES call on the existing model, inside a Snowflake Scripting block that catches every
      error, so a missing model, privilege or region never fails a test. prediction_interval is 0.99
      (low), 0.95 (medium) or 0.90 (high); Cortex high is wider than native high (k = 2 MADs, about 82%), so the same sensitivity flags somewhat fewer points with Cortex. Returns `engine` (cortex), `expected` (forecast), `lower`,
      `upper`, `score` (signed distance outside the band, 0 inside, as native) and `is_anomaly` (Cortex
      verdict, and the min_consecutive - 1 latest history points outside the band on the same side).
      When the model cannot score it returns only `error` (code and message) and logs a warning. At parse
      time it returns null. Called by `score`, which falls back to native when it returns `error`.
    arguments:
      - name: model
        type: string
        description: The per-table model, a (qualified) identifier such as `DB.SCHEMA.MODEL`; anything else is refused.
      - name: series
        type: string
        description: The series key as it was given to the model's SERIES_COLNAME at training.
      - name: series_sql
        type: string
        description: As for `score`; only the latest min_consecutive - 1 points are read.
      - name: current_value
        type: number
        description: As for `score`.
      - name: sensitivity
        type: string
        description: "`low`, `medium` or `high` (already resolved)."
      - name: min_consecutive
        type: integer
        description: As for `score` (already resolved).
      - name: observed_at
        type: string
        description: As for `score`.
