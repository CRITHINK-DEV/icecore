version: 2

macros:
  - name: get_columns_signature
    description: >
      Zero-scan schema reader. Returns the relation's columns from SHOW COLUMNS as a list of
      `{name, data_type}`, where `name` is the column name as Snowflake stores it (case preserved) and
      `data_type` is a normalised type string such as `NUMBER(38,0)`, `VARCHAR(16777216)`, `TIMESTAMP_NTZ(9)`,
      `FLOAT`, `BOOLEAN`, `VARIANT`. Works on tables and views. Returns none with a logged warning when the
      relation is missing or not readable; it never fails the run. Column order is not significant:
      `diff_schema` matches columns by name.
    arguments:
      - name: relation
        type: Relation
        description: >
          The relation to read (`ref()`, `source()`, `adapter.get_relation()` or `api.Relation.create()`).
          Its quote policy is honoured: quoted parts keep their case, unquoted parts resolve to upper case.

  - name: diff_schema
    description: >
      Compares two signatures from `get_columns_signature` and returns
      `{added: [{name, data_type}], removed: [{name, data_type}], type_changed: [{name, from_type, to_type}]}`.
      Columns are matched by exact (case-sensitive) name, so a rename shows as one removed and one added
      column. When either signature is none (first observation, or an unreadable relation) all lists are
      empty: the current signature becomes the baseline. Pure Jinja, no query.
    arguments:
      - name: previous
        type: list
        description: The earlier signature, or none.
      - name: current
        type: list
        description: The current signature, or none.
