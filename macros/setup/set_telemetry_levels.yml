version: 2

macros:
  - name: set_telemetry_levels
    description: >
      Makes sure icecore's records are captured, without ACCOUNTADMIN for normal use (spikes/GATE1.md,
      "Prerequisites" and open item 7). Levels belong to the schema that holds the `ICECORE_EMIT` procedures (the obs
      schema), never to the session, the account or the whole database: `LOG_LEVEL` at least INFO and `TRACE_LEVEL`
      ALWAYS, effective on that schema (set there or inherited). `ON_EVENT` is not enough: it lands the span events of
      `ICECORE_EMIT` but drops the explicit spans that `ICECORE_EMIT_RUN` writes without an event (measured 1 Nov 2026,
      `spikes/results/gate1_followups.json`). When the levels are sufficient nothing is changed. Otherwise the one
      statement icecore may run, `ALTER SCHEMA <db>.<schema> SET LOG_LEVEL = 'INFO'` and/or `TRACE_LEVEL = 'ALWAYS'`
      (only the missing ones), is tried inside a guard; it needs `MODIFY LOG LEVEL` and `MODIFY TRACE LEVEL` on the
      account, so when the role lacks them it is printed for an admin and the run goes on. icecore never proposes
      `ALTER DATABASE ... SET TRACE_LEVEL`, which would trace every procedure and UDF in the database. Everything else
      is printed, never run: `ALTER ACCOUNT SET EVENT_TABLE` when no event table is active (ACCOUNTADMIN), and, on
      Enterprise or above when a dedicated table is requested, `CREATE EVENT TABLE`, its clustering key and
      `ALTER DATABASE <db> SET EVENT_TABLE`. On Standard a dedicated table is not available and the account's active
      table is used. A custom event table gets the recommended clustering key `(TO_DATE(TIMESTAMP), RECORD_TYPE)`;
      when the views read the account table, a note says readers need the `SNOWFLAKE.EVENTS_VIEWER` application role.
      Returns `{database, levels_ok, executed, printed, notes}` and logs every line as `icecore: ...`.
    arguments:
      - name: capabilities
        type: dict
        description: >
          The detection result (`icecore.detect_capabilities()`), required. Keys read: `edition` (STANDARD,
          ENTERPRISE, BUSINESS_CRITICAL, VIRTUAL_PRIVATE_SNOWFLAKE or UNKNOWN), `event_table` (the database's
          EVENT_TABLE parameter, empty when none is active), `log_level`, `trace_level` (the database's effective
          values, used when `schema_levels` is not given) and optionally `database`.
      - name: database
        type: string
        description: The target database. Default `capabilities.database`, then `target.database`.
      - name: dedicated_event_table
        type: string
        description: >
          Fully qualified name of a dedicated database-level event table to use (Enterprise or above). Default none:
          use the active event table.
      - name: apply
        type: boolean
        description: >
          Default true: try the schema's level statement (guarded). False: print it instead. No other statement is
          ever run.
      - name: schema
        type: string
        description: The obs schema whose levels are checked and set. Default the `obs_schema` var (`ICECORE_OBS`).
      - name: schema_levels
        type: dict
        description: >
          `{log_level, trace_level}` effective on the schema, as `icecore.schema_levels()` reads them. Default none:
          the database's levels from `capabilities` are checked.

  - name: telemetry_levels_plan
    description: >
      The pure part of `set_telemetry_levels`: what to do for a detection result, with no query. Returns
      `{database, schema, log_level, trace_level, levels_ok, attempt, print, notes}`, where `attempt` only ever holds
      the obs schema's `ALTER SCHEMA ... SET LOG_LEVEL / TRACE_LEVEL` and `print` holds the statements for an admin.
    arguments:
      - name: capabilities
        type: dict
        description: As for `set_telemetry_levels`.
      - name: database
        type: string
        description: As for `set_telemetry_levels`.
      - name: dedicated_event_table
        type: string
        description: As for `set_telemetry_levels`.
      - name: schema
        type: string
        description: As for `set_telemetry_levels`.
      - name: schema_levels
        type: dict
        description: As for `set_telemetry_levels`.

  - name: schema_levels
    description: >
      The `LOG_LEVEL` and `TRACE_LEVEL` effective on the obs schema (`SHOW PARAMETERS LIKE '%LEVEL' IN SCHEMA`: the
      schema's own value, else the database's), as `{log_level, trace_level}`. Returns none when the schema cannot be read
      (it does not exist yet, or the role has no USAGE on it) and at parse time. Read only, inside a guard.
    arguments:
      - name: database
        type: string
        description: The target database.
      - name: schema
        type: string
        description: The obs schema. Default the `obs_schema` var (`ICECORE_OBS`).
