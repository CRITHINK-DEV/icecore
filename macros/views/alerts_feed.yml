version: 2

macros:
  - name: alerts_feed_view_sql
    description: >
      The SELECT of the `alerts_feed` view, one row per incident, deduplicated for the Snowflake ALERT objects and the
      app. It unions failed tests (status fail, error or warn, from the test_results SQL), anomalies (metrics rows
      with anomaly_is_anomaly true) and schema changes, plus two empty slots (silence_events, filled by story
      uc6-silence, and cost_regressions, filled later) that select zero rows with the signal columns. Columns
      `incident_key` (md5 of node_key, kind and window_start), `kind` (test_failure, anomaly, schema_change, silence or
      cost), `node_key`, `window_start`, `severity`, `title`, `first_detected_at`, `last_detected_at`, `occurrences`,
      `last_invocation_id`, `acknowledged_at` and `acknowledged_by` (the earliest `icecore.ack` event of the key,
      null when none). The window is var icecore.alert_window_hours, default 24 hours, so the same failure on two runs
      inside one window is one key and the next window alerts again.
    arguments:
      - name: event_table
        type: string
        description: The relation to read. Default none, resolved with `resolve_event_table` when the macro executes.
      - name: database
        type: string
        description: The database whose procedures wrote the records. Default `target.database`.
      - name: obs_schema
        type: string
        description: The schema holding the emitter procedures. Default the `obs_schema` var.
