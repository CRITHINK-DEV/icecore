version: 2

macros:
  - name: capabilities_view_sql
    description: >
      The SELECT of the `capabilities` view, the latest detection per database. It reads `icecore.base_events()` and
      keeps the `icecore.capabilities` span events with their `icecore.capability.*` keys. Columns:
      `database_name`, `detected_at` (the event TIMESTAMP), `edition`, `edition_source`, `event_table`,
      `event_table_level`, `cortex_available`, `cortex_reason`, `log_level`, `trace_level`, `icecore_version`
      and `invocation_id`.
    arguments:
      - name: event_table
        type: string
        description: The relation to read. Default none, resolved with `resolve_event_table` when the macro executes.
      - name: database
        type: string
        description: The database whose procedures wrote the records. Default `target.database`.
      - name: obs_schema
        type: string
        description: The schema holding the emitter procedures. Default the `obs_schema` var.
