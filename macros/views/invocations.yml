version: 2

macros:
  - name: invocations_view_sql
    description: >
      The SELECT of the `invocations` view, one row per dbt invocation. It reads `icecore.base_events()` and joins on
      `dbt.invocation_id` the `icecore.run_start` span event (ICECORE_EMIT), the `icecore.invocation` span and the
      run-end LOG, `icecore.kind = run_end` (both ICECORE_EMIT_RUN). Columns: `invocation_id`, `runtime`, `command`,
      `target`, `project`, `dbt_version`, `started_at`, `ended_at`, `duration_s`, `status`, `nodes_total`,
      `nodes_success`, `nodes_failed`, `nodes_warned`, `nodes_skipped`, `credits`. `status` is the run-end LOG's
      `dbt.invocation.status` (success, warn or error). A run with a start and no end shows `running` when its start
      record landed less than 24 hours ago, else `unfinished`, with `ended_at` and the counts null. `credits` is null
      until cost attribution (UC4) writes it. Clocks: `started_at`, `ended_at` and `duration_s` are dbt's clock, the
      dbt host's, read from the `dbt.invocation.*` attributes; the TIMESTAMP of the records is Snowflake's clock, the
      time of the CALL. The two are never subtracted from each other.
    arguments:
      - name: event_table
        type: string
        description: The relation to read. Default none, resolved with `resolve_event_table` when the macro executes.
      - name: database
        type: string
        description: The database whose procedures wrote the records. Default `target.database`.
      - name: obs_schema
        type: string
        description: The schema holding the emitter procedures. Default the `obs_schema` var.
