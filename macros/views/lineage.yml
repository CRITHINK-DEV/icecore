version: 2

macros:
  - name: lineage_view_sql
    description: >
      The SELECT of the `lineage` view, one row per edge per invocation. It reads `icecore.base_events()`, keeps the
      LOG records `icecore.kind = lineage` and flattens their `dbt.lineage.edges` lists (a run's edges may span
      several records). Columns: `invocation_id`, `project`, `parent_unique_id`, `child_unique_id`, `recorded_at`.
    arguments:
      - name: event_table
        type: string
        description: The relation to read. Default none, resolved with `resolve_event_table` when the macro executes.
      - name: database
        type: string
        description: The database whose procedures wrote the records. Default `target.database`.
      - name: obs_schema
        type: string
        description: The schema holding the emitter procedures. Default the `obs_schema` var.
  - name: lineage_latest_view_sql
    description: >
      The SELECT of the `lineage_latest` view: the same columns as `lineage`, only the edges of each project's
      latest invocation that emitted lineage.
    arguments:
      - name: event_table
        type: string
        description: The relation to read. Default none, resolved with `resolve_event_table` when the macro executes.
      - name: database
        type: string
        description: The database whose procedures wrote the records. Default `target.database`.
      - name: obs_schema
        type: string
        description: The schema holding the emitter procedures. Default the `obs_schema` var.
