version: 2

macros:
  - name: schema_changes_view_sql
    description: >
      The SELECT of the `schema_changes` view, one row per detected column change. It reads `icecore.base_events()`
      and keeps the span events named `icecore.schema_change`. Columns: `relation`, `change_kind` (added, removed or
      type_changed), `"COLUMN"` (quote it, COLUMN is a reserved word), `from_type`, `to_type`, `detected_at` (the event
      TIMESTAMP), `invocation_id`, `node_unique_id`, `emit_query_id`. Nothing emits these records yet; the keys are
      the spec's, `dbt.schema.change_kind`, `dbt.schema.column`, `dbt.schema.from_type` and `dbt.schema.to_type`
      next to `dbt.node.relation`, and the story that emits them must write exactly these. A missing key reads as null.
    arguments:
      - name: event_table
        type: string
        description: The relation to read. Default none, resolved with `resolve_event_table` when the macro executes.
      - name: database
        type: string
        description: The database whose procedures wrote the records. Default `target.database`.
      - name: obs_schema
        type: string
        description: The schema holding the emitter procedures. Default the `obs_schema` var.
