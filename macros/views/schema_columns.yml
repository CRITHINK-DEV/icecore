version: 2

macros:
  - name: schema_columns_view_sql
    description: >
      The SELECT of the `schema_columns` view, one row per column per schema_changes run (the full column state, not
      the changes). It reads `icecore.base_events()` and the span events named `icecore.schema_signature`, which the
      schema_changes test writes on every run, one per chunk of columns under the payload cap. Columns: `relation`,
      `"COLUMN"` (quote it), `data_type`, `snapshot_at` (the same for every column of one run), `is_new` (not in the
      previous snapshot of the relation; true on the first) and `invocation_id`.
    arguments:
      - name: event_table
        type: string
        description: The relation to read. Default none, resolved with `resolve_event_table` when the macro executes.
      - name: database
        type: string
        description: The database whose procedures wrote the records. Default `target.database`.
      - name: obs_schema
        type: string
        description: The schema holding the emitter procedures. Default the `obs_schema` var.
