version: 2

macros:
  - name: silence_events_view_sql
    description: >
      The SELECT of the `silence_events` view, one row per missed run. It reads `icecore.base_events()` and keeps the
      `icecore.silence` span events that the silence task writes through `ICECORE_EMIT`. Columns: `unique_id`,
      `expected_at`, `grace` (minutes), `expected_every_minutes`, `last_success_at`, `detected_at`, `channel`,
      `severity`. `expected_at` and `last_success_at` are keys of the verdict, UTC to the second, computed on
      Snowflake's clock from the TIMESTAMP of the node-result records; `detected_at` is the TIMESTAMP of the verdict
      record, Snowflake's clock too.
    arguments:
      - name: event_table
        type: string
        description: The relation to read. Default none, resolved with `resolve_event_table` when the macro executes.
      - name: database
        type: string
        description: The database whose procedures wrote the records. Default `target.database`.
      - name: obs_schema
        type: string
        description: The schema holding the emitter procedures. Default the `obs_schema` var.
