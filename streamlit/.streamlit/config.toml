# The Console's look: neutral greys and one accent, light and dark. No other CSS in the app.
[theme]
base = "light"
primaryColor = "#3b5bdb"
font = "sans serif"

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#1f2328"
primaryColor = "#3b5bdb"

[theme.dark]
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f29"
textColor = "#e6e8eb"
primaryColor = "#748ffc"
