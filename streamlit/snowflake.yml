# Manual sandbox deployment of the app shell with the Snowflake CLI (snow streamlit deploy).
# Production deployment is setup(app=true) from a Snowflake Git repository object.
definition_version: 2
entities:
  icecore_app_shell:
    type: streamlit
    identifier:
      name: ICECORE_APP_SHELL
      database: ICECORE_SANDBOX
      schema: SPIKES
    title: icecore
    query_warehouse: ICECORE_CI_WH
    # Warehouse runtime: packages come from environment.yml (Snowflake Anaconda channel).
    # Without it the account default (container runtime) ignores environment.yml.
    runtime_name: SYSTEM$WAREHOUSE_RUNTIME
    main_file: streamlit_app.py
    artifacts:
      - streamlit_app.py
      - environment.yml
      - .streamlit/config.toml
      - lib/__init__.py
      - lib/ack.py
      - lib/charts.py
      - lib/console.py
      - lib/cost.py
      - lib/dag.py
      - lib/lineage_component.py
      - lib/navigation.py
      - lib/queries.py
      - lib/runs_logic.py
      - lib/settings.py
      - lib/slas.py
      - lib/status.py
      - lib/ui.py
      - lib/pages/__init__.py
      - lib/pages/lineage.py
      - src: components/lineage/build/**
        dest: components/lineage/build
      - pages/cost.py
      - pages/incidents.py
      - pages/lineage.py
      - pages/node.py
      - pages/overview.py
      - pages/runs.py
      - pages/schedules.py
      - pages/schema_changes.py
      - pages/settings.py
      - pages/tests_and_anomalies.py
