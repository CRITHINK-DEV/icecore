version: 2

macros:
  - name: test_all_columns_anomaly
    description: >
      Applies the column metrics to every column of the relation in one test, so one line of YAML covers a model.
      The columns are read with SHOW COLUMNS and `exclude_columns` are skipped. One change window is opened (CHANGES, or
      `timestamp_column` when change tracking does not cover it) and each column's metrics are computed over the
      changed rows only (one query per column), written through `icecore.emit_metric` one per metric with the column,
      and checked against the static `bounds`, which apply to every column that has that metric. The default metrics
      are `window_rows` and `null_rate`; avg, min and max are skipped, with a logged warning, on columns that are not
      numeric. Each value is also scored against its own history (`icecore.score_monitor_metrics`: one query per 25
      metrics) and written with its result (`METRICS.anomaly_*`); the test fails on a bound breach (hard threshold); an anomaly only warns by default (status `warn`); it fails the test when var `anomaly_severity` is `error`. A hard threshold of this test fails it. The test sets `config(severity='error', warn_if='>=1', error_if='>=2' or '>=1')` and returns 1 row for anomalies and 2 or more for a hard breach; `severity`, `warn_if` or `error_if` written on the test in your project win. The history is this test's own (its `unique_id`), never another test's on the same series. Native engine cost: one query per 25 metrics; engine cortex or auto adds the Cortex calls for series of 14+ days (once per relation when the model cannot score). A metric with fewer
      than `min_points` history points is not scored (an info line says so). The previous observation is the newest column metric record of the
      relation, read through `icecore.base_events()`; with none the window starts `lookback_hours` ago, and `since`
      overrides both. When no window or no column list can be read the readers log why, no metric is written and the
      test passes. A failed telemetry CALL is a logged warning and never changes the verdict. Example,
      `data_tests: [icecore.all_columns_anomaly: {exclude_columns: [loaded_at]}]`.
    arguments:
      - name: model
        type: relation
        description: The relation under test, filled in by dbt.
      - name: exclude_columns
        type: list
        description: Columns to skip, matched like column names in SQL (a plain name is upper case, a double-quoted one is exact). Optional.
      - name: metrics
        type: list
        description: Metrics per column, from window_rows, null_rate, avg, min and max. Default `[window_rows, null_rate]`.
      - name: bounds
        type: dictionary
        description: >
          Static limits per metric, a mapping of metric to min and max numbers; every metric named must be in `metrics`.
          Optional.
      - name: since
        type: string
        description: ISO 8601 start of the window. Optional; overrides the previous observation.
      - name: timestamp_column
        type: string
        description: Date or timestamp column used when CHANGES is unavailable. Optional.
      - name: lookback_hours
        type: number
        description: Window length when there is no previous observation and no `since`. Default 24.
      - name: engine
        type: string
        description: "`native`, `cortex` or `auto`, for this test. Default `var('icecore').anomaly_engine` (auto)."
      - name: sensitivity
        type: string
        description: "`low`, `medium` or `high`, for this test. Default `var('icecore').anomaly_sensitivity` (medium)."
      - name: min_consecutive
        type: integer
        description: "Consecutive out-of-band observations needed, for this test. Default `var('icecore').anomaly_min_consecutive` (1)."
      - name: lookback_days
        type: integer
        description: History window in days. Default 30.
      - name: min_points
        type: integer
        description: Fewer history points than this are not scored (insufficient history). Default 7.
      - name: shadow_engine
        type: string
        description: "`none`, `native` or `cortex`, for this test. Default `var('icecore').shadow_engine` (none)."
