version: 2

macros:
  - name: test_column_anomaly
    description: >
      Incremental column metrics test. Reads only the rows that changed since the previous observation (CHANGES,
      or `timestamp_column` when change tracking does not cover the window), computes the requested metrics over
      them, writes each as a metric span event through `icecore.emit_metric` (one per metric, with the column), and
      fails when a value is outside its static `bounds`. Each value is also scored against its own history
      (`icecore.score_monitor_metrics`: one query for the test) and written with its result (`METRICS.anomaly_*`); the test fails
      on a bound breach (hard threshold); an anomaly only warns by default (the test passes and logs a warning); it fails the test when var `anomaly_severity` is `error` or the test sets `severity: error` itself. A hard threshold of this test still fails at the test's own severity. The history is this test's own (its `unique_id`), never another test's on the same series. Native engine cost: 1 query for the test; engine cortex or auto adds the Cortex calls for series of 14+ days (once per relation when the model cannot score). A metric with fewer than `min_points` history points is not scored (an info line says so). The window end is read from Snowflake's
      clock before the read and recorded on every metric (`dbt.window.until`), and the next run starts its window there, so
      no row falls between two runs. The previous observation is the newest metric record of the tested column, read
      through `icecore.base_events()`; with none the window
      starts `lookback_hours` ago, and `since` overrides both. A value that is null (an empty window, or no
      non-null values) is not written and not checked. When no window can be read (no change tracking and no usable
      timestamp column, a missing column) the readers log why, no metric is written and the test passes. A failed
      telemetry CALL is a logged warning and never changes the verdict. CHANGES is cheap for insert-only windows and
      can cost more than a full scan after deletes, updates or merges (spike S5). Example, `columns: [{name: amount,
      data_tests: [icecore.column_anomaly: {metrics: [null_rate, avg, max], bounds: {null_rate: {max: 0.05}}}]}]`.
    arguments:
      - name: model
        type: relation
        description: The relation under test, filled in by dbt.
      - name: column_name
        type: string
        description: The tested column, filled in by dbt.
      - name: metrics
        type: list
        description: >
          Metrics to compute, from window_rows, null_rate, avg, min and max (avg, min and max need a numeric column).
          Default `[window_rows, null_rate]`.
      - name: bounds
        type: dictionary
        description: >
          Static limits per metric, `{metric: {min: n, max: n}}` with at least one of the two. Every metric named here
          must be in `metrics`. Optional; without it the test only records the metrics and passes.
      - name: since
        type: string
        description: >
          ISO 8601 start of the window, for example `2026-10-31T08:00:00.000000Z`. Optional; overrides the previous
          observation.
      - name: timestamp_column
        type: string
        description: Date or timestamp column used when CHANGES is unavailable. Optional.
      - name: lookback_hours
        type: number
        description: Window length when there is no previous observation and no `since`. Default 24.
      - name: window_tag
        type: string
        description: >
          Name of this test's window. Two column_anomaly tests on the same column and relation should each have their
          own, so one test's window end does not move the other's. Optional; without it the tests of a column share
          one window.
      - name: engine
        type: string
        description: "`native`, `cortex` or `auto`, for this test. Default `var('icecore').anomaly_engine` (auto)."
      - name: sensitivity
        type: string
        description: "`low`, `medium` or `high`, for this test. Default `var('icecore').anomaly_sensitivity` (medium)."
      - name: min_consecutive
        type: integer
        description: "Consecutive out-of-band observations needed, for this test. Default `var('icecore').anomaly_min_consecutive` (1)."
      - name: lookback_days
        type: integer
        description: History window in days. Default 30.
      - name: min_points
        type: integer
        description: Fewer history points than this are not scored (insufficient history). Default 7.
      - name: shadow_engine
        type: string
        description: "`none`, `native` or `cortex`, for this test. Default `var('icecore').shadow_engine` (none)."
