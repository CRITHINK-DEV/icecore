version: 2

macros:
  - name: test_freshness
    description: >
      Zero-scan freshness test. Reads the time of the last committed change of the tested relation from
      SYSTEM$LAST_CHANGE_COMMIT_TIME (no data scan), measures the lag against Snowflake's clock, writes it as the
      metric `freshness_lag_seconds` through `icecore.emit_metric`, and fails when the lag is above `max_lag`.
      Without `max_lag` it only records the metric and always passes. The verdict comes only from that comparison:
      a failed telemetry CALL is a logged warning and never changes the result. When no last change time can be read
      (never written, or not readable) the reader logs why and no metric is written; the test passes without `max_lag`, and with `max_lag` it returns one row `unmeasured: <reason>` so its severity applies. The lag is also scored against the
      history of `freshness_lag_seconds` (`icecore.score_monitor_metrics`: one query, the lag-aware history reader's window) and
      written with its result (`METRICS.anomaly_*`); the test fails on `max_lag` (hard threshold); an anomaly only warns by default (the test passes and logs a warning); it fails the test when var `anomaly_severity` is `error` or the test sets `severity: error` itself. A hard threshold of this test still fails at the test's own severity. The history is this test's own (its `unique_id`), never another test's on the same series. Native engine cost: 1 query; engine cortex or auto adds the Cortex calls for series of 14+ days (once per relation when the model cannot score). Fewer
      than `min_points` history points: not scored and an info line says so, never an error. Use `severity: warn` in the
      test config to warn instead of failing. Example, `data_tests: [icecore.freshness: {max_lag: 2h}]`.
    arguments:
      - name: model
        type: relation
        description: The relation under test, filled in by dbt.
      - name: max_lag
        type: string
        description: >
          Largest accepted lag, a number of seconds or a number with a unit s, m, h or d, for example 30m, 2h or 1d.
          Optional.
      - name: engine
        type: string
        description: "`native`, `cortex` or `auto`, for this test. Default `var('icecore').anomaly_engine` (auto)."
      - name: sensitivity
        type: string
        description: "`low`, `medium` or `high`, for this test. Default `var('icecore').anomaly_sensitivity` (medium)."
      - name: min_consecutive
        type: integer
        description: "Consecutive out-of-band observations needed, for this test. Default `var('icecore').anomaly_min_consecutive` (1)."
      - name: lookback_days
        type: integer
        description: History window in days. Default 30.
      - name: min_points
        type: integer
        description: Fewer history points than this are not scored (insufficient history). Default 7.
      - name: shadow_engine
        type: string
        description: "`none`, `native` or `cortex`, for this test. Default `var('icecore').shadow_engine` (none)."
